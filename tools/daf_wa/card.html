<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
/* כרטיס התצוגה המקדימה של הדף (פרומפט 23): 1200x480, בשפת הסמל של האתר (og-image): כחול קטיפה, מסגרת זהב כפולה, ל' מזהב.
   כל התוכן בתוך המרכז (917 פיקסלים), כדי שגם חיתוך ליחס 1.91 (פייסבוק ודומיו) לא יקצץ אותו.
   8.11.2026 (בעל הפרויקט): שם הדף בוילנא, הכרטיס נמוך - שלא יתפוס יותר מדי מן המסך, ונראות מכובדת. בלי רקעי הדגשה מאחורי טקסט. */
@font-face{font-family:'Frank';src:url(@@FONTS@@/frank.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Vilna';src:url(@@FONTS@@/vilna-r.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Vilna';src:url(@@FONTS@@/vilna-b.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1200px;height:480px;overflow:hidden}
body{background:radial-gradient(90% 120% at 60% 30%,#173d5c 0%,#10283d 48%,#0a1824 100%);font-family:'Frank',serif;position:relative}
.f1{position:absolute;inset:18px;border:3px solid #c9a24a}
.f2{position:absolute;inset:28px;border:1px solid rgba(214,180,100,.55)}
.gold{background:linear-gradient(180deg,#fbe7a6 0%,#efc96a 38%,#d9a53f 62%,#b98327 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 3px 0 rgba(40,24,6,.75)) drop-shadow(0 0 18px rgba(240,200,110,.18))}
.lam{position:absolute;right:178px;top:50%;transform:translateY(-52%);font-family:'Vilna',serif;font-weight:700;font-size:330px;line-height:1}
.sep{position:absolute;right:400px;top:78px;bottom:78px;width:1px;background:linear-gradient(180deg,transparent,rgba(214,180,100,.75),transparent)}
.txt{position:absolute;right:420px;left:150px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brand{font-family:'Vilna',serif;font-weight:700;font-size:27px;letter-spacing:.2em;color:#c9a24a}
.daf{font-family:'Vilna',serif;font-weight:700;font-size:104px;line-height:1.08;margin:10px 0 6px;white-space:nowrap}
.rule{width:300px;height:1.5px;background:linear-gradient(90deg,transparent,#d6b464 20%,#f0d690 50%,#d6b464 80%,transparent);margin:6px 0 18px}
.line{font-family:'Frank',serif;font-size:36px;line-height:1.3;color:#efe3c4;max-width:620px}
</style></head><body>
<div class="f1"></div><div class="f2"></div>
<div class="lam gold">ל</div>
<div class="sep"></div>
<div class="txt">
  <div class="brand">לאוקמי גירסא · הדף היומי</div>
  <div class="daf gold">@@DAF@@</div>
  <div class="rule"></div>
  <div class="line">@@LINE@@</div>
</div>
<script>
/* שם מסכת ארוך: מקטינים עד שנכנס בשורה אחת */
window.fit=function(){var d=document.querySelector('.daf'),w=d.parentNode.clientWidth,f=104;d.style.fontSize=f+'px';while(d.scrollWidth>w&&f>60){f-=4;d.style.fontSize=f+'px'}};fit();
</script>
</body></html>
