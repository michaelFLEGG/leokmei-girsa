"", "הזמן המועד הוא ברגלים."]], "id": 6380}, {"k": "u", "a": "מעשה:", "l": [["", "בשבויות שבאו לנהרדעא, והעלום לרב עמרם חסידא, ולקחו הסולם תחתיהם וכשחלפה אחת מהם הגיע אורה לפתח, לקח ר&quot;ע לבדו סולם שעשרה לא יכולים להרימו ועלה, וכשהגיע לאמצע הסולם פיסק רגליו והרים קולו שאש בבי עמרם, והגיעו רבנן וכשראו אמרו שביישם,"]], "id": 6382}, {"k": "u", "a": "אמר להם:", "l": [["", "מוטב שתתביישו בעמרם בעוה&quot;ז ולא בעולם הבא,"], ["", "השביע יצרו ויצא ממנו כעמוד של אש,"]], "id": 6384}, {"k": "u", "a": "א&quot;ל:", "l": [["", "ראה שאתה אש ואני בשר ואני עדיף ממך."]], "id": 6387}, {"k": "u", "a": "• ר&quot;מ:", "l": [["", "הוה מתלוצץ בעוברי עבירה, יום אחד נדמה לו שטן כאשה בצד הנהר ולא היה גשר, לקח חבל ועבר, כשהגיע לאמצע עזבו, ואמר אי לא היו מכריזים ברקיע הזהרו בר&quot;מ ותורתו הייתי משווה חייך לשני מעות [הורגך]"]], "id": 6389}, {"k": "u", "a": "• ר&quot;ע:", "l": [["", "היה מתלוצץ בעוברי עבירה, יום אחד נדמה לו שטן כאשה בראש הדקל אחז בדקל ועלה כשהגיע לאמצע הדקל עזבו, אמר אי לאו דמכרזי ברקיע הזהרו בר&quot;ע ותורתו, משווך לדמך לשני מעות [הורגך]"]], "id": 6391}, {"k": "u", "a": "• פלימו:", "l": [["", "היה רגיל לומר כל יום: גירא בעיניה דשטן."], ["", "ערב יום כיפור אחד נדמה לו כעני, קרא והוציאו לו לחם,"], ["", "<i class=\"am\">א&quot;ל<\/i> יום זה כולם בפנים ואני בחוץ, הכניסו לפנים והביא לו לחם,"], ["", "<i class=\"am\">א&quot;ל <\/i>יום זה הכל אוכלים על השולחן ואני לא והושיבוהו על השולחן, ישב ומילא עצמו בשחין ופצעים ועשה דברים מאוסים,"], ["", "<i class=\"am\">א&quot;ל פלימו: <\/i>שישב כמו שצריך,<i class=\"am\"> א&quot;ל <\/i>תנו לי כוס יין הביאו לו וירק בזה כיחו, גערו בו והעמיד עצמו כמת."], ["", "ושמעו שהיה הקול יוצא פלימו הרג אדם, – ברח והחביא עצמו בבית הכסא, הלך השד אחריו ונפל לפניו כמת, וכשראה שהיה מצטער ביותר גילה עצמו לפלימו. וא&quot;ל מפני מה אתה אומר כן, <i class=\"am\">א&quot;ל <\/i>ואיך אומר <i class=\"am\">א&quot;ל <\/i>שיכול לומר<i class=\"ps\"> &#x27;רחמנא נגער בשטן&#x27;.<\/i>"]], "id": 6393}, {"k": "u", "a": "• רחב&quot;א:", "l": [["", "היה רגיל כל פעם שנפל על פניו לומר הרחמן יצילנו מיצר הרע"], ["", "יום אחד שמעה אשתו אמרה מכדי כמה שנים שפורש ממני למה אומר כן, העמידה עצמה בגינתו התקשטה ועברה לפניו, שאלה מי היא <i class=\"am\">א&quot;ל<\/i> אני חרותא [שם זונה] שחזרתי היום, תבעה, אמרה לו הבא לי הרימון שבראש העץ, קפץ והביא לה, כששב לביתו הסיקה אשתו התנור עלה וישב בו, <i class=\"am\">אמרה לו <\/i>מדוע, סיפר לה כל המעשה <i class=\"am\">אמרה<\/i> אני הייתי ולא האמינה, עד שנתנה הסימן של הרימון"], ["", "<i class=\"am\">אמר,<\/i> שמ&#x27;&#x27;מ הוא לאיסור התכוון."], ["", "וכל ימיו של אותו צדיק היה מתענה, עד שמת באותה מיתה."]], "id": 6400}, {"k": "u", "a": "דתניא:", "l": [["", "<i class=\"ps\">&#x27;אישה הפרם וה&#x27; יסלח לה&#x27;<\/i> - מה הכתוב מדבר? באשה שנדרה בנזיר ושמע בעלה והפר לה,"], ["", "והיא לא ידעה שהפר לה בעלה, והיתה שותה יין ומטמאה למתים."]], "id": 6405}, {"k": "u", "a": "ר&quot;ע:", "l": [["", "כשהגיע לפסוק זה בכה ואמר: ומה מי שנתכוין לאכול בשר חזיר ועלה בידו בשר טלה, אמרה תורה: צריכה כפרה וסליחה,"], ["", "מי שנתכוין לאכול בשר חזיר ועלה בידו בשר חזיר – עאכו&quot;כ,"]], "id": 6408}, {"k": "u", "a": "• כיוצא בדבר:", "l": [["", "<i class=\"ps\">&#x27;ולא ידע ואשם ונשא עונו&#x27;,<\/i> כשר&quot;ע הגיע לפסוק זה היה בוכה, ומה מי שנתכוין לאכול שומן ועלה בידו חלב,<i class=\"am\"> כ&#x27;&#x27;ש<\/i> מי שנתכוין לאכול חלב ועלה בידו חלב עאכו&quot;כ"]], "id": 6411}, {"k": "u", "a": "איסי בן יהודה:", "l": [["", "<i class=\"ps\">&#x27;ולא ידע ואשם ונשא עונו<\/i>&#x27; - על דבר זה ידוו כל הדווים."]], "id": 6413}, {"k": "hatz", "a": "׹", "l": [], "id": 6415}, {"k": "dh", "a": "מתייחד אדם עם אמו.", "l": [], "id": 6416}, {"k": "u", "a": "ר&#x27;י מרב אסי:", "l": [["", "מתייחד אדם עם אחותו, ודר עם אמו ועם בתו."]], "id": 6417}, {"k": "u", "a": "כשאמרה לפני שמואל:", "l": [["", "אסור להתייחד עם כל עריות שבתורה, ואפילו עם בהמה."]], "id": 6419}, {"k": "u", "a": "ותיובתא לשמואל:", "l": [["", "<i class=\"am\">דתנן:<\/i> מתייחד אדם עם אמו ועם בתו, וישן עמהם בקירוב בשר."]], "id": 6421}, {"k": "u", "a": "שמואל יענה:", "l": [["", "וליטעמיך הא דאחותו וחמותו ושאר כל עריות שבתורה - אין מתייחד עמהם אלא בעדים. שלא בעדים לא? – אלא תנאי היא."]], "id": 6423}, {"k": "u", "a": "דתניא אר&#x27;&#x27;מ:", "l": [["", "הזהרו בי מפני בתי."]], "id": 6425}, {"k": "u", "a": "אר&quot;ט:", "l": [["", "הזהרו בי מפני כלתי. ליגלג עליו אותו תלמיד"]], "id": 6427}, {"k": "u", "a": "ר&quot;א מרחב&quot;ג:", "l": [["", "לא היו ימים מועטים, עד שנכשל אותו תלמיד בחמותו."]], "id": 6429}, {"k": "nose", "a": "***", "l": [], "id": 6431}, {"k": "nose", "a": "אפילו עם בהמה.", "l": [], "id": 6432}, {"k": "u", "a": "", "l": [["", "<i class=\"am\">אביי<\/i> היה מוציאם מכל השדה, <i class=\"am\">רב ששת<\/i> מעבירם מעבר לנהר,"]], "id": 6433}, {"k": "u", "a": "ר&quot;ח מנהרדעא:", "l": [["", "הזדמן לר&quot;כ לפום נהרא, ראו שגורס בשדה והיתה בהמה לפניו."], ["", "<i class=\"am\">שאלו<\/i> אם לא ס&quot;ל הא דאפי&#x27; עם בהמה <i class=\"am\">א&quot;ל<\/i> שלא ראה אותה"]], "id": 6434}, {"k": "u", "a": "רבא:", "l": [["", "מתייחד אדם עם שתי יבמות, ועם שתי צרות, עם אשה וחמותה, עם אשה ובת בעלה,"], ["", "עם אשה ותינוקת שיודעת טעם ביאה ואין מוסרת עצמה לביאה."]], "id": 6437}, {"k": "hatz", "a": "׹", "l": [], "id": 6440}, {"k": "dh", "a": "הגדילו - זה ישן בכסותו וכו&#x27;.", "l": [], "id": 6441}, {"k": "nose", "a": "וכמה?", "l": [], "id": 6442}, {"k": "u", "a": "אראב&quot;ע מר&quot;א:", "l": [["", "תינוקת - בת ט&#x27; שנים ויום אחד, תינוק - בן י&#x27;&#x27;ב שנה ויום אחד."]], "id": 6443}, {"k": "u", "a": "א&quot;ד:", "l": [["", "תינוקת - בת י&#x27;&#x27;ב שנה ויום אחד, תינוק - בן י&#x27;&#x27;ג שנה ויום אחד."], ["", "וזה וזה, כדי שיהיו שדים נכונו ושערך צמח."]], "id": 6445}, {"k": "u", "a": "רב&quot;פ מר&quot;ח:", "l": [["", "רק כשלא בושה לעמוד לפניו ערום, אבל בושה אסור דיצר אלבשה."]], "id": 6448}, {"k": "u", "a": "ראב&quot;א:", "l": [["", "<i class=\"am\">הזדמן לר&#x27;&#x27;ח חתנו<\/i> והושיב בת ביתו בחיקו<i class=\"am\"> א&quot;ל<\/i> לא ידעת שנתקדשה?"]], "id": 6450}, {"k": "u", "a": "א&quot;ל:", "l": [["", "שעבר על דברי רב דאסור לאדם שיקדש את בתו כשהיא קטנה, עד שתגדיל ו   let cur=0;

  /* כיוון הגלילה בטורים מימין לשמאל אינו זהה בכל הדפדפנים, ולכן הוא נמדד ולא מנוחש */
  let SGN=-1;
  (function(){const t=document.createElement('div');t.style.cssText='position:absolute;top:-999px;width:60px;height:10px;overflow:auto;direction:rtl';
    t.innerHTML='<div style="width:300px;height:4px"></div>';document.body.appendChild(t);t.scrollLeft=2;SGN=t.scrollLeft>0?1:-1;t.remove()})();

  function unitHTML(u,daf,pi){
    const mk=daf!=null?`<b class="dafmark" id="d${pi}">${esc(daf)}</b>`:'';
    if(u.k==='u')return `<div class="row u" id="u${u.id}"><div class="rail">${mk}<span class="anchor">${u.a}</span></div><div class="main">${u.l.map(l=>`<p class="${l[0]}">${l[1]}</p>`).join('')}</div></div>`;
    if(u.k==='m')return `<div class="row" id="u${u.id}"><div class="rail">${mk}<span class="mlabel">משנה</span></div><div class="main mishna">${u.l.map(l=>`<p>${l[1]}</p>`).join('')}</div></div>`;
    if(u.k==='hatz')return `<div class="row" id="u${u.id}"><div class="rail">${mk}</div><div class="main hatz">* * *</div></div>`;
    return `<div class="row ${u.k}" id="u${u.id}"><div class="rail">${mk}</div><div class="main ${u.k==='dh'||u.k==='nose'?u.k:''}">${u.a}</div></div>`;
  }
  function render(si,q){
    cur=Math.max(0,Math.min(SEC.length-1,si));const s=SEC[cur];let h='';
    for(let pi=s.from;pi<=s.to;pi++){const p=D.pages[pi];
      if(!p.units.length){h+=`<div class="row"><div class="rail"><b class="dafmark" id="d${pi}">${esc(p.daf)}</b></div><div class="main"></div></div>`;continue}
      let first=true;
      for(const u of p.units){h+=unitHTML(u,first?p.daf:null,first?pi:null);first=false}}
    const f=$('#flow');f.innerHTML=q?hl(h,esc(q).replace(/"/g,'&quot;').replace(/'/g,'&#x27;')):h;
    f.scrollTop=0;f.scrollLeft=0;
    $('#peresel').value=cur;$('#curdaf').textContent=D.pages[s.from].daf;$('#dafsel').value=s.from;
    document.title=`לאוקמי גירסא · ${D.masechet} · ${s.perekName||s.perek||D.pages[s.from].daf}`;
    location.hash=`p=${cur}`;
  }
  function hl(h,q){const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');return h.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(r,'<mark>$1</mark>')+'<')}
  function toDaf(pi){const si=secOf(pi);if(si!==cur)render(si);
    setTimeout(()=>{const e=$('#d'+pi);if(e)e.scrollIntoView({inline:'start',block:'nearest'});$('#curdaf').textContent=D.pages[pi].daf;$('#dafsel').value=pi},20)}
  function goDaf(d){const now=+$('#dafsel').value||0;toDaf(Math.max(0,Math.min(D.pages.length-1,now+d)))}
  function goScreen(d){const f=$('#flow');
    if(f.classList.contains('vert'))f.scrollBy({top:d*f.clientHeight*.9});else f.scrollBy({left:d*SGN*f.clientWidth})}
  function fs(d){const r=document.documentElement;
    const v=Math.max(12,Math.min(60,parseFloat(getComputedStyle(r).getPropertyValue('--fs'))+d));setFs(v)}
  function setFs(v){document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('lg-fs',v);sizeBtns(v)}
  function sizeBtns(v){document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',+b.dataset.fs===+v))}
  function vert(){const v=$('#flow').classList.toggle('vert');
    localStorage.setItem('lg-vert',v?'1':'');$('#vbtn').classList.toggle('on',v)}
  function panel(id){const p=$('#'+id),o=p.classList.contains('open');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(!o)p.classList.add('open')}
  function dec(s){return s.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&')}
  function txt(u){return dec(u.a.replace(/<[^>]+>/g,'')+' '+u.l.map(l=>l[1].replace(/<[^>]+>/g,'')).join(' '))}
  function search(q){q=q.trim();LASTQ=q;const out=$('#sres');if(q.length<2){out.innerHTML='';return}
   RES=[];let res=RES,n=0;D.pages.forEach((p,pi)=>{for(const u of p.units){const t=txt(u);const k=t.indexOf(q);if(k>-1){n++;if(res.length<120)res.push({pi,id:u.id,daf:p.daf,s:t.slice(Math.max(0,k-40),k+60)})}}});
   out.innerHTML=`<div class="n">${n} תוצאות</div>`+res.map((r,i)=>`<div class="res"><a onclick="jumpR(${i})"><small>${r.daf}</small> …${esc(r.s).replace(esc(q),'<mark>'+esc(q)+'</mark>')}…</a></div>`).join('');
   $('#search').classList.add('open')}
  let RES=[],LASTQ='';function jumpR(i){jump(RES[i].pi,RES[i].id,LASTQ)}
  function jump(pi,id,q){const si=secOf(pi);render(si,q);
    setTimeout(()=>{const e=$('#u'+id);if(e){e.classList.add('hit');e.scrollIntoView({inline:'center',block:'nearest'})}$('#dafsel').value=pi;$('#curdaf').textContent=D.pages[pi].daf},20)}
  function amq(i){$('#q').value=D.am[i][0];search(D.am[i][0])}
  function build(){
   const ds=$('#dafsel');D.pages.forEach((p,i)=>ds.add(new Option(p.daf,i)));ds.onchange=()=>toDaf(+ds.value);
   const ps=$('#peresel');SEC.forEach((s,i)=>ps.add(new Option((s.perek||'רצף')+(s.perekName?' · '+s.perekName:''),i)));ps.onchange=()=>render(+ps.value);
   let t='',lp=-1;for(const [pi,id,s] of D.toc){const si=secOf(pi);
     if(si!==lp){lp=si;t+=`<h3>${esc(SEC[si].perek||'')} ${esc(SEC[si].perekName||'')}</h3>`}
     t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft+=SGN*e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
