name: סכם - סנכרון התור וההצעות
# פרומפט 15 (28.10.2026). "סכם פרק" בדף נכנס לתור בנקודת הקליטה; כאן הוא יורד
# לריפו (data/sakem/queue), והצעות שהמשימה המתוזמנת בענן כתבה (data/sakem/out)
# עולות חזרה לשרת, וההכרעות של פרק שנסקר יורדות ללמידה (data/sakem/decisions).
# הסבר מלא: docs/sakem-runner.md
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['data/sakem/out/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakem-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: סנכרון
        env:
          LEOKMEI_ADMIN_KEY: ${{ secrets.LEOKMEI_ADMIN_KEY }}
        run: python tools/sakem/sync.py
      - name: שמירה בריפו
        run: |
          git config user.name "leokmei-sakem"
          git config user.email "sakem@leokmei.com"
          git add data/sakem
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "סכם: סנכרון התור וההצעות [skip ci]"
          # 29.10: שתי הרצות בבת אחת התנגשו ב-sync-state.json, והלולאה נכשלה בשקט עם "הצלחה".
          # במצב התנגשות - הגרסה של הרצה זו (החדשה) גוברת; ואם הדחיפה לא עלתה - כישלון רועש.
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -q -X theirs && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::error::הדחיפה לריפו נכשלה שלוש פעמים"; exit 1; fi
