 נידון בסקילה, על אשת איש - נידון בחנק. ואי בדינם סייף הוא."]], "id": 6264}, {"k": "u", "a": "ג.ארנב&#x27;&#x27;י", "l": [["", "אשת איש דתני שנכנסה לחופה ולא נבעלה, <i class=\"hs\">שאין בדינם ודנים בדיננו<\/i>"]], "id": 6266}, {"k": "u", "a": "דתר&#x27;&#x27;ח:", "l": [["", "בעולת בעל - יש להן, נכנסה לחופה ולא נבעלה - אין להן."]], "id": 6268}, {"k": "u", "a": "ת&#x27;&#x27;כ דרי&#x27;&#x27;ו", "l": [["", "<i class=\"am\">ר&#x27;&#x27;מ:<\/i> כל ערוה שב&#x27;&#x27;ד ישראל ממיתין עליה - בן נח מוזהר עליה, "], ["", "אין ב&#x27;&#x27;ד ישראל ממיתין עליה - אין בן נח מוזהר עליה,."], ["", "<i class=\"am\">וחכ&#x27;&#x27;א:<\/i> הרבה עריות אין ב&#x27;&#x27;ד ישראל ממיתין עליהן, ובן נח מוזהר עליהן"], ["", "בא על עריות ישראל - נידון בדיני ישראל, בא על עריות בן נח - נידון בדיני בן נח."], ["", "ואנו אין לנו אלא נערה המאורסה בלבד."], ["", "- ונחשוב גם נכנסה לחופה ולא נבעלה!"]], "id": 6270}, {"k": "u", "a": "- האי  דבי מנשה ", "l": [["", "דכל מיתה האמורה לבני נח אינו אלא חנק, <i class=\"am\">אידי ואידי<\/i> חנק הוא."]], "id": 6277}, {"k": "hatz", "a": "****", "l": [], "id": 6279}]}, {"daf": "נח.", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "וסבר ר&#x27;&#x27;מ:", "l": [["", "כל ערוה שב&#x27;&#x27;ד ישראל ממיתין עליה בן נח מוזהר עליה? "]], "id": 6281}, {"k": "u", "a": "והא תניא: ", "l": [["", "גר שהיתה הורתו שלא בקדושה ולידתו בקדושה "], ["", "- יש לו שאר האם ואין לו שאר האב, "]], "id": 6283}, {"k": "u", "a": "הא כיצד:", "l": [["", "נשא אחותו מן האם - יוציא, מן האב - יקיים."], ["", "אחות האב מן האם - יוציא, מן האב - יקיים."], ["", "אחות האם מן האם - יוציא, אחות האם מן האב, "], ["", "<i class=\"am\">לר&#x27;&#x27;מ:<\/i> יוציא, <i class=\"am\">וחכ&#x27;&#x27;א:<\/i> יקיים."]], "id": 6286}, {"k": "u", "a": "שהיה ר&#x27;&#x27;מ:", "l": [["", "כל ערוה שהיא משום שאר אם - יוציא, משום שאר האב - יקיים."], ["", "ומותר באשת אחיו, ובאשת אחי אביו, ושאר כל עריות מותרות לו - לאתויי אשת אביו."], ["", "נשא אשה ובתה כונס אחת ומוציא אחת, ולכתחילה לא יכנוס."], ["", "מתה אשתו - מותר בחמותו."], ["", "<i class=\"am\">וא&#x27;&#x27;ד:<\/i> אסור בחמותו."]], "id": 6291}, {"k": "u", "a": "אר&#x27;&#x27;י: ", "l": [["", "הא – ר&#x27;&#x27;מ אליבא דר&#x27;&#x27;א, והא – ר&#x27;&#x27;מ אליבא דרבי עקיבא."]], "id": 6297}, {"k": "u", "a": "דתניא: ", "l": [["", "<i class=\"ps\">על כן יעזב - איש את אביו ואת אמו,<\/i> <i class=\"am\">ר&#x27;&#x27;א:<\/i> <i class=\"ps\">אביו<\/i> - אחות אביו, <i class=\"ps\">אמו -<\/i> אחות אמו."], ["", "<i class=\"am\">ר&#x27;&#x27;ע:<\/i> <i class=\"ps\">אביו -<\/i> אשת אביו, <i class=\"ps\">אמו -<\/i> אמו ממש."], ["", "<i class=\"ps\">ודבק -<\/i> ולא בזכר<i class=\"ps\">, באשתו -<\/i> ולא באשת חבירו, <i class=\"ps\">והיו לבשר אחד<\/i> - מי שנעשים בשר אחד, יצאו בהמה וחיה שאין נעשין בשר אחד."]], "id": 6299}, {"k": "u", "a": "אמר מר:", "l": [["", "<i class=\"am\">ר&#x27;&#x27;א:<\/i> <i class=\"ps\">אביו -<\/i> אחות אביו."], ["", "ולא אביו ממש! דהיינו ודבק - ולא בזכר."]], "id": 6303}, {"k": "u", "a": "ולא ", "l": [["", "אשת אביו! - היינו באשתו ולא באשת חבירו."], ["", "ולא לאחר מיתה! דומיא דאמו, - דלאו אישות, אף אביו - דלאו אישות."], ["", "אמו - אחות אמו."], ["", "- ואימא אמו ממש!"], ["", "- היינו באשתו ולא באשת חבירו."], ["", "- ואימא לאחר מיתה!"], ["", "- דומיא דאביו, מה אביו - דלאו ממש, אף אמו - דלאו ממש."], ["", "רבי עקיבא אומר: אביו - אשת אביו, - ואימא: אביו ממש!"], ["", "- היינו ודבק - ולא בזכר."], ["", "- אי הכי, אשת אביו נמי היינו באשתו ולא באשת חברו!"], ["", "- לאחר מיתה."], ["", "אמו אמו ממש - היינו באשתו ולא באשת חברו!"], ["", "- אמו מאנוסתו."], ["", "במאי קא מיפלגי? - רבי אליעזר סבר: [דף נח:] אביו דומיא דאמו, ואמו דומיא דאביו - לא משכחת לה אלא באחווה."], ["", "- ורבי עקיבא: מוטב לאוקמיה באשת אביו דאיקרי ערות אביו, לאפוקי אחות אביו דשאר אביו - איקרי, ערות אביו - לא איקרי."], ["", "תא שמע: ויקח עמרם את יוכבד דדתו, מאי לאו - דודתו מן האם? - לא, דודתו מן האב."], ["", "תא שמע: וגם אמנה אחתי בת אבי היא אך לא בת אמי - מכלל דבת האם אסורה!"], ["", "- ותסברא, אחותו הואי? בת אחיו הואי!"], ["", "וכיון דהכי הוא - לא שנא מן האב, ולא שנא מן האם - שריא."], ["", "אלא התם הכי קאמר ליה: קורבא דאחות אית לי בהדה, מאבא ולא מאמא."], ["", "תא שמע: מפני מה לא נשא אדם את בתו - כדי שישא קין את אחותו, שנאמר כי אמרתי עולם חסד יבנה."], ["", "הא לאו הכי - אסירא!"], ["", "- כיון דאשתרי - אשתרי."], ["", "אמר רב הונא: נכרי מותר בבתו, ואם תאמר: מפני מה לא נשא אדם את בתו - כדי שישא קין את אחותו, משום עולם חסד יבנה."], ["", "ואיכא דאמרי, אמר רב הונא: נכרי אסור בבתו."], ["", "תדע, שלא נשא אדם את בתו."], ["", "ולא היא, התם היינו טעמא - כדי שישא קין את אחותו, משום דעולם חסד יבנה."], ["", "אמר רב חסדא: עבד מותר באמו, ומותר בבתו."], ["", "יצא מכלל נכרי ולכלל ישראל לא בא."], ["", "כי אתא רב דימי אמר רבי אלעזר אמר רבי חנינא: בן נח שייחד שפחה לעבדו ובא עליה - נהרג עליה."], ["", "מאימת? - אמר רב נחמן: מדקראו לה רביתא דפלניא."], ["", "מאימת התרתה? - אמר רב הונא: משפרעה ראשה בשוק."], ["", "אמר רבי אלעזר אמר רבי חנינא: בן נח שבא על אשתו שלא כדרכה - חייב, שנאמר ודבק - ולא שלא כדרכה."], ["", "אמר רבא: מי איכא מידי דישראל לא מיחייב ונכרי מיחייב? אלא אמר רבא: בן נח שבא על אשת חבירו שלא כדרכה - פטור, מאי טעמא - באשתו ולא באשת חבירו, ודבק - ולא שלא כדרכה."], ["", "אמר רבי חנינא: נכרי שהכה את ישראל - חייב מיתה, שנאמר ויפן כה וכה וירא כי אין איש [ויך את המצרי] וגו&#x27;."], ["", "ואמר רבי חנינא: הסוטר לועו של ישראל כאילו סוטר לועו של שכינה - שנאמר מוקש אדם ילע קדש."], ["", "מגביה עבדו שבת סימן."], ["", "אמר ריש לקיש: המגביה ידו על חבירו, אף על פי שלא הכהו - נקרא רשע, שנאמר ויאמר לרשע למה תכה רעך, למה הכית לא נאמר, אלא למה תכה, אף על פי שלא הכהו נקרא רשע."], ["", "(אמר) זעירי אמר רבי חנינא: נקרא חוטא, שנאמר ואם לא לקחתי בחזקה וכתיב ותהי חטאת הנערים גדולה מאד."], ["", "רב הונא אמר: תיקצץ ידו, שנאמר וזרוע רמה תשבר."], ["", "רב הונא קץ ידא."], ["", "רבי אלעזר אומר: אין לו תקנה אלא קבורה, שנאמר ואיש זרוע לו הארץ."], ["", "ואמר רבי אלעזר: לא נתנה קרקע אלא לבעלי זרועות, שנאמר ואיש זרוע לו הארץ."], ["", "ואמר ריש לקיש: מאי דכתיב עבד אדמתו ישבע לחם - אם עושה אדם עצמו כעבד לאדמה - ישבע לחם, ואם לאו - לא ישבע לחם."], ["", "ואמר ריש לקיש: נכרי ששבת - חייב מיתה, שנאמר ויום ולילה לא ישבתו."], ["", "ואמר מר: אזהרה שלהן זו היא מיתתן."], ["", "אמר רבינא: אפילו שני בשבת."], ["", "- וליחשבה גבי שבע מצות!"], ["", "- כי קא חשיב - שב ואל תעשה, קום עשה - לא קא חשיב."], ["", "[דף נט.] והא דינין קום עשה הוא, וקא חשיב!"], ["", "- קום עשה ושב אל תעשה נינהו."], ["", "ואמר רבי יוחנן: נכרי שעוסק בתורה חייב מיתה, שנאמר תורה צוה לנו משה מורשה - לנו מורשה ולא להם."], ["", "- וליחשבה גבי שבע מצות!"], ["", "מאן דאמר מורשה - מיגזל קא גזיל לה, מאן דאמר מאורסה - דינו כנערה המאורסה, דבסקילה."], ["", "מיתיבי, היה רבי מאיר אומר: מניין שאפילו נכרי ועוסק בתורה שהוא ככהן גדול - שנאמר אשר יעשה אתם האדם וחי בהם, כהנים לויים וישראלים לא נאמר, אלא האדם."], ["", "הא למדת: שאפילו נכרי ועוסק בתורה הרי הוא ככהן גדול!"], ["", "- התם בשבע מצות דידהו."], ["", "רבי חנינא בן גמליאל אומר: אף הדם מן החי."], ["", "תנו רבנן: אך בשר בנפשו דמו לא תאכלו - זה אבר מן החי."], ["", "רבי חנינא בן גמליאל אומר: אף הדם מן החי."], ["", "מאי טעמא דרבי חנינא בן גמליאל? קרי ביה בשר בנפשו לא תאכל, דמו בנפשו לא תאכל - ורבנן: ההוא למישרי שרצים הוא דאתא."], ["", "כיוצא בדבר אתה אומר רק חזק לבלתי אכל הדם כי הדם הוא הנפש וגו&#x27; (רק חזק לבלתי אכל הדם - זה אבר מן החי, כי הדם הוא הנפש - זה דם מן החי.) - ורבנן: ההוא לדם הקזה שהנשמה יוצאה בו הוא דאתא."], ["", "למה לי למיכתב לבני נח ולמה לי למשני בסיני? - כדרבי יוסי ברבי חנינא."], ["", "דאמר רבי יוסי ברבי חנינא: כל מצוה שנאמרה לבני נח ונשנית בסיני - לזה ולזה נאמרה."], ["", "לבני נח ולא נשנית בסיני - לישראל נאמרה ולא לבני נח."], ["", "ואנו אין לנו אלא גיד הנשה ואליבא דרבי יהודה."], ["", "אמר מר: כל מצוה שנאמרה לבני נח ונשנית בסיני לזה ולזה נאמרה."], ["", "אדרבה, מדנשנית בסיני - לישראל נאמרה ולא לבני נח!"], ["", "- מדאיתני עבודה זרה בסיני, ואשכחן דענש נכרי עילווה - שמע מינה לזה ולזה נאמרה."], ["", "לבני נח ולא נשנית בסיני לישראל נאמרה ולא לבני נח."], ["", "אדרבה, מדלא נישנית בסיני לבני נח נאמרה ולא לישראל!"], ["", "- ליכא מידעם דלישראל שרי ולנכרי אסור."], ["", "- ולא? והרי יפת תואר!"], ["", "- התם משום דלאו בני כיבוש נינהו."], ["", "- והרי פחות משוה פרוטה!"], ["", "- התם משום דלאו בני מחילה נינהו."], ["", "כל מצוה שנאמרה לבני נח ונישנית בסיני לזה ולזה נאמרה [דף נט:] והרי מילה שנאמרה לבני נח, דכתיב ואתה את בריתי תשמר, ונשנית בסיני וביום השמיני ימול, לישראל נאמרה ולא לבני נח!"], ["", "- ההוא למישרי שבת הוא דאתא: ביום - ואפילו בשבת."], ["", "והרי פריה ורביה, שנאמרה לבני נח, דכתיב ואתם פרו ורבו, ונשנית בסיני לך אמר להם שובו לכם לאהליכם, לישראל נאמרה, ולא לבני נח!"], ["", "- ההוא לכל דבר שבמנין צריך מנין אחר להתירו הוא דאתא."], ["", "- אי הכי, כל חדא וחדא נמי נימא משום מילתא איתני!"], ["", "- הכי קאמר: אזהרה מיהדר ומיתנא בה למה לי? ואין לנו אלא גיד הנשה בלבד, ואליבא דרבי יהודה."], ["", "- הני נמי לא איתני!"], ["", "- הני איתני לשום מילתא בעלמא, הא לא איתני כלל."], ["", "אי בעית אימא: מילה מעיקרא לאברהם הוא דקא מזהר ליה רחמנא ואתה את בריתי תשמר אתה וזרעך אחריך לדרתם, אתה וזרעך - אין, איניש אחרינא - לא."], ["", "- אלא מעתה בני ישמעאל לחייבו!"], ["", "- כי ביצחק יקרא לך זרע."], ["", "- בני עשו לחייבו!"], ["", "- ביצחק - ולא כל יצחק."], ["", "- מתקיף לה רב אושעיא: אלא מעתה בני קטורה לא לחייבו? - האמר רבי יוסי בר אבין ואיתימא רבי יוסי בר חנינא: את בריתי הפר - לרבות בני קטורה."], ["", "אמר רב יהודה אמר רב: אדם הראשון לא הותר לו בשר לאכילה, דכתיב לכם יהיה לאכלה ולכל חית הארץ - ולא חית הארץ לכם."], ["", "וכשבאו בני נח התיר להם, שנאמר כירק עשב נתתי לכם את כל."], ["", "יכול לא יהא אבר מן החי נוהג בו - תלמוד לומר אך בשר בנפשו דמו לא תאכלו."], ["", "יכול אף לשרצים תלמוד לומר אך."], ["", "ומאי תלמודא? - אמר רב הונא: דמו - מי שדמו חלוק מבשרו, יצאו שרצים שאין דמם חלוק מבשרם."], ["", "מיתיבי: ורדו בדגת הים מאי לאו לאכילה? - לא, למלאכה."], ["", "- ודגים בני מלאכה נינהו? - אין, כדרחבה."], ["", "דבעי רחבה: הנהיג בעיזא ושיבוטא מאי? תא שמע: ובעוף השמים, מאי לאו לאכילה? - לא, למלאכה."], ["", "- ועופות בני מלאכה נינהו? - אין, כדבעי רבה בר רב הונא: דש באווזין ותרנגולין, לרבי יוסי ברבי יהודה, מאי? תא שמע: ובכל חיה הרמשת על הארץ!"], ["", "- ההוא לאתויי נחש הוא דאתא."], ["", "דתניא, רבי שמעון בן מנסיא אומר: חבל על שמש גדול שאבד מן העולם, שאלמלא (לא) נתקלל נחש, כל אחד ואחד מישראל היו מזדמנין לו שני נחשים טובים, אחד משגרו לצפון ואחד משגרו לדרום להביא לו סנדלבונים טובים ואבנים טובות ומרגליות."], ["", "ולא עוד אלא שמפשילין רצועה תחת זנבו, ומוציא בה עפר לגנתו ולחורבתו."], ["", "מיתיבי: היה רבי יהודה בן תימא אומר: אדם הראשון מיסב בגן עדן היה, והיו מלאכי השרת צולין לו בשר, ומסננין לו יין."], ["", "הציץ בו נחש וראה בכבודו, ונתקנא בו!"], ["", "- התם בבשר היורד מן השמים."], ["", "- מי איכא בשר היורד מן השמים? - אין, כי הא דרבי שמעון בן חלפתא הוה קאזיל באורחא, פגעו בו הנך אריותא דהוו קא נהמי לאפיה, אמר: הכפירים שאגים לטרף."], ["", "נחיתו ליה תרתי אטמתא, חדא אכלוה וחדא שבקוה."], ["", "איתיה ואתא לבי מדרשא, בעי עלה: דבר טמא הוא זה או דבר טהור? - אמרו ליה: אין דבר טמא יורד מן השמים."], ["", "בעי מיניה רבי זירא מרבי אבהו: ירדה לו דמות חמור מהו? - אמר ליה יארוד נאלא!"], ["", "הא אמרי ליה: אין דבר טמא יורד מן השמים."], ["", "רבי שמעון אומר אף על הכישוף."], ["", "מאי טעמיה דרבי שמעון - דכתיב [דף ס.] מכשפה לא תחיה, וכתיב כל שכב עם בהמה מות יומת, כל שישנו בכלל כל שכב עם בהמה - ישנו בכלל מכשפה לא תחיה."], ["", "רבי אלעזר אומר אף על הכלאים."], ["", "מנא הני מילי? - אמר שמואל: דאמר קרא את חקתי תשמרו - חוקים שחקקתי לך כבר, בהמתך לא תרביע כלאים שדך לא תזרע כלאים, מה בהמתך בהרבעה - אף שדך בהרכבה, מה בהמתך - בין בארץ בין בחוצה לארץ, אף שדך - בין בארץ בין בחוצה לארץ."], ["", "- אלא מעתה ושמרתם את חקתי ואת משפטי - חקים שחקקתי לך כבר!"], ["", "- התם ושמרתם את חקתי - דהשתא, הכא את חקתי תשמרו - חקים דמעיקרא תשמרו."], ["", "אמר רבי יהושע בן קרחה כו&#x27;."], ["", "אמר רב אחא בר יעקב: אינו חייב עד שיברך שם בן ארבע אותיות, לאפוקי בן שתי אותיות דלא."], ["", "- פשיטא, יכה יוסי את יוסי תנן!"], ["", "- מהו דתימא: מילתא בעלמא הוא דנקט, קא משמע לן."], ["", "איכא דאמרי, אמר רב אחא בר יעקב: שמע מינה שם בן ארבע אותיות - נמי שם הוא."], ["", "- פשיטא, יכה יוסי את יוסי תנן!"], ["", "- מהו דתימא: עד דאיכא שם רבה, ומילתא בעלמא הוא דנקט, קא משמע לן."], ["", "נגמר הדין כו&#x27;."], ["", "עומדין מנלן? - אמר רבי יצחק בר אמי: דאמר קרא ואהוד בא אליו והוא ישב בעלית המקרה אשר לו לבדו ויאמר אהוד דבר אלהים לי אליך ויקם מעל הכסא."], ["", "והלא דברים קל וחומר, ומה עגלון מלך מואב, שהוא נכרי ולא ידע אלא בכינוי - עמד, ישראל ושם המפורש - על אחת כמה וכמה."], ["", "קורעין, מנלן? - דכתיב ויבא אליקים בן חלקיהו [וגו&#x27;] ושבנא הספר ויואח בן אסף המזכיר אל חזקיהו קרועי בגדים ויגידו לו את דברי רבשקה."], ["", "לא מאחין."], ["", "מנלן? אמר רבי אבהו: אתיא קריעה קריעה, כתיב הכא קרועי בגדים וכתיב התם ואלישע ראה והוא מצעק אבי אבי רכב ישראל ופרשיו ולא ראהו עוד ויחזק בבגדיו ויקרעם לשנים קרעים, ממשמע שנאמר ויקרעם לשנים איני יודע שהן קרעים? ומה תלמוד לומר קרעים - מלמד שהן קרועים לעולם."], ["", "תנו רבנן: אחד השומע, ואחד שומע מפי שומע - חייב לקרוע."], ["", "והעדים אין חייבין לקרוע, שכבר קרעו בשעה ששמעו."], ["", "- וכי קרעו בשעה ששמעו מאי הוי? הא קא שמעי השתא!"], ["", "- לא סלקא דעתך, דכתיב ויהי כשמע המלך חזקיהו (את דברי רבשקה) ויקרע את בגדיו - המלך חזקיהו קרע, והם לא קרעו."], ["", "אמר רב יהודה אמר שמואל: השומע אזכרה מפי הנכרי אינו חייב לקרוע, ואם תאמר רבשקה - ישראל מומר היה."], ["", "ואמר רב יהודה אמר שמואל: אין קורעין אלא על שם המיוחד בלבד, לאפוקי כינוי - דלא."], ["", "וחלקו דרבי חייא בתרוייהו."], ["", "דאמר רבי חייא: השומע אזכרה בזמן הזה - אינו חייב לקרוע, שאם אי אתה אומר כן - נתמלא כל הבגד קרעים."], ["", "ממאן? אילימא מישראל - מי פקירי כולי האי? אלא פשיטא מנכרי, ואי שם המיוחד - מי גמירי? אלא לאו - בכינוי, ושמע מינה: בזמן הזה הוא דלא, הא מעיקרא - חייב, שמע מינה."], ["", "השני אומר אף אני כמוהו."], ["", "אמר ריש לקיש: שמע מינה אף אני כמוהו - כשר בדיני ממונות ובדיני נפשות, ומעלה הוא דעביד רבנן, והכא כיון דלא אפשר - אוקמוה רבנן אדאורייתא."], ["", "דאי סלקא דעתך פסול - הכא משום דלא אפשר קטלינן לגברא? והשלישי אומר אף אני כמוהו."], ["", "סתמא כרבי עקיבא, דמקיש שלשה לשנים."], ["", "[דף ס:] משנה."], ["", "העובד עבודה זרה, אחד העובד, ואחד המזבח, ואחד המקטר, ואחד המנסך, ואחד המשתחוה ואחד המקבלו עליו לאלוה, והאומר לו אלי אתה."], ["", "אבל המגפף, והמנשק, והמכבד, והמרבץ, והמרחץ, והסך, והמלביש, והמנעיל - עובר בלא תעשה."], ["", "הנודר בשמו והמקיים בשמו - עובר בלא תעשה."], ["", "הפוער עצמו לבעל פעור - זו היא עבודתה, הזורק אבן למרקוליס - זו היא עבודתה."], ["", "גמרא."], ["", "מאי אחד העובד? - אמר רבי ירמיה: הכי קאמר, אחד העובד כדרכה, ואחד המזבח, ואחד המקטר, ואחד המנסך, ואחד המשתחוה - ואפילו שלא כדרכה."], ["", "- וליחשוב נמי זורק!"], ["", "אמר אביי: זורק היינו מנסך, דכתיב בל אסיך נסכיהם מדם."], ["", "מנהני מילי? דתנו רבנן: אילו נאמר זבח יחרם - הייתי אומר: בזובח קדשים בחוץ הכתוב מדבר, תלמוד לומר לאלהים - בזובח לעבודה זרה הכתוב מדבר."], ["", "אין לי אלא בזובח, מקטר ומנסך מניין? תלמוד לומר בלתי לה&#x27; לבדו - ריקן העבודות כולן לשם המיוחד."], ["", "לפי שיצאה זביחה לידון בעבודות פנים, מניין לרבות השתחואה? תלמוד לומר: וילך ויעבד אלהים אחרים וישתחו להם, וסמיך ליה והוצאת את האיש ההוא וגו&#x27;."], ["", "עונש - שמענו, אזהרה מניין? - תלמוד לומר כי לא תשתחוה לאל אחר."], ["", "יכול שאני מרבה המגפף והמנשק והמנעיל - תלמוד לומר זבח - זביחה בכלל היתה, ולמה יצאה - להקיש אליה ולומר לך: מה זביחה מיוחדת - שהיא עבודת פנים וחייבין עליה מיתה אף כל שהיא עבודת פנים - וחייבין עליה מיתה, יצאה השתחואה לידון בעצמה, יצאה זביחה לידון על הכלל כולו."]], "id": 6306}, {"k": "dh", "a": "מכאן ציטוט מתוך לאוקמי הישנים ", "l": [], "id": 6463}]}, {"daf": "סא.", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "דאיתמר, ", "l": [], "id": 6465}, {"k": "nose", "a": "השוחט בהמה לזרוק דמה לע&quot;ז, ולהקטיר חלבה לע&quot;ז", "l": [], "id": 6466}, {"k": "u", "a": "", "l": [["", "<i class=\"am\">לרי&quot;ו:<\/i> אסורה <i class=\"am\">ולר&quot;ל:<\/i> מותרת. <i class=\"am\">וקשה דלר&quot;ל:<\/i> בעי קרא! "]], "id": 6467}, {"k": "u", "a": "ולרי&#x27;&#x27;ו:", "l": [["", "קרא לחייב מיתה באדם"]], "id": 6468}, {"k": "u", "a": "ולר&#x27;&#x27;ל", "l": [["", "דווקא בהמה אדם חייב מיתה כמשתחווה להר דהר מותר ועובדה בסייף "]], "id": 6470}, {"k": "u", "a": "רא&quot;מד  לרב&#x27;&#x27;ח", "l": [["", "ד&#x27;יצאה השתחואה ללמד על הכלל כולו, <i class=\"ps\">&#x27;איכה יעבדו&#x27;,<\/i> מה למעט?"], ["", "לא לפוער עצמו לזובחים : 7099}, {"k": "dh", "a": "אמר רבי עקיבא ", "l": [], "id": 7100}]}, {"daf": "סח.", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "קשה", "l": [["", "הא רבי עקיבא לא למד זאת מרבי יהושע "]], "id": 7102}, {"k": "u", "a": "והתניא: ", "l": [["", "כשחלה רבי אליעזר, נכנסו ר&#x27;&#x27;ע וחביריו לבקרו. הוא יושב בקינוף שלו והן יושבין בטרקלין שלו. ואותו היום ע&#x27;&#x27;ש היה <i class=\"hs\">עם חשיכה<\/i>, ונכנס הורקנוס בנו לחלוץ תפליו. גער בו ויצא בנזיפה."]], "id": 7104}, {"k": "u", "a": "אמר לחביריו: ", "l": [["", "מדומה אני שדעתו של אבא נטרפה."]], "id": 7106}, {"k": "u", "a": "אמר להן: ", "l": [["", "דעתו ודעת אמו נטרפה, היאך מניחין איסור סקילה ועוסקין באיסור שבות? כיון שראו חכמים שדעתו מיושבת עליו, נכנסו וישבו לפניו מרחוק ארבע אמות."]], "id": 7108}, {"k": "u", "a": "אמר להם:", "l": [["", "למה באתם? <i class=\"am\">- אמרו לו:<\/i> ללמוד תורה באנו. <i class=\"am\">אמר להם:<\/i> ועד עכשיו למה לא באתם? <i class=\"am\">אמרו לו:<\/i> לא היה לנו פנאי. <i class=\"am\">אמר להן:<\/i> תמיה אני אם ימותו מיתת עצמן. <i class=\"am\">א&#x27;&#x27;ל ר&#x27;&#x27;ע: <\/i>שלי מהו? <i class=\"am\">אמר לו:<\/i> שלך קשה משלהן."], ["", "נטל שתי זרועותיו והניחן על לבו, <i class=\"am\">אמר:<\/i> אוי לכם שתי זרועותיי שהן כשתי ספרי תורה שנגללין. <i class=\"hs\">והכתוב מכוסה בליבו פנימה <\/i>הרבה תורה למדתי ולא חסרתי מרבותי אפילו ככלב המלקק מן הים, הרבה תורה לימדתי ולא חסרוני תלמידי אלא כמכחול בשפופרת"]], "id": 7110}, {"k": "u", "a": "ולא עוד ", "l": [["", "אלא שאני שונה שלש מאות הלכות בבהרת עזה, ולא היה אדם ששואלני בהן דבר מעולם."]], "id": 7113}, {"k": "u", "a": "ולא עוד", "l": [["", "אלא שאני שונה שלש מאות <i class=\"am\">ואמרי לה<\/i> שלשת אלפים הלכות, בנטיעת קשואין ולא היה אדם שואלני בהן דבר מעולם, חוץ מעקיבא בן יוסף. פעם אחת אני והוא מהלכין היינו בדרך, <i class=\"am\">אמר לי:<\/i> רבי, למדני בנטיעת קשואין. <i class=\"am\">אמרתי דבר אחד<\/i> נתמלאה כל השדה קשואין. <i class=\"am\">אמר לי:<\/i> רבי, למדתני נטיעתן - למדני עקירתן. <i class=\"am\">אמרתי דבר אחד,<\/i> נתקבצו   function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
  function render(i,q){cur=Math.max(0,Math.min(D.pages.length-1,i));const p=D.pages[cur];
   let h=`<div class="head"><span>${D.masechet}</span><span>${esc(p.perekName)} · ${esc(p.perek)}</span><span>${esc(p.daf)}</span></div>`;
   for(const u of p.units){
    if(u.k==='u'){h+=`<div class="row u" id="u${u.id}"><div class="rail"><span class="anchor">${u.a}</span></div><div class="main">${u.l.map(l=>`<p class="${l[0]}">${l[1]}</p>`).join('')}</div></div>`}
    else if(u.k==='m'){h+=`<div class="row"><div class="rail"><span class="mlabel">משנה</span></div><div class="main mishna">${u.l.map(l=>`<p>${l[1]}</p>`).join('')}</div></div>`}
    else if(u.k==='hatz'){h+=`<div class="row"><div class="rail"></div><div class="main hatz">* * *</div></div>`}
    else h+=`<div class="row ${u.k}"><div class="rail"></div><div class="main ${u.k==='dh'||u.k==='nose'?u.k:''}">${u.a}</div></div>`}
   $('#sheet').innerHTML=q?hl(h,esc(q).replace(/"/g,'&quot;').replace(/'/g,'&#x27;')):h;$('#dafsel').value=cur;$('#curdaf').textContent=p.daf;$('#peresel').value=p.perek;
   document.title=`לאוקמי גירסא · ${D.masechet} ${p.daf}`;location.hash=`daf=${cur}`;window.scrollTo(0,0)}
  function hl(h,q){const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');return h.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(r,'<mark>$1</mark>')+'<')}
  function go(d){render(cur+d)}
  function zoom(v){document.documentElement.style.setProperty('--zoom',v);document.querySelectorAll('[data-z]').forEach(b=>b.classList.toggle('on',+b.dataset.z===v))}
  function fs(d){const r=document.documentElement,f=parseFloat(getComputedStyle(r).getPropertyValue('--fs'))+d;r.style.setProperty('--fs',f+'pt');r.style.setProperty('--lh',(f+2)+'pt')}
  function panel(id){const p=$('#'+id),o=p.classList.contains('open');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(!o)p.classList.add('open')}
  function dec(s){return s.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&')}
  function txt(u){return dec(u.a.replace(/<[^>]+>/g,'')+' '+u.l.map(l=>l[1].replace(/<[^>]+>/g,'')).join(' '))}
  function search(q){q=q.trim();LASTQ=q;const out=$('#sres');if(q.length<2){out.innerHTML='';return}
   RES=[];let res=RES,n=0;D.pages.forEach((p,pi)=>{for(const u of p.units){const t=txt(u);const k=t.indexOf(q);if(k>-1){n++;if(res.length<120)res.push({pi,id:u.id,daf:p.daf,s:t.slice(Math.max(0,k-40),k+60)})}}});
   out.innerHTML=`<div class="n">${n} תוצאות</div>`+res.map((r,i)=>`<div class="res"><a onclick="jumpR(${i})"><small>${r.daf}</small> …${esc(r.s).replace(esc(q),'<mark>'+esc(q)+'</mark>')}…</a></div>`).join('');
   $('#search').classList.add('open')}
  let RES=[],LASTQ='';function jumpR(i){jump(RES[i].pi,RES[i].id,LASTQ)}
  function jump(pi,id,q){render(pi,q);setTimeout(()=>{const e=$('#u'+id);if(e){e.classList.add('hit');e.scrollIntoView({block:'center'})}},50)}
  function amq(i){$('#q').value=D.am[i][0];search(D.am[i][0])}
  function build(){const ds=$('#dafsel');D.pages.forEach((p,i)=>ds.add(new Option(p.daf,i)));
   const ps=$('#peresel'),seen={};D.pages.forEach((p,i)=>{if(!seen[p.perek]){seen[p.perek]=1;ps.add(new Option(p.perek+' · '+p.perekName,p.perek))}});
   ps.onchange=()=>render(D.pages.findIndex(p=>p.perek===ps.value));ds.onchange=()=>render(+ds.value);
   let t='',lp='';for(const [pi,id,s] of D.toc){const p=D.pages[pi];if(p.perek!==lp){lp=p.perek;t+=`<h3>${esc(p.perek)} · ${esc(p.perekName)}</h3>`}t+=`<a onclick="jump(${pi},${id})"><small class="n">${p.daf}</small> ${esc(s)}</a>`}$('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='ArrowLeft'){go(1);e.preventDefault()}if(e.ctrlKey&&e.key==='ArrowRight'){go(-1);e.preventDefault()}if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(1);e.preventDefault()}if(e.ctrlKey&&e.key==='-'){fs(-1);e.preventDefault()}if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('daf')||0))}
  build();
  </script></body></html>
