<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
/* כרטיס התצוגה המקדימה של הדף (פרומפט 23): 1200x480, כחול קטיפה וזהב של האתר. בלי רקעי הדגשה מאחורי טקסט.
   8.11.2026 (בעל הפרויקט): שם הדף בגופן וילנא, והכרטיס נמוך יותר - שלא יתפוס יותר מדי מן המסך. */
@font-face{font-family:'Frank';src:url(@@FONTS@@/frank.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Vilna';src:url(@@FONTS@@/vilna-r.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Vilna';src:url(@@FONTS@@/vilna-b.woff2) format('woff2');font-weight:700}
html,body{margin:0;width:1200px;height:480px;overflow:hidden}
body{background:radial-gradient(120% 110% at 50% 40%,#163a57 0%,#0f2a40 50%,#0b1c2a 100%);color:#f3ead6;font-family:'Frank',serif;position:relative}
.frame{position:absolute;inset:20px;border:1.5px solid rgba(201,162,74,.55)}
.frame:after{content:'';position:absolute;inset:6px;border:.75px solid rgba(201,162,74,.28)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.top{display:flex;align-items:center;gap:14px}
.gate{width:44px;height:44px;opacity:.95}
.brand{font-family:'Vilna',serif;font-weight:700;font-size:28px;letter-spacing:.14em;color:#c9a24a}
.rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,#c9a24a,transparent);margin:16px 0 14px}
.daf{font-family:'Vilna',serif;font-weight:700;font-size:112px;line-height:1.05;color:#f6eedb}
.line{font-family:'Frank',serif;font-size:40px;line-height:1.3;color:#e2cf9f;margin-top:16px;max-width:1040px}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div class="top"><img class="gate" src="@@GATE@@" alt=""><div class="brand">לאוקמי גירסא</div></div>
  <div class="rule"></div>
  <div class="daf">@@DAF@@</div>
  <div class="line">@@LINE@@</div>
</div>
</body></html>
