name: פרסום תיקונים שנעשו באתר
# מצב העריכה שבדף דוחף כל תיקון ל-data/edits/<מסכת>.json דרך ממשק
# גיטהאב. העבודה הזאת קצרה בכוונה: היא בונה מקובצי הוורד שכבר שמורים
# במאגר, בלי לרדת לדרייב ובלי סריקת תצוגה, ובונה רק את המסכתות שיש
# להן תיקון ממתין. בנייה מלאה של 26 מסכתות נמדדה 14 דקות ו-24 שניות;
# מסכת אחת - 32 שניות.
on:
  push:
    branches: [main]
    paths: ['data/edits/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install lxml fonttools brotli pillow
      # האתר שנבנה בפעם הקודמת. המפתח כולל את טביעת קובצי הוורד, ולכן
      # עותק שנבנה ממקור אחר לעולם אינו משוחזר - ואי אפשר שהפרסום הזה
      # יחזיר לאחור מסכת שהשומר בנה מחדש.
      - name: שחזור האתר שנבנה קודם
        uses: actions/cache/restore@v4
        with:
          path: site
          key: site-${{ hashFiles('input/docx/**', 'tools/**', 'data/sources/**') }}-
          restore-keys: site-${{ hashFiles('input/docx/**', 'tools/**', 'data/sources/**') }}-
      # מה לבנות: המסכתות שהשתנו בדחיפה הזאת, ובנוסף כל מסכת שיש לה
      # תיקון ממתין - שמא העותק המשוחזר קדם לתיקון שלה.
      - name: אילו מסכתות לבנות
        id: which
        run: |
          set -e
          ls data/edits/*.json 2>/dev/null | sed 's#data/edits/##;s#\.json##' > /tmp/all.txt || true
          slugs=$(sort -u /tmp/all.txt | paste -sd, -)
          echo "slugs=$slugs" >> $GITHUB_OUTPUT
          echo "יבנו: $slugs"
      - name: בנייה
        run: |
          if [ -f site/index.html ] && [ -n "${{ steps.which.outputs.slugs }}" ]; then
            python tools/build_all.py --only "${{ steps.which.outputs.slugs }}" \
              || { echo "הבנייה החלקית לא התאפשרה, עוברים לבנייה מלאה"; python tools/build_all.py; }
          else
            python tools/build_all.py
          fi
      # העבודה הזאת אינה שומרת את מה שבנתה. בנייה חלקית אינה מריצה את
      # סוכן סריקת התצוגה, ולכן חסר בה site/layout-audit.json - ואם
      # היא היתה נשמרת, הפרסום הבא היה משחזר עותק בלי הקובץ ולוח
      # הבקרה היה מחזיר 404 בקונסול. השומר שומר עותק מלא כל חצי שעה,
      # וזה מספיק: כל המסכתות שיש להן תיקון ממתין נבנות כאן ממילא.
      # תיקון שכבר הגיע מן הוורד יוצא מקובץ התיקונים בבנייה עצמה.
      # הסימון [skip ci] הכרחי: בלעדיו הדחיפה הזאת היתה מפעילה שוב את
      # אותה עבודה, ללא סוף.
      - name: הוצאת תיקונים שכבר נקלטו בוורד
        run: |
          git config user.name "leokmei-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add -A data/edits
          git diff --cached --quiet || (git commit -m "תיקונים שנקלטו בוורד הוסרו מן הקובץ [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
