name: השומר - בנייה ופרסום מקובצי הוורד
on:
  schedule:
    # דקות שאינן עגולות: לוח הזמנים החינמי של גיטהאב מדלג על הרצות
    # שנקבעו לראש השעה ולחצייה, מפני שכל העולם מבקש אותן באותו רגע.
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # דחיפת תיקון מן האתר מטופלת בעבודה הקצרה שב-edits.yml. בלי
    # ההחרגה הזאת רצו שתי בנייה על אותה דחיפה, והתור נחנק.
    paths-ignore: ['data/edits/**', 'docs/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install lxml fonttools playwright
      - name: הורדה מהדרייב
        id: fetch
        run: python tools/fetch.py | tee fetch.log; grep -q CHANGED fetch.log && echo changed=1 >> $GITHUB_OUTPUT || echo changed=0 >> $GITHUB_OUTPUT
      - name: בנייה
        run: python tools/build_all.py
      # סוכן סריקת התצוגה. אינו חוסם את הפרסום: אם הוא נכשל או מתארך,
      # האתר עולה בכל זאת, והמונים פשוט לא יתחדשו בלוח הבקרה.
      - name: סריקת תצוגה
        continue-on-error: true
        timeout-minutes: 10
        run: python tools/layout_audit.py --modes flow,phone --max-sections 2 --no-shots --channel chrome --label שומר
      - name: שמירת המקורות בריפו (גיבוי)
        run: |
          git config user.name "leokmei-watcher"; git config user.email "watcher@users.noreply.github.com"
          git add -A input && (git commit -m "עדכון אוטומטי $(date -u +'%d.%m.%Y %H:%M')" && git push) || echo "אין שינוי"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
