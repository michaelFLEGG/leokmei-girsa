name: בית החרושת לתוספות - פעימה (וגם שומר הדופק)
# פעימה אחת כל עשר דקות. כל פעימה קצרה ואידמפוטנטית: בודקת באיזה שלב נמצא כל פרק, מקדמת שלב אחד, שומרת את המצב ודוחפת.
# כשהריצה נפלה, הפעימה הבאה ממשיכה מנקודת הביקורת האחרונה (קובץ המצב בריפו) ורושמת ביומן. המחשב של בעל הפרויקט אינו חלק מהצנרת.
# המפתח הוא Secret בשם ANTHROPIC_API_KEY בלבד. בלעדיו הפעימה רק רושמת "ממתין למפתח".
on:
  schedule:
    # דקות שאינן עגולות: לוח הזמנים החינמי של גיטהאב מדלג על הרצות שנקבעו לראש השעה
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: tosafot-factory
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install anthropic
      - name: פעימה
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/tosafot/factory_flow.py tick
      - name: שמירה, דחיפה והפעלת הבנייה
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PUB=0
          if [ -f tosafot/factory/.published-flag ]; then PUB=1; rm -f tosafot/factory/.published-flag; fi
          PREP=""
          if [ -f tosafot/factory/.need-prep ]; then PREP=$(cat tosafot/factory/.need-prep); rm -f tosafot/factory/.need-prep; fi
          git config user.name "tosafot-factory"; git config user.email "factory@users.noreply.github.com"
          for d in tosafot data/quiz docs/ענן .locks; do [ -e "$d" ] && git add -A -- "$d"; done; true
          if git diff --cached --quiet; then
            echo "אין שינוי"
          else
            git commit -m "בית החרושת לתוספות: פעימה $(date -u +'%d.%m.%Y %H:%M')"
            OK=0
            for i in 1 2 3 4 5; do
              git stash -q --include-untracked 2>/dev/null || true
              if git pull --rebase -q && git push -q; then OK=1; fi
              git stash pop -q 2>/dev/null || true
              if [ "$OK" = "1" ]; then break; fi
              sleep $((i * 7))
            done
            if [ "$OK" != "1" ]; then echo "::error::הדחיפה נכשלה אחרי חמישה ניסיונות"; exit 1; fi
          fi
          if [ "$PUB" = "1" ]; then
            echo "פרק פורסם: מפעיל את בניית האתר"
            gh workflow run watch.yml --ref main
          fi
          if [ -n "$PREP" ]; then
            echo "מסכת חדשה בתור: מפעיל הכנה ל-$PREP"
            gh workflow run tosafot-prep.yml --ref main -f slug="$PREP"
          fi
