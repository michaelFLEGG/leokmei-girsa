י הוא לא תשכב בעבטו, הא עשיר - שכיב."], ["", "ר&#x27;&#x27;ש: ה&#x27;&#x27;ק: ואם איש עני הוא לא תשכב ועבוטו אצלך, הא עשיר - שכיב ועבוטו אצלך."], ["", "• ת&quot;ר: המלוה את חבירו אינו רשאי למשכנו, ואינו חייב להחזיר לו, ועובר בכל השמות הללו."], ["", "אר&#x27;&#x27;ש: ה&#x27;&#x27;ק המלוה את חבירו אינו רשאי למשכנו, ואם משכנו חייב להחזיר לו,"], ["", "ועובר בכל השמות הללו - אסיפא."], ["", "רבא ה&#x27;&#x27;ק המלוה את חבירו אינו רשאי למשכנו, ואם משכנו - חייב להחזיר לו."], ["", "בד&quot;א - שמשכנו שלא בשעת הלואתו, אבל משכנו בשעת הלואתו - אינו חייב להחזיר לו, ועובר בכל השמות הללו - ארישא."], ["", "• תני ר&#x27;&#x27;ז לפני רבא: &#x27;עד בא השמש תשיבנו לו&#x27; זו כסות לילה,"], ["", "&#x27;השב תשיב לו את העבוט כבוא השמש&#x27; - זו כסות יום."], ["", "א&quot;ל: דיממא בליליא למה לי, ודליליא ביממא למה לי"], ["", "וא&#x27;&#x27;ל שלא ימחקה דה&#x27;&#x27;ק &#x27;עד בא השמש תשיבנו לו&#x27; - זו כסות יום שניתנה לחבול בלילה,"], ["", "&#x27;השב תשיב לו את העבוט כבוא השמש&#x27; - זו כסות לילה שניתנה לחבול ביום."], ["", "קטו."], ["", "• ארי&quot;ו: משכנו ומת - שומטו מע&quot;ג בניו."], ["", "• והך דר&#x27;&#x27;מ וכי מאחר שמחזירין למה ממשכנין מעיקרא? שלא תהא שביעית משמטתו, ולא יעשה מטלטלין אצל בניו."]], "id": 8160}, {"k": "hatz", "a": "***", "l": [], "id": 8175}, {"k": "u", "a": "", "l": [["", "ת&quot;ר: &#x27;לא תבא אל ביתו לעבט עבטו אבל אתה נכנס לביתו של ערב&#x27;."], ["", "וכן הוא אומר &#x27;לקח בגדו כי ערב זר וגו&#x27;. ואומר &#x27;בני אם ערבת לרעך תקעת לזר כפיך נוקשת באמרי פיך נלכדת באמרי פיך עשה זאת אפוא בני והנצל כי באת בכף רעך לך התרפס ורהב רעיך&#x27;."], ["", "אם ממון יש לו בידך - התר לו פיסת יד, ואם לאו - הרבה עליו רעים."], ["", "• לצד שני: לביתו אי אתה נכנס, אבל אתה נכנס לשכר כתף, לשכר חמר, לשכר פונדק, לשכר דיוקנאות."], ["", "יכול אפילו זקפן עליו במלוה - ת&quot;ל משאת מאומה."]], "id": 8176}, {"k": "hatz", "a": "***", "l": [], "id": 8181}, {"k": "m", "a": "", "l": [["", "משנה."], ["", "אלמנה, בין שהיא ענייה בין שהיא עשירה - אין ממשכנין אותה, שנא&#x27; ולא תחבל בגד אלמנה."]], "id": 8182}, {"k": "hatz", "a": "***", "l": [], "id": 8184}, {"k": "u", "a": "", "l": [["", "ת&quot;ר: לר&#x27;&#x27;י: אלמנה, בין שהיא ענייה בין שהיא עשירה - אין ממשכנין אותה."], ["", "ולר&#x27;&#x27;ש: עשירה - ממשכנין אותה, ענייה - אין ממשכנין אותה,"], ["", " שאתה חייב להחזיר לה ואתה משיאה שם רע בשכנותיה."], ["", "למימרא דר&quot;י לא דריש טעמא דקרא, ור&#x27;&#x27;ש דריש טעמא דקרא והא איפכא שמעינן להו,"], ["", "דתניא: ולא ירבה לו נשים, לר&#x27;&#x27;י: מרבה הוא, ובלבד שלא יהו מסירות את לבו."], ["", "ולר&#x27;&#x27;ש: אפילו אחת והיא מסירה את לבו הר&quot;ז לא ישאנה, והך ולא ירבה לו נשים&#x27; אפילו כאביגיל!"], ["", "- לעולם ר&#x27;&#x27;י לא דריש טעמא דקרא, ושאני כאן דמפרש קרא, ולא ירבה לו נשים ולא יסור,"], ["", "והיינו לא ירבה לו נשים - משום דלא יסור."], ["", "- ולר&#x27;&#x27;ש: לעולם דרשי&#x27; וא&#x27;&#x27;כ ידעי&#x27; דלא יסור,"], ["", "והך דכתבי&#x27; לא יסור ש&#x27;&#x27;מ אפי&#x27; אחת ומסירה את ליבו הר&#x27;&#x27;ז לא ישאנה"]], "id": 8185}, {"k": "hatz", "a": "***", "l": [], "id": 8195}, {"k": "m", "a": "", "l": [["", "משנה."], ["", "החובל את הריחים עובר משום לא תעשה, וחייב משום שני כלים, שנאמר לא יחבל ריחים ורכב."], ["", "ולא ריחים ורכב בלבד אמרו, אלא כל דבר שעושין בו אוכל נפש, שנאמר כי נפש הוא חבל."], ["", "***"]], "id": 8196}, {"k": "u", "a": "", "l": [["", "ר&#x27;&#x27;ה: חבל ריחים - לוקה שתים, משום ריחים ומשום &#x27;כי נפש הוא חבל&#x27;."], ["", "ריחים ורכב - לוקה שלש, משום רחים ורכב, ומשום כי נפש הוא חבל."], ["", "ולר&#x27;&#x27;י: חבל ריחים - לוקה אחת, ורכב - לוקה אחת, ריחים ורכב - לוקה שתים."], ["", "&#x27;כי נפש הוא חבל&#x27; - לשאר דברים הוא דאתא."]], "id": 8200}, {"k": "hatz", "a": "***", "l": [], "id": 8204}, {"k": "u", "a": "", "l": [["", "קטו:"], ["", "• לימא אביי ורבא בפלוגתא דרב הונא ורב יהודה קמיפלגי."], ["", "דאמר רבא: אכל נא - לוקה שתים, משום נא ומשום כי אם צלי אש,"], ["", "מבושל - לוקה שתים, משום מבושל ומשום כי אם צלי אש."], ["", "נא ומבושל - לוקה שלש: משום נא, ומשום מבושל, ומשום לא תאכלנו כי אם צלי אש."], ["", "אביי אמר: אין לוקין על לא 1}]}], "toc": [[2, 68, "- ר&#x27;&#x27;ח קמייתא  -"], [4, 109, "&#x27;ר&#x27;&#x27;ח בתרייתא&#x27;  - סוגיית &#x27;הילך&#x27;"], [4, 112, "מנה לי בידך והלה אומר: רק חמישים זוז! והילך,"], [4, 114, "הילך חייב שבועת מודה במקצת."], [5, 155, "טענו כלים וקרקעות,"], [6, 173, "אף שכל קרקע זה &#x27;הילך&#x27;, צריך פסוק למעט קרקע משבועה, "], [7, 214, "ולא אומרים מיגו דחשוד על הממון חשוד על השבועה"], [8, 244, "תקפה אחד בפנינו ובתחילה שתק ווהדר צווח, מאי? "], [8, 256, "המשך האיבעיא"], [8, 258, "תקפה אחד בפנינו מוציאין אותה מידו הקדישה אינה מקודשת!"], [8, 260, "תקפה אחד בפנינו אין מוציאין מידו הקדישה בלא תקפה מהו?"], [10, 290, "הדין שנפסק לגבי המסותא מרחץ"], [11, 321, "נפל ליד דיין לא יוציאו עולמית,"], [11, 346, "מחלוקת בששניהם אדוקים בטופס ושניהם בתורף,"], [12, 360, "רמי ב&#x27;&#x27;ח: זאת אומרת המגביה מציאה לחבירו - קנה חבירו."], [13, 411, "מוסירה – כאדם המוסר לחבירו"], [15, 457, "בעי ר&#x27;&#x27;א: &#x27;משוך בהמה זו וקנה כלים שעליה&#x27; מהו? "], [15, 472, "מי שליקט את הפאה, ואמר הר&quot;ז לפלוני עני, "], [16, 492, "המגביה מציאה לחבירו - לא קנה חבירו. דהוי תופס לבע&quot;ח במקום שחב לאחרים דלא קנה."], [17, 527, "קטנה אין לה חצר, ואין לה ד&#x27; אמות."], [18, 567, "המקור לכך"], [20, 614, "והוא שרץ אחריהן ומגיען."], [20, 618, "זרק ארנקי בפתח זה ויצא בפתח אחר מהו?"], [20, 629, "מפני מה אמרו מציאת קטן לאביו "], [20, 686, "כשהלוה החייב, מודה."], [22, 720, "ר&quot;א: המחלוקת במשנה -בשאין חייב מודה,"], [22, 723, "ורי&quot;ו: מחלוקת כשחייב מודה,"], [22, 727, "תניא כוותיה דר&#x27; יוחנן כשאין חייב מודה לכו&#x27;&#x27;ע לא יחזיר"], [22, 735, "תיובתא דר&quot;א בחדא, "], [22, 741, "תיובתא דשמואל שלא חשש לקנוניא בתרתי."], [23, 750, "טעם דרבנן ששטר שאין בו אחריות שגובה אף ממשועבדים "], [23, 761, "ראובן שמכר שדה לשמעון באחריות, ובא בע&quot;ח וגבאה, "], [24, 769, "מכר שדה לשמעון שלא באחריות, ויצאו עליה עסיקין."], [24, 775, "המוכר שדה לחבירו ונמצאת שאינה שלו,"], [24, 778, "פירש לו [שאם יגבוה ישלם] את השבח מהו?"], [25, 823, "בע&quot;ח גובה את השבח."], [25, 835, "המוכר שדה לחבירו והשביחה, וב      t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft+=SGN*e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
