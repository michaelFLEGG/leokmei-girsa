, "l": [["", "וַיַּעַן שְׁכַנְיָה בֶן יְחִיאֵל מִבְּנֵי עֵילָם וַיֹּאמֶר לְעֶזְרָא אֲנַחְנוּ מָעַלְנוּ בֵאלֹהֵינוּ וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת מֵעַמֵּי הָאָרֶץ וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל זֹאת."], ["", "ושכניה בן יחיאל מיהושע. "]], "id": 672}, {"k": "u", "a": "דכתיב ", "l": [["", "וַיֹּאמֶר ה&#x27; אֶל יְהוֹשֻׁעַ קֻם לָךְ לָמָּה זֶּה אַתָּה נֹפֵל עַל פָּנֶיךָ, חָטָא יִשְׂרָאֵל ."], ["", "<i class=\"am\">א&#x27;&#x27;ל:<\/i> רבש&quot;ע, מי חטא? <i class=\"am\">א&#x27;&#x27;ל:<\/i> וכי דילטור אני לך? הטל גורלות."], ["", "<i class=\"am\">ב. <\/i>ממשה, <i class=\"am\">דכתיב<\/i> <i class=\"ps\">עַד אָנָה מֵאַנְתֶּם. <\/i><i class=\"hs\">[בלשון כללית]<\/i>"]], "id": 675}, {"k": "u", "a": "תנו רבנן: ", "l": [], "id": 679}, {"k": "nose", "a": "משמתו נביאים האחרונים חגי זכריה ומלאכי - נסתלקה רוח הקודש מישראל, ואעפ&#x27;&#x27;כ היו משתמשין בבת קול.", "l": [], "id": 680}, {"k": "u", "a": "פעם אחת ", "l": [["", "היו מסובין בעליית בית גוריה ביריחו ונתנה עליהם בת קול מן השמים: יש כאן אחד שראוי שתשרה עליו שכינה <i class=\"hs\">(כמשה רבינו),<\/i> אלא שאין דורו זכאי לכך, נתנו חכמים את עיניהם בהלל הזקן."], ["", "וכשמת אמרו עליו: הי חסיד, הי עניו, תלמידו של עזרא!"]], "id": 681}, {"k": "u", "a": "שוב פעם אחת", "l": [["", "היו מסובין בעליה ביבנה, ונתנה עליהם בת קול מן השמים: יש כאן אחד שראוי שתשרה עליו שכינה, אלא שאין דורו זכאי לכך - נתנו חכמים את עיניהם בשמואל הקטן."], ["", "וכשמת אמרו עליו: הי חסיד, הי עניו, תלמידו של הלל."], ["", "<i class=\"am\">אף הוא אמר בשעת מיתתו:<\/i> רשב&#x27;&#x27;ג ורי&#x27;&#x27;ש כה&#x27;&#x27;ג -לחרב, וחבריהם לשאר מיתות, ושאר העם לביזה, וצרות גדולות עתידין לבוא על העולם. ועל יהודה בן בבא בקשו לומר כן, אלא שנטרפה שעה, שאין מספידין על הרוגי מלכות."]], "id": 684}, {"k": "nose", "a": "תנו רבנן: אין מעברין את השנה אא&#x27;&#x27;כ ירצה נשיא.", "l": [], "id": 688}, {"k": "u", "a": "ומעשה בר&#x27;&#x27;ג", "l": [["", "שהלך ליטול רשות אצל הגמון אחד שבסוריא, ושהה לבוא, ועיברו את השנה על מנת שירצה רבן גמליאל. וכשבא ר&#x27;&#x27;ג ואמר רוצה אני - נמצאת שנה מעוברת."]], "id": 689}, {"k": "u", "a": "תנו רבנן: ", "l": [["", "אין מעברין את השנה אא&#x27;&#x27;כ היתה צריכה מפני הדרכים, ומפני הגשרים, ומפני תנורי פסחים, ומפני גליות ישראל שנעקרו ממקומן ועדיין לא הגיעו. \t\tאבל לא מפני השלג, ולא מפני הצינה, ולא מפני גליות ישראל שלא עקרו ממקומן."]], "id": 691}, {"k": "u", "a": "תנו רבנן:", "l": [["", "אין מעברין את השנה לא מפני הגדיים, ולא מפני הטלאים, ולא מפני הגוזלות שלא פירחו, אבל עושין אותן סעד לשנה."], ["", "<i class=\"am\">רשב&#x27;&#x27;ג:<\/i> אנו מודיעים לכם שהגוזלין רכין, וכבשים דקין, וזמן אביב לא בא, ויפה הדבר לפני להוסיף על שנה זו חודש ל&#x27; יום "]], "id": 693}, {"k": "u", "a": "והך:", "l": [["", "דעיבור השנה ל&#x27; יום, <i class=\"am\">\tרשב&#x27;&#x27;ג:<\/i> חדש - היינו רצו חדש רצו ל&#x27; יום."]], "id": 696}, {"k": "u", "a": "ר&#x27;&#x27;פ: ", "l": [], "id": 698}]}, {"daf": "יא:", "perek": "פרק ראשון", "perekName": "דיני ממונות", "units": [{"k": "u", "a": "", "l": [["", "ראה מה בין תקיפאי קדמאי <i class=\"hs\">ר&#x27;&#x27;ג: שמא יפה בעיני<\/i>. "], ["", "לענוים של דורות מאוחרים <i class=\"hs\">רשב&#x27;&#x27;ג: שמא יפה בעיני ובעיני חברי<\/i>"]], "id": 700}, {"k": "u", "a": "דתניא מעשה בר&#x27;&#x27;ג", "l": [["", "שהיה יושב על גב מעלה בהר הבית, <i class=\"am\">ויוחנן סופר הלז עומד לפניו,<\/i> ושלש איגרות חתוכות לפניו מונחות. "]], "id": 702}, {"k": "u", "a": "אמר לו:", "l": [["", "טול איגרת אחת, וכתוב: לאחינו בני גליל העליון ולאחינו בני גליל התחתון שלומכם ירבה מודיעים אנו לכם, שזמן הביעור בא להפריך מעשר מן הזיתים. "], ["", "וטול איגרת אחת וכתוב: לאחינו בני דרום, שלומכון יסגא! מודיעים אנו לכם זמן הביעור בא להפריש מעשר מעומרי השיבולים "], ["", "וטול איגרת אחת וכתוב: לאחינו בני גלות בבבל, ולאחינו שבמדי, ולשאר כל גלויות דישראל, שלומכון ירבה לעלם, מודיעים אנו לכם, שהגוזלות רכיכין וכבשים דקין, וזמן אביב לא בא, ויפה בעיננו <i class=\"b\">ובעיני חברי<\/i> להוסיף על שנה זו ל&#x27; יום "]], "id": 704}, {"k": "u", "a": "-ודחי&#x27;", "l": [["", "דשמא היה זה אחר שעיברוהו. "]], "id": 708}, {"k": "u", "a": "ת&#x27;&#x27 46}, {"k": "dh", "a": "סמיכת זקנים.", "l": [], "id": 848}, {"k": "u", "a": "תנו רבנן:", "l": [["", "<i class=\"ps\">וְסָמְכוּ זִקְנֵי,<\/i> <i class=\"ps\">עֵדָה-<\/i> ולא זקני השוק. <i class=\"ps\">הָעֵדָה<\/i> -מיוחדין שבעדה."]], "id": 849}, {"k": "u", "a": "ר&#x27;&#x27;י", "l": [["", "<i class=\"ps\">וְסָמְכוּ<\/i> שנים, <i class=\"ps\">זִקְנֵי<\/i> שנים, ואין ב&#x27;&#x27;ד שקול מוסיפין עוד אחד, הרי חמשה, "]], "id": 851}, {"k": "u", "a": "ר&quot;ש:", "l": [["", "<i class=\"ps\">זִקְנֵי -<\/i> שנים, \tואין ב&#x27;&#x27;ד שקול - מוסיפין עוד אחד, הרי שלשה."]], "id": 853}, {"k": "u", "a": "ור&#x27;&#x27;ש ", "l": [["", "<i class=\"ps\">וְסָמְכוּ<\/i> - מיבעי לגופיה."]], "id": 855}, {"k": "u", "a": "ולר&#x27;&#x27;י", "l": [["", "לגופיה א&#x27;&#x27;צ; דא&#x27;&#x27;כ לא אתי וסמכו לדרשה - ליכתוב זקני העדה ידיהם על ראש הפר."]], "id": 857}, {"k": "u", "a": "ורבי שמעון", "l": [["", "א&#x27;&#x27;כ כתיב כאן הו&#x27;&#x27;א על – בסמוך "]], "id": 859}, {"k": "u", "a": "ור&#x27;&#x27;י", "l": [["", "גמר <i class=\"ps\">ראש ראש<\/i> מעולה. ור&#x27;&#x27;ש לא למד ראש ראש מעולה"]], "id": 861}, {"k": "nose", "a": "תנא: סמיכה וסמיכת זקנים בשלשה.", "l": [], "id": 863}, {"k": "u", "a": "רי&#x27;&#x27;ו", "l": [["", "סמיכת זקנים <i class=\"am\">- <\/i>מיסמך סבי."]], "id": 864}, {"k": "u", "a": "הקשה אביי:", "l": [["", "מנלן דבשלשה אי מ<i class=\"ps\">וַיִּסְמֹךְ אֶת יָדָיו עָלָיו<\/i> – א&#x27;&#x27;כ סגי בחד "], ["", "<i class=\"am\">ואין לומר<\/i> דמשה במקום ע&#x27;&#x27;א דא&#x27;&#x27;כ ליבעי ע&#x27;&#x27;א\t- קשיא "]], "id": 866}, {"k": "u", "a": "ר&#x27;&#x27;א", "l": [["", "לא ביד ממש אלא בשמו קרי לו רבי, ויהבי לו רשות לדון דיני קנסות."]], "id": 869}, {"k": "u", "a": "והך דרב:", "l": [["", "ברם, זכור אותו האיש לטוב, ורבי יהודה בן בבא שמו, שאילמלא הוא בטלו דיני קנסות מישראל."]], "id": 871}]}, {"daf": "יד.", "perek": "פרק ראשון", "perekName": "דיני ממונות", "units": [{"k": "u", "a": "", "l": [["", "שפעם אחת גזרה מלכות הרשעה שמד על ישראל, שכל הסומך יהרג, וכל הנסמך - יהרג, ועיר 43}, {"k": "u", "a": "- אמרו לו:", "l": [["", "לא היה הדבר אלא לפייס את העם, ונתפייסו. שהיה דוד יוצא מבין האנשים ונכנס לבין הנשים, ויצא מבין הנשים ונכנס לבין האנשים, ד<i class=\"ps\">וַיֵּדְעוּ כָל הָעָם וְכָל יִשְׂרָאֵל... כִּי לֹא הָיְתָה מֵהַמֶּלֶךְ לְהָמִית אֶת אַבְנֵר <\/i>"]], "id": 1445}, {"k": "u", "a": "דרש רבא:", "l": [["", "<i class=\"ps\">וַיָּבֹא כָל הָעָם לְהַבְרוֹת אֶת דָּוִד<\/i>, <i class=\"am\">כתיב<\/i> להכרות וקרינן להברות, בתחלה - להכרותו, ולבסוף - להברותו."]], "id": 1447}, {"k": "u", "a": "מרב:", "l": [["", "מפני מה נענש אבנר מפני שהיה לו למחות בשאול ולא מיחה."]], "id": 1449}, {"k": "u", "a": "רי&#x27;&#x27;צ:", "l": [["", "מיחה, ולא נענה."]], "id": 1451}, {"k": "u", "a": "ושניהם דרשו", "l": [["", "<i class=\"ps\">וַיְקֹנֵן הַמֶּלֶךְ אֶל אַבְנֵר וַיֹּאמַר הַכְּמוֹת נָבָל יָמוּת אַבְנֵר יָדֶךָ לֹא אֲסֻרוֹת וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ <\/i>"]], "id": 1453}, {"k": "u", "a": "מ&#x27;&#x27;ד לא מיחה", "l": [["", "מדוע לא מחית? <i class=\"ps\">כִּנְפוֹל לִפְנֵי בְנֵי עַוְלָה נָפָלְתָּ<\/i>!"]], "id": 1455}, {"k": "u", "a": "למ&#x27;&#x27;ד מיחה ", "l": [["", "ולא נענה, מתמה: <i class=\"ps\">הַכְּמוֹת נָבָל יָמוּת<\/i>? <i class=\"ps\">יָדֶךָ לֹא אֲסֻרוֹת וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם <\/i> הלא מחית ומדוע <i class=\"ps\">כִּנְפוֹל לִפְנֵי בְנֵי עַוְלָה נָפָלְתָּ<\/i>? "]], "id": 1457}, {"k": "u", "a": "רנב&#x27;&#x27;י: למ&#x27;&#x27;ד מיחה", "l": [["", "נענש ששהא מלכות בית דוד שתי שנים ומחצה."]], "id": 1459}, {"k": "dh", "a": "וכשמברין אותו כל העם מסובין על הארץ והוא על הדרגש.", "l": [], "id": 1461}, {"k": "nose", "a": "מאי דרגש? <i class=\"hs\">[מזל או עור]<\/i>", "l": [], "id": 1462}, {"k": "u", "a": "א. עולא: ", "l": [["", "ערסא דגדא.<i class=\"hs\"> [מיטה למזל ולא לשימוש] <\/i>"]], "id": 1463}, {"k": "u", "a": "ואין להקשות", "l": [["", "שאם יש דבר שאינו יושב עליו וכעת יישב? <i class=\"hs\">שזו אבילות<\/i>"]], "id": 1465}, {"k": "u", "a": "- שהרי", "l": [["", "זה כמו אכילה ושתיה, שכעת מאכילים אותו <i class=\"hs\">סעודת הבראה<\/i> " =\"ps\">וַיְהִי דָוִד עֹשֶׂה מִשְׁפָּט וּצְדָקָה<\/i> משפט שיש בו צדקה -זה ביצוע."]], "id": 1807}, {"k": "u", "a": "אתאן לת&quot;ק:", "l": [["", "דן את הדין, זיכה את הזכאי וחייב את החייב, וראה שנתחייב עני ממון ושלם לו מתוך ביתו - זה <i class=\"ps\">משפט וצדקה,<\/i> "], ["", "<i class=\"ps\">משפט<\/i> לזה שהחזיר לו ממון, <i class=\"ps\">וצדקה<\/i> לזה ששילם לו מתוך ביתו."]], "id": 1810}, {"k": "u", "a": "ואף לרבי:", "l": [["", "אף שלא שילם מתוך ביתו זהו <i class=\"ps\">משפט<\/i> לזה שהחזיר לו ממונו, <i class=\"ps\">וצדקה<\/i> לזה - שהוציא גזילה מתחת ידו."]], "id": 1813}, {"k": "u", "a": "רשב&#x27;&#x27;מ", "l": [["", "שנים שבאו לפניך לדין, עד שלא תשמע דבריהן, או משתשמע דבריהן ואי אתה יודע להיכן דין נוטה - אתה רשאי לומר להן: צאו ובצעו. משתשמע דבריהן ואתה יודע להיכן הדין נוטה - אי אתה רשאי לומר להן: צאו ובצעו. <i class=\"am\">שנאמר<\/i> <i class=\"ps\">פּוֹטֵר מַיִם רֵאשִׁית מָדוֹן וְלִפְנֵי הִתְגַּלַּע הָרִיב נְטוֹשׁ,<\/i> קודם שנתגלע הריב - אתה יכול לנטשו, משנתגלע הריב - אי אתה יכול לנטשו."]], "id": 1815}, {"k": "u", "a": "◄וריב&#x27;&#x27;ל:", "l": [["", "שנים שבאו לדין, אחד רך ואחד קשה, עד שלא תשמע דבריהם או משתשמע דבריהן ואין אתה יודע להיכן דין נוטה <i class=\"am\">- אתה רשאי לומר להם:<\/i> אין אני נזקק לכם. שמא נתחייב חזק ונמצא חזק רודפו."], ["", "משתשמע דבריהן ואתה יודע להיכן הדין נוטה - אי אתה יכול לומר להן איני נזקק לכם, <i class=\"am\">שנאמר<\/i> <i class=\"ps\">לֹא תָגוּרוּ מִפְּנֵי אִישׁ<\/i>."]], "id": 1817}, {"k": "u", "a": "◄ריב&#x27;&#x27;ק:", "l": [["", "מניין לתלמיד שיושב לפני רבו וראה זכות לעני וחובה לעשיר, שלא ישתוק <i class=\"am\">ד<\/i><i class=\"ps\">לֹא תָגוּרוּ מִפְּנֵי אִישׁ,<\/i> <i class=\"am\">ר&#x27;&#x27;ח:<\/i> לא תכניס דבריך מפני איש."], ["", "ויהו עדים יודעים את מי הן מעידין, ולפני מי הן מעידין, ומי עתיד ליפרע מהן, <i class=\"am\">ד<\/i><i class=\"ps\">וְעָמְדוּ שְׁנֵי הָאֲנָשִׁים אֲשֶׁר לָהֶם הָרִיב לִפְנֵי ה&#x27;.<\/i>"], ["", "ויהו הדיינין יודעין את מי הן דנין, ולפני מי הן דנין, ומי עתיד ליפרע מהן, <i class=\"am\">שנאמ&#x27;<\/i> < ": 2184}, {"k": "u", "a": "ולר&#x27;&#x27;י", "l": [["", "לגופיה א&#x27;&#x27;צ; דא&#x27;&#x27;כ לא אתי וסמכו לדרשה - ליכתוב זקני העדה ידיהם על ראש הפר."]], "id": 2186}, {"k": "u", "a": "ורבי שמעון", "l": [["", "א&#x27;&#x27;כ כתיב כאן הו&#x27;&#x27;א על – בסמוך "]], "id": 2188}, {"k": "u", "a": "ור&#x27;&#x27;י", "l": [["", "גמר <i class=\"ps\">ראש ראש<\/i> מעולה. ור&#x27;&#x27;ש לא למד ראש ראש מעולה"]], "id": 2190}, {"k": "nose", "a": "תנא: סמיכה וסמיכת זקנים בשלשה.", "l": [], "id": 2192}, {"k": "u", "a": "רי&#x27;&#x27;ו", "l": [["", "סמיכת זקנים <i class=\"am\">- <\/i>מיסמך סבי."]], "id": 2193}, {"k": "u", "a": "הקשה אביי:", "l": [["", "מנלן דבשלשה אי מ<i class=\"ps\">וַיִּסְמֹךְ אֶת יָדָיו עָלָיו<\/i> – א&#x27;&#x27;כ סגי בחד "], ["", "<i class=\"am\">ואין לומר<\/i> דמשה במקום ע&#x27;&#x27;א דא&#x27;&#x27;כ ליבעי ע&#x27;&#x27;א\t- קשיא "]], "id": 2195}, {"k": "u", "a": "ר&#x27;&#x27;א", "l": [["", "לא ביד ממש אלא בשמו קרי לו רבי, ויהבי לו רשות לדון דיני קנסות."]], "id": 2198}, {"k": "u", "a": "והך דרב:", "l": [["", "ברם, זכור אותו האיש לטוב, ורבי יהודה בן בבא שמו, שאילמלא הוא בטלו דיני קנסות מישראל."]], "id": 2200}, {"k": "u", "a": "והך דרב:", "l": [["", "ברם, זכור אותו האיש לטוב, ורבי יהודה בן בבא שמו, שאילמלא הוא בטלו דיני קנסות מישראל."]], "id": 2202}]}, {"daf": "יד.", "perek": "פרק ראשון", "perekName": "דיני ממונות", "units": [{"k": "u", "a": "", "l": [["", "שפעם אחת גזרה מלכות הרשעה שמד על ישראל, שכל הסומך יהרג, וכל הנסמך - יהרג, ועיר שסומכין בה - תיחרב, ותחומין שסומכין בהן - יעקרו."], ["", "מה עשה יהודה בן בבא? הלך וישב לו בין שני הרים גדולים, ובין שתי עיירות גדולות, ובין שני תחומי שבת, בין אושא לשפרעם. וסמך שם חמשה זקנים, ואלו הן: רבי מאיר, ורבי יהודה, ורבי שמעון, ורבי יוסי, ורבי אלעזר בן שמוע. "], ["", "<i class=\"am\">רב אויא מוסיף:<\/i> אף רבי נחמיה."], ["", "כיון שהכירו אויביהם בהן <i class=\"am\">אמר להן:<\/i> בניי, רוצו! <i class=\"am\">אמרו לו:<\/i> רבי, מה תהא עליך?  <i class=\"am\">אמר להן:<\/i> הריני מוטל לפניהם כאבן שאין לה הופכים."]], "id": 2205}, {"k": "u", "a": "אמרו:", "l": [["", "לא זזו משם עד שנעצו בו שלש מאות לונביאות של ברזל, ועשאוהו ככברה."]], "id": 2209}, {"k": "u", "a": "-מתרצת הגמ&#x27;:", "l": [["", "היו עם ריב&#x27;&#x27;ב עוד סומכים ולא החשיבום- משום כבודו דריב&#x27;&#x27;ב."]], "id": 2211}, {"k": "u", "a": "ואף", "l": [["", "שר&#x27;&#x27;מ הוסמך מר&#x27;&#x27;ע לא קיבלו <i class=\"hs\">[צעיר]<\/i>, רק אחר שריב&#x27;&#x27;ב הסמיכו "]], "id": 2213}, {"k": "nose", "a": "ריב&#x27;&#x27;ל: אין סמיכה בחוצה לארץ.", "l": [], "id": 2215}, {"k": "u", "a": "לא", "l": [["", "שלא דנים קנסות בחו&#x27;&#x27;ל <i class=\"am\">דהא תנן<\/i> סנהדרין נוהגת בארץ ובחו&#x27;&#x27;ל "]], "id": 2216}, {"k": "u", "a": "- אלא:", "l": [["", "שלא סומכים אם הנסמכים בחו&#x27;&#x27;ל אף אם הסומכים בארץ "]], "id": 2218}, {"k": "u", "a": "כהך א.", "l": [["", "<i class=\"am\">דרי&#x27;&#x27;ו<\/i> <i class=\"hs\">בא&#x27;&#x27;י<\/i><i class=\"am\"> <\/i>הצטער שלא הסמיך לרשב&#x27;&#x27;א שלא היה אצלו !"]], "id": 2220}, {"k": "u", "a": "ב.", "l": [["", "<i class=\"am\">רשב&#x27;&#x27;ז וחד שעמו ריב&#x27;&#x27;ע<\/i> <i class=\"hs\">[או להיפך]<\/i> שהיה עמם- נסמך, והשני לא. "]], "id": 2222}, {"k": "u", "a": "ג.", "l": [["", "שרצה לסמוך <i class=\"am\">לר&#x27;&#x27;ח ור&#x27;הו<\/i>  ולא הסתייע הדבר, והצטער הרבה <i class=\"am\">א&#x27;&#x27;ל<\/i> שלא יצטער, שאנו מבית עלי <i class=\"am\">וכריו&#x27;&#x27;נ:<\/i> שאין נסמכין לבית עלי - ד<i class=\"ps\">לֹא יִהְיֶה זָקֵן בְּבֵיתְךָ כָּל הַיָּמִים<\/i>, ולא זקן ממש דהא <i class=\"ps\">כָל מַרְבִּית בֵּיתְךָ יָמוּתוּ אֲנָשִׁים<\/i> - אלא <i class=\"ps\">זָקֵן<\/i> היינו סמיכה."]], "id": 2224}, {"k": "u", "a": "ד.", "l": [["", "ר&#x27;&#x27;ז הסתתר שיסמכוהו <i class=\"am\">דאר&#x27;&#x27;א:<\/i> לעולם הוה קבל<i class=\"hs\"> החבא<\/i> וקיים <i class=\"hs\">וחיה<\/i><i class=\"am\">.<\/i>"], ["", "<i class=\"am\">וכששמע לר&#x27;&#x27;א<\/i>: אין אדם עולה לגדולה אא&#x27;&#x27;כ מוחלין לו על כל עונותיו - התאמץ שיסמכוהו."]], "id": 2226}, {"k": "u", "a": "ה.", "l": [["", "<i class=\" ן, <i class=\"ps\">וּמָדְדוּ -<\/i> שאפילו נמצא בעליל לעיר צריך לעסוק במדידה."]], "id": 2246}]}, {"daf": "יד:", "perek": "פרק ראשון", "perekName": "דיני ממונות", "units": [{"k": "u", "a": "דלא כראב&#x27;&#x27;י ", "l": [["", "<i class=\"ps\">וְיָצְאוּ זְקֵנֶיךָ <\/i>זו סנהדרין, <i class=\"ps\">וְשֹׁפְטֶיךָ <\/i>זה מלך ד<i class=\"ps\">מֶלֶךְ בְּמִשְׁפָּט יַעֲמִיד אָרֶץ<\/i>, "], ["", "וכהן גדול -ד<i class=\"ps\">וּבָאתָ אֶל הַכֹּהֲנִים הַלְוִיִּם וְאֶל הַשֹּׁפֵט<\/i>."]], "id": 2249}, {"k": "nose", "a": "איבעיא להו: ראב&#x27;&#x27;י בחדא או בתרתי פליג? ", "l": [], "id": 2252}, {"k": "u", "a": "", "l": [["", "<i class=\"hs\">במלך וכהן גדול פליג, אבל בסנהדרי כר&#x27;&#x27;י או כר&#x27;&#x27;ש,<\/i>"], ["", "<i class=\"hs\">או גם בסנה&#x27; פליג  וס&#x27;&#x27;ל: כולה סנהדרי בעינן!<\/i>"]], "id": 2253}, {"k": "u", "a": "הוכיח רב יוסף: ", "l": [["", "מצאן <i class=\"hs\">זקן ממרא לסנה&#x27;<\/i> בבית פגי והמרה עליהן, יכול המראתו המראה <i class=\"am\">ת&#x27;&#x27;ל<\/i> <i class=\"ps\">וְקַמְתָּ וְעָלִיתָ אֶל הַמָּקוֹם<\/i> מלמד שהמקום גורם."]], "id": 2255}, {"k": "u", "a": "ופשוט", "l": [["", "שמצא לכולם, שאם לא אפשר שחלקם שבפנים ס&#x27;&#x27;ל כמותו "]], "id": 2257}, {"k": "u", "a": "ופשוט", "l": [["", "שיצאו לדבר מצוה דלדבר הרשות אסור ד<i class=\"ps\">שָׁרְרֵךְ אַגַּן הַסַּהַר אַל יֶחְסַר הַמָּזֶג<\/i>. <i class=\"am\">ולכאו&#x27;<\/i> למדידת עגלה,<i class=\"am\"> וכראב&#x27;&#x27;י: דבעי <\/i>כל הסנהדרין!"]], "id": 2259}, {"k": "u", "a": "דחה אביי:", "l": [["", "לא, כגון שיצאו להוסיף על העיר ועל העזרות. <i class=\"am\">כדתנן:<\/i> אין מוסיפין על העיר ועל העזרות אלא בבית דין של שבעים ואחד."]], "id": 2261}, {"k": "u", "a": "ת&#x27;&#x27;כ דר&#x27;&#x27; יוסף", "l": [["", "מצאן אבית פאגי והמרה עליהן, כגון שיצאו למדידת עגלה, ולהוסיף על העיר ועל העזרות, יכול שתהא המראתו המראה <i class=\"am\">-ת&#x27;&#x27;ל<\/i> <i class=\"ps\">וְקַמְתָּ וְעָלִיתָ אֶל הַמָּקוֹם<\/i> מלמד שהמקום גורם."]], "id": 2263}, {"k": "dh", "a": "נטע רבעי ומעשר שני שאין דמיו ידועין בשלשה.", "l": [], \/i> - בדומין לך ליהוי. <i class=\"hs\">[ביתרו]<\/i>"]], "id": 4339}, {"k": "hatz", "a": "***", "l": [], "id": 4341}, {"k": "u", "a": "", "l": [["", "משנה."]], "id": 4342}, {"k": "m", "a": "", "l": [["", "סנהדרין היתה כחצי גורן עגולה, כדי שיהו רואין זה את זה."], ["", "ושני סופרי הדיינין עומדים לפניהם, אחד מימין ואחד משמאל, וכותבין דברי המזכין ודברי המחייבין."], ["", "רבי יהודה: שלשה, אחד כותב דברי המזכין, ואחד כותב דברי המחייבין, והשלישי כותב דברי המזכין ודברי המחייבין."]], "id": 4343}]}, {"daf": "לז.", "perek": "פרק רביעי", "perekName": "אחד דיני ממונות", "units": [{"k": "m", "a": "", "l": [["", "ושלש שורות של תלמידי חכמים יושבין לפניהן."], ["", "כל אחד ואחד מכיר את מקומו. הוצרכו לסמוך סומכין מן הראשונה, אחד מן השניה בא לו לראשונה. אחד מן השלישית בא לו לשניה, בוררים להן עוד אחד מן הקהל ומושיבין אותו בשלישית. ולא היה יושב במקומו של ראשון אלא יושב במקום הראוי לו."]], "id": 4347}, {"k": "dh", "a": "סנהדרין היתה כחצי גורן עגולה, ", "l": [], "id": 4349}, {"k": "u", "a": "ראבר&#x27;&#x27;ח:", "l": [["", "<i class=\"ps\">שָׁרְרֵךְ -<\/i> זו סנהדרין, שהיא יושבת בטיבורו של עולם."], ["", "<i class=\"ps\">אַגַּן<\/i> - שהיא מגינה על כל העולם כולו, <i class=\"ps\">הַסַּהַר<\/i> - שדומה לסהר, "], ["", "<i class=\"ps\">אַל יֶחְסַר הַמָּזֶג <\/i>שאם הוצרך אחד מהם לצאת, רואין אם יש כ&#x27;&#x27;ג  \tכנגד סנהדרי קטנה - יוצא, ואם לאו אינו יוצא."], ["", "<i class=\"ps\">בִּטְנֵךְ עֲרֵמַת חִטִּים\t- <\/i>מה ערימת חטים הכל נהנין ממנה "], ["", "- אף סנהדרין הכל נהנין מטעמיהן."], ["", "<i class=\"ps\">סוּגָה בַּשּׁוֹשַׁנִּים<\/i> שאפילו כסוגה של שושנים לא יפרצו בהן פרצות."]], "id": 4350}, {"k": "u", "a": "מין לר&#x27;&#x27;כ", "l": [["", "איך נדה מותרת? הלא זו אש בנעורת ואינה מהבהבת. "]], "id": 4357}, {"k": "u", "a": "א. א&#x27;&#x27;ל  ", "l": [["", "התורה העידה עלינו <i class=\"ps\">סוגה בשושנים<\/i>, שאפילו כסוגה בשושנים "]], "id": 4359}, {"k": "u", "a": "ב. ר&#x27;&#x27;ל:", "l": [["", "<i class=\"ps\">כְּפֶלַח הָרִמּוֹן רַקָּתֵךְ<\/i> אפילו ריקנין שבך מלאין מצוות כרמון."]], "id": 4361}, {"k": "u", "a": "ג. ר&#x27;&#x27;ז", "l": [["", "<i class=\"ps\">וַיָּרַח אֶת רֵיחַ בְּגָדָיו,<\/i> אל תיקרי בגדיו אלא בוגדיו."]], "id": 4363}, {"k": "u", "a": "מעשה", "l": [["", "בבריונים שכני ר&#x27;&#x27;ז שקרבם כדי שיחזרו בתשובה ורבנן הקפידו "], ["", "כשנפטר אמרו עד עכשיו ר&#x27;&#x27;ז התפלל עלינו, כעת מי יתפלל עלינו וחזרו בתשובה, <i class=\"hs\">[כינוהו &#x27;קטן ששוקיו חרוכות&#x27; כמעשה דב&#x27;&#x27;מ]<\/i>"]], "id": 4365}, {"k": "dh", "a": "שלש שורות של ת&#x27;&#x27;ח יושבין לפניהן כו&#x27;.", "l": [], "id": 4368}, {"k": "u", "a": "אביי: ", "l": [["", "ש&#x27;&#x27;מ כי ניידי כולם זזים. ואף שעד עכשיו ישב בראש השורה, וכעת אחרון בשורה היותר גבוהה <i class=\"am\">- <\/i>היה זנב לאריות ואל תהי ראש לשועלים."]], "id": 4369}, {"k": "hatz", "a": "***", "l": [], "id": 4371}, {"k": "u", "a": "", "l": [["", "משנה."]], "id": 4372}, {"k": "m", "a": "", "l": [["", "כיצד מאיימין את העדים?"], ["", "על עידי נפשות, היו מכניסין אותן ומאיימין עליהן: "], ["", "שמא תאמרו מאומד ומשמועה, עד מפי עד, ומפי אדם נאמן."], ["", "שמא אי אתם יודעין שסופנו לבדוק אתכם בדרישה ובחקירה."], ["", "הוו יודעין שלא כדיני ממונות דיני נפשות."], ["", "דיני ממונות - אדם נותן ממון ומתכפר לו, "], ["", "דיני נפשות - דמו ודם זרעותיו תלויין בו עד סוף העולם, שכן מצינו בקין שהרג את אחיו, שנאמר דְּמֵי אָחִיךָ צֹעֲקִים, אינו אומר דם אחיך אלא דמי אחיך - דמו ודם זרעותיו."], ["", "דבר אחר: דְּמֵי אָחִיךָ שהיה דמו מושלך על העצים ועל האבנים."], ["", "לפיכך נברא אדם יחידי, ללמדך שכל המאבד נפש אחת מישראל<i class=\"am\"> - מעלה עליו הכתוב<\/i> כאילו איבד עולם מלא, וכל המקיים נפש אחת מישראל - מעלה עליו הכתוב כאילו קיים עולם מלא."]], "id": 4373}, {"k": "u", "a": "ב.", "l": [], "id": 4382}, {"k": "m", "a": "", "l": [["", "ומפני שלום הבריות, שלא יאמר אדם לחבירו אבא גדול מאביך, "]], "id": 4383}, {"k": "u", "a": "ג.", "l": [], "id": 4384}, {"k": "m", "a": "", "l": [["", "ושלא יהו המינים אומרים: הרבה רשויות בשמים."]], "id": 4385}, {"k": "u", "a": "ד.", "l": [], "id": 4386}, {"k": "m", "a": "", "l": [["", " ולהגיד גדולתו של הקב&#x27;&#x27;ה, שאדם טובע כמה מטבעות בחותם אחד - כולן דומין זה לזה, ומלך מלכי המלכים הקב&#x27;&#x27;ה טבע כל אדם בחותמו של אדם הראשון - ואין אחד מהן דומה לחבירו."], ["", "לפיכך כל אחד ואחד חייב לומר: בשבילי נברא העולם."], ["", "ושמא תאמרו מה לנו ולצרה הזאת?"]], "id": 4387}, {"k": "u", "a": "-", "l": [], "id": 4390}, {"k": "m", "a": "", "l": [["", "והלא כבר נאמר וְהוּא עֵד אוֹ רָאָה אוֹ יָדָע אִם לוֹא יַגִּיד וגו&#x27;."], ["", "ושמא תאמרו: מה לנו לחוב בדמו של זה? "]], "id": 4391}, {"k": "u", "a": "-", "l": [], "id": 4393}, {"k": "m", "a": "", "l": [["", " והלא כבר נאמר בַאֲבֹד רְשָׁעִים רִנָּה."]], "id": 4394}]}, {"daf": "לז:", "perek": "פרק רביעי", "perekName": "אחד דיני ממונות", "units": [{"k": "dh", "a": "שמא תאמרו מאומד ", "l": [], "id": 4396}, {"k": "u", "a": "ת&#x27;&#x27;ר:", "l": [["", "כיצד מאומד? אומר להן: שמא כך ראיתם: שרץ אחר חבירו לחורבה, ורצתם אחריו, ומצאתם סייף בידו ודמו מטפטף, והרוג מפרפר אם כך ראיתם - לא ראיתם כלום."]], "id": 4397}, {"k": "u", "a": "רבי שמעון בן שטח:", "l": [["", "אראה בנחמה אם לא ראיתי אחד שרץ אחר חבירו לחורבה, ורצתי אחריו, וראיתי סייף בידו ודמו מטפטף והרוג מפרפר, ואמרתי לו: רשע, מי הרגו לזה? או אני או אתה. אבל מה אעשה שאין דמך מסור בידי, <i class=\"am\">שהרי אמרה תורה<\/i> <i class=\"ps\">עַל פִּי שְׁנַיִם עֵדִים יומת המת<\/i> - היודע מחשבות יפרע מאותו האיש שהרג את חבירו."]], "id": 4399}, {"k": "u", "a": "אמרו:", "l": [["", " לא זזו משם עד שבא נחש והכישו, ומת."]], "id": 4401}, {"k": "u", "a": "והך דחזקיה:", "l": [["", "מיום שחרב ביהמ&#x27;&#x27;ק, אף שבטלה סנהדרי דין ארבע מיתות לא בטלו."], ["", "מי שנתחייב סקילה \t- או נופל מן הגג, או חיה דורסתו."], ["", "מי שנתחייב שריפה \t- או נופל בדליקה, או נחש מכישו."], ["", "מי שנתחייב הריגה \t- או נמסר למלכות, או ליסטין באין עליו."], ["", "מי שנתחייב חנק \t\t- או טובע בנהר, או מת בסרונכי."]], "id": 4403}, {"k": "u", "a": "- אמרי:", "l": [["", "חטא אחר היה לו ומי שנתחייב שתי מיתות ב&#x27;&#x27;ד נידון בחמורה."]], "id": 4409}, {"k": "nose", "a": "האם אומרים &#x27;אומד&#x27; בדיני ממונות", "l": [], "id": 4411}, {"k": "u", "a": "", "l": [["", "בדיני נפשות לא אמדינן, <i class=\"am\">משמע<\/i> שבדיני ממונות אמדינן "]], "id": 4412}, {"k": "u", "a": "כר&#x27;&#x27;א", "l": [["", "גמל האוחר בין הגמלים, ונמצא גמל הרוג בצידו בידוע שזה הרגו."]], "id": 4413}, {"k": "u", "a": "- וליטעמיך", "l": [["", "עד מפי עד <i class=\"am\">דתני,<\/i> שלא אומרים בדיני נפשות וכי אומרים בממונות "]], "id": 4415}, {"k": "u", "a": "והתנן:", "l": [["", "איש פלוני אמר לי שהוא חייב לו - לא אמר כלום, <i class=\"am\">עד שיאמר:<\/i> בפנינו הודה לו שהוא חייב לו כך וכך.<i class=\"am\"> משמע: שפסול אף בדיני ממונות <\/i>"]], "id": 4417}, {"k": "u", "a": "ותרצי&#x27;", "l": [["", "אף שפסול גם בדיני ממונות, מ&#x27;&#x27;מ אומרים את זה בדיני נפשות."]], "id": 4419}, {"k": "dh", "a": "הוו יודעים כו&#x27; דמו ודם זרעו תלויים בו עד סוף העולם", "l": [], "id": 4421}, {"k": "u", "a": "ר&#x27;&#x27;י בדר&#x27;&#x27;ח:", "l": [["", "מלמד שעשה קין בהבל אחיו חבורות חבורות, פציעות פציעות, שלא היה יודע מהיכן נשמה יוצאה, עד שהגיע לצוארו."]], "id": 4422}, {"k": "u", "a": "ר&#x27;&#x27;י בדר&#x27;&#x27;ח:", "l": [["", "מיום שפתחה הארץ את פיה וקיבלה דמו של הבל - שוב לא פתחה, <i class=\"ps\">מִכְּנַף הָאָרֶץ<\/i><i class=\"ps\"> זְמִרֹת שָׁמַעְנוּ צְבִי לַצַּדִּיק<\/i>, ולא מפי הארץ."]], "id": 4424}, {"k": "u", "a": "והך:", "l": [["", "<i class=\"ps\">וַתִּפְתַּח הָאָרֶץ אֶת פִּיהָ<\/i>! - לרעה ולא לטובה. "]], "id": 4426}, {"k": "u", "a": "ר&#x27;&#x27;י בדר&#x27;&#x27;ח:", "l": [["", "גלות מכפרת עון מחצה, <i class=\"am\">מעיקרא כתיב<\/i> <i class=\"ps\">וְהָיִיתִי נָע וָנָד<\/i> "], ["", "<i class=\"am\">ולבסוף כתיב<\/i> <i class=\"ps\">וַיֵּשֶׁב בְּאֶרֶץ נוֹד<\/i>. <i class=\"hs\">[ולא כתיב נע שכיפרה לו גלותו]<\/i> "]], "id": 4428}, {"k": "u", "a": "ר&#x27;&#x27;י", "l": [["", "גלות מכפרת שלשה דברים<i class=\"b\">,<\/i> <i class=\"ps\">כֹּה אָמַר ה&#x27; הַיֹּשֵׁב בָּעִיר הַזֹּאת יָמוּת בַּחֶרֶב בָּרָעָב וּבַדָּבֶר  וְהַיֹּצֵא אֶל הַכַּשְׂדִּים יחיה וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל וָחָי<\/i>."]], "id": 4431}, {"k": "u", "a": "רי&#x27;&#x27;ו", "l": [["", "גלות מכפרת על הכל, שנאמר <i class=\"ps\">כִּתְבוּ אֶת הָאִישׁ הַזֶּה עֲרִירִי גֶּבֶר לֹא יִצְלַח בְּיָמָיו כִּי לֹא יִצְלַח מִזַּרְעוֹ אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה.<\/i> ואחר שגלה <i class=\"am\">כתיב<\/i> <i class=\"ps\">וּבְנֵי יְכָנְיָה אַסִּר שְׁאַלְתִּיאֵל בְּנוֹ.<\/i>"], ["", "<i class=\"ps\">אַסִּר <\/i>\t\t\t- שעיברתו אמו בבית האסורין, "], ["", "<i class=\"ps\">שַׁלְתִּיאֵל \t-<\/i> ששתלו אל שלא כדרך הנשתלין. <i class=\"hs\">שנתעברה מעומד<\/i>"]], "id": 4433}]}, {"daf": "לח.", "perek": "פרק רביעי", "perekName": "אחד דיני ממונות", "units": [{"k": "u", "a": "דבר אחר:", "l": [["", "<i class=\"ps\">שַׁלְתִּיאֵל \t-<\/i> שנשאל על אלתו אל, "], ["", "<i class=\"ps\">זְרֻבָּבֶל \t\t-<\/i> שנזרע בבבל, ונחמיה בן חכליה שמו."], ["", "יהודה וחזקיה בני ר&#x27;&#x27;ח ישבו בסעודה לפני רבי ולא אמרו דבר"]], "id": 4438}, {"k": "u", "a": "אמר רבי", "l": [["", "להביא להם שיתבסמו וידברו <i class=\"am\">פתחו ואמרו:<\/i> אין בן דוד בא עד שיכלו שני בתי אבות מישראל, ראש גולה שבבבל, ונשיא שבא&#x27;&#x27;י, <i class=\"ps\">וְהָיָה לְמִקְדָּשׁ וּלְאֶבֶן נֶגֶף וּלְצוּר מִכְשׁוֹל לִשְׁנֵי בָתֵּי יִשְׂרָאֵל<\/i>."]], "id": 4442}, {"k": "u", "a": "אמר להם:", "l": [["", "בניי, קוצים אתם מטילין בעיניי? <i class=\"am\">א&#x27;&#x27;ל ר&#x27;&#x27;ח:<\/i> רבי, אל ירע בעיניך, יין ניתן בשבעים אותיות, וסוד ניתן בשבעים אותיות, נכנס יין - יצא סוד."]], "id": 4444}, {"k": "u", "a": "דרש מרי בר מר:", "l": [["", "<i class=\"ps\">וַיִּשְׁקֹד ה&#x27; עַל הָרָעָה וַיְבִיאֶהָ עָלֵינוּ כִּי צַדִּיק ה&#x27; אֱלֹהֵינוּ<\/i>, צדקה עשה הקב&#x27;&#x27;ה עם ישראל שהקדים גלות צדקיהו, ועוד גלות יכניה קיימת."], ["", "שכתוב בגלות יכניה <i class=\"ps\">הֶחָרָשׁ וְהַמַּסְגֵּר אֶלֶף,<\/i> <i class=\"ps\">חרש -<\/i> כיון שפותחין הכל נעשו כחרשין, <i class=\"ps\">מסגר -<\/i> כיון שסוגרין בהלכה שוב אין פותחין. וכמה היו - <i class=\"ps\">אלף.<\/i>"]], "id": 4446}, {"k": "u", "a": "ב. עולא ", "l": [["", "שהקדים שתי שנים ל<i class=\"ps\">וְנוֹשַׁנְתּ קֶּשֶׁת <\/i><i class=\"ps\">לְתֻמּוֹ<\/i><i class=\"ps\"> וַיַּכֶּה,<\/i> <i class=\"am\">ר&#x27;&#x27;א:<\/i> לפי תומו, "]], "id": 4644}, {"k": "u", "a": "רבא:", "l": [["", "<i class=\"ps\">לתמם<\/i> <i class=\"hs\">להשלים<\/i> שתי חזיונות, אחת של מיכיהו ואחת של אליהו."]], "id": 4647}, {"k": "nose", "a": "ו&#x27; מימרות בענין עובדיה ", "l": [], "id": 4649}, {"k": "u", "a": "", "l": [["", "<i class=\"ps\">וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ אֲשֶׁר עַל הַבָּיִת וְעֹבַדְיָהוּ הָיָה יָרֵא אֶת ה&#x27; מְאֹד,<\/i> "]], "id": 4650}, {"k": "u", "a": "רי&#x27;&#x27;צ:", "l": [["", "<i class=\"am\">כך א&#x27;&#x27;ל:<\/i> ביעקב <i class=\"am\">כתיב<\/i> <i class=\"ps\">נִחַשְׁתִּי וַיְבָרְכֵנִי ה&#x27; בִּגְלָלֶךָ. <\/i>וביוסף <i class=\"ps\">וַיְבָרֶךְ ה&#x27; אֶת בֵּית הַמִּצְרִי בִּגְלַל יוֹסֵף,<\/i> ביתך לא מתברך שמא אינך ירא אלוקים? <i class=\"am\">יצתה בת קול ואמרה:<\/i> <i class=\"ps\">ועבדיהו היה ירא את ה&#x27; מאד -<\/i> אבל ביתו של אחאב אינו מזומן לברכה."]], "id": 4651}, {"k": "u", "a": "ב. רבי אבא: ", "l": [["", "גדול <i class=\"am\">שנאמר<\/i> בעובדיהו <i class=\"ps\">מאד<\/i>, יותר ממה <i class=\"am\">שנא&#x27;<\/i> באברהם <i class=\"hs\">לא נא&#x27; מאד<\/i>"]], "id": 4653}, {"k": "u", "a": "ג. רבי יצחק:", "l": [["", "מפני מה זכה עובדיהו לנביאות -שהחביא מאה נביאים במערה."]], "id": 4655}, {"k": "u", "a": "ד. ר&#x27;&#x27;א", "l": [["", "<i class=\"ps\">חֲמִשִּׁים אִישׁ<\/i> <i class=\"am\">א.<\/i> מיעקב למד, ד<i class=\"ps\">וְהָיָה הַמַּחֲנֶה הַנִּשְׁאָר לִפְלֵיטָה<\/i>."], ["", "<i class=\"am\">ב.ר&#x27;&#x27;א<\/i> לפי שאין מערה מחזקת יותר מחמשים."]], "id": 4657}, {"k": "u", "a": "ה. רי&#x27;&#x27;צ", "l": [["", "<i class=\"ps\">חזון עבדיהו כה אמר ה&#x27; אלהים לאדום וגו&#x27;<\/i> <i class=\"am\">אמר הקב&quot;ה:<\/i> יבא עובדיהו הדר בין שני רשעים ולא למד ממעשיהם, וינבא על עשו הרשע שדר בין שני צדיקים ולא למד ממעשיהם."]], "id": 4660}, {"k": "u", "a": "ו. מר&#x27;&#x27;מ:", "l": [["", "עובדיה גר אדומי היה, "], ["", "<i class=\"am\">כדאמרי אינשי:<\/i> מגוף היער כורתים את כת הגרזן <i class=\"hs\">שנתנבא על אדום<\/i>."], ["", "<i class=\"ps\">וַיַּךְ אֶת מוֹאָב וַיְמַדְּדֵם בַּחֶבֶל הַשְׁכֵּב אוֹתָם אַרְצָה<\/i> "]], "id": 4662}, {"k": "u", "a": "רשב&#x27;&#x27;י", "l": [["", "מגוף היער כותרים את קת הגרזן, <i class=\"am\">  ר&#x27;&#x27;ד:<\/i> ירך מתוכה מסרחת."], ["", "<i class=\"ps\">וַיִּקַּח אֶת בְּנוֹ הַבְּכוֹר אֲשֶׁר יִמְלֹךְ תַּחְתָּיו וַיַּעֲלֵהוּ עֹלָה עַל הַחֹמָה,<\/i> "]], "id": 4666}, {"k": "u", "a": "רב ושמואל,", "l": [["", "<i class=\"am\">חד אמר <\/i>לשם שמים וזו ד<i class=\"ps\">ויהי קצף גדול על ישראל,<\/i> "], ["", "<i class=\"am\">וחד אמר<\/i> לשם ע&#x27;&#x27;ז <i class=\"ps\">ויהי קצף<\/i>- כריב&#x27;&#x27;ל"]], "id": 4669}, {"k": "u", "a": "דריב&#x27;&#x27;ל:", "l": [["", "<i class=\"ps\">וּכְמִשְׁפְּטֵי הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם לֹא עֲשִׂיתֶם<\/i> כמתוקנין שבהם"], ["", "<i class=\"ps\">וּכְמִשְׁפְּטֵי הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם עֲשִׂיתֶם   -<\/i>כמקולקלין שבהם."], ["", "<i class=\"ps\">וַיִּסְעוּ מֵעָלָיו וַיָּשֻׁבוּ לָאָרֶץ<\/i> "]], "id": 4672}, {"k": "u", "a": "רחב&#x27;&#x27;פ:", "l": [["", "באותה שעה ירדו שונאיהן של ישראל למדריגה התחתונה."]], "id": 4676}, {"k": "u", "a": "רחב&#x27;&#x27;פ:", "l": [["", "<i class=\"ps\">וְהַנַּעֲרָה יָפָה עַד מְאֹד -<\/i> עדיין לא הגיעה לחצי יופי של שרה, ד<i class=\"ps\">עַד מְאֹד -<\/i> ולא מאד בכלל."]], "id": 4678}, {"k": "nose", "a": "הדרן עלך אחד דיני ממונות.", "l": [], "id": 4680}, {"k": "m", "a": "", "l": [["", "היו בודקין אותן "], ["", "בשבע חקירות: באיזו שבוע, באיזו שנה, באיזו חודש, בכמה בחדש, באיזה יום, באיזה שעה, באיזה מקום. "], ["", "רבי יוסי: באיזה יום, באיזה שעה, באיזה מקום."], ["", "מכירין אתם אותו? התרתם בו? העובד ע&#x27;&#x27;ז את מי עבד, ובמה עבד? "], ["", "כל המרבה בבדיקות הר&#x27;&#x27;ז משובח מעשה ובדק בן זכאי בעוקצי תאני"], ["", "מה בין חקירות לבדיקות? חקירות, אחד אומר איני יודע עדותן בטילה."], ["", "בדיקות, אחד אומר איני יודע, ואפילו שנים אומרים אין אנו יודעין - עדותן קיימת."], ["", "אחד חקירות ואחד בדיקות, בזמן שמכחישין זה את זה עדותן בטילה.<i class=\"am\">אחד אומר<\/i> בשנים בחדש <i class=\"am\">ואחד אומר<\/i> בשלשה בחדש עדותן קיימת, "], ["", "שזה יודע בעיבורו של חדש וזה אינו יודע בעיבורו של חדש."], ["", "<i class=\"am\">זה אומר<\/i> בשלשה <i class=\"am\">ואחד אומר<\/i> בחמשה \t\t\t- עדותן בטילה."], ["", "<i class=\"am\">א&#x27; אומר<\/i> בשתי שעות <i class=\"am\">וא&#x27; אומר<\/i> בשלש שעות - עדותן קיימת."], ["", "<i class=\"am\">א&#x27; אומר<\/i> בשלש <i class=\"am\">\t\t\t ואחד אומר<\/i> בחמש - עדותן בטילה. ר&#x27;&#x27;י קיימת"], ["", "<i class=\"am\">א&#x27; אומר<\/i> בחמש \t\t\t<i class=\"am\">ואחד אומר<\/i> בשבע - עדותן בטילה, שבחמש חמה במזרח ובשבע חמה במערב."], ["", "ואח&#x27;&#x27;כ מכניסין את השני ובודקין אותו, אם נמצאו דבריהם מכוונים - פותחין בזכות."], ["", "אמר אחד מן העדים: יש לי ללמד עליו זכות, או אחד מן התלמידים: יש לי ללמד עליו חובה - משתקין אותו, אמר אחד מן התלמידים: יש לי ללמד עליו זכות - מעלין אותו, ומושיבין אותו ביניהם, ולא היה יורד משם כל היום כולו. אם יש ממש בדבריו - שומעין לו. \t\tואפילו הוא אומר יש לי ללמד על עצמי זכות - שומעין לו, ובלבד שיש ממש בדבריו."], ["", "ואם מצאו לו זכות - פטרוהו, ואם לאו - מעבירין אותו למחר."], ["", "ומזדווגין זוגות זוגות. וממעטין ממאכל, ולא היו שותין יין כל היום, ונושאין ונותנין כל הלילה, ולמחרת משכימין ובאין לבית דין. המזכה אומר: אני מזכה, ומזכה אני במקומי. והמחייב אומר: אני מחייב, ומחייב אני במקומי, המלמד חובה מלמד זכות, אבל המלמד זכות - אינו יכול לחזור וללמד חובה."], ["", "טעו בדבר - שני סופרי הדיינין מזכירין אותו. "], ["", "אם מצאו לו זכות - פטרוהו. ואם לאו - עומדים למנין. "], ["", "שנים עשר מזכין ואחד עשר מחייבין - זכאי."], ["", "י&#x27;&#x27;ב מחייבין וי&#x27;&#x27;א מזכין, ואף י&#x27;&#x27;א מזכין וי&#x27;&#x27;א מחייבין וא&#x27; אומר איני יודע"], ["", "ואפילו כ&#x27;&#x27;ב מזכין או מחייבין וא&#x27; אומר איני יודע - יוסיפו הדיינין."], ["", "מוסיפין - שנים שנים, עד שבעים ואחד."], ["", "ל&#x27;&#x27;ו מזכין ול&#x27;&#x27;ה מחייבין - זכאי. ל&#x27;&#x27;ו מחייבין ול&#x27;&#x27;ה מזכין - דנין אלו כנגד אלו, עד שיראה אחד מן המחייבין דברי המזכין."]], "id": 4681}, {"k": "dh", "a": "שבע חקירות ", "l": [], "id": 4705}]}, {"daf": "מ:", "perek": "פרק רביעי", "perekName": "אחד דיני ממונות", "units": [{"k": "u", "a": "ר&#x27;&#x27;י:", "l": [["", "<i class=\"ps\">ודרשת וחקרת ושאלת היטב<\/i> <i class=\"am\">ואומר <\/i><i class=\"ps\">והוגד לך ושמעת ודרשת היטב<\/i> "], ["", "<i class=\"am\">ואומר<\/i> <i class=\"ps\">ודרשו השופטים היטב<\/i> <i class=\"hs\">ולא אחד אחד דא&#x27;&#x27;כ ליכתבינהו בחדא.<\/i>"], ["", "כיון שכתובים יחדי נלמדים א&#x27; מהשנים וכמי שכתובים יחד "]], "id": 4707}, {"k": "u", "a": "קשה ", "l": [["", "הא לא דומה עיר הנדחת לאחרים- שממונן פלט."], ["", "וע&#x27;&#x27;ז לאחרים- שכן בסייף. ועדים זוממין לאחרים- שצריכים התראה."]], "id": 4711}, {"k": "u", "a": "אלא", "l": [["", "<i class=\"ps\">בהיטב היטב<\/i> ילפינן מהדדי, וגז&#x27;&#x27;ז מופנה מב צדדים. [<i class=\"ps\">היטב<\/i>] "], ["", "ונחנקין בק&#x27;&#x27;ו מנסקלין ומנהרגין, ונשרפין בק&#x27;ו מנסקלין."]], "id": 4714}, {"k": "u", "a": "ואף לר&#x27;&#x27;ש ", "l": [["", "דשריפה חמורה. "]], "id": 4717}, {"k": "u", "a": "-א. כר&#x27;&#x27;י", "l": [["", "<i class=\"ps\">והנה אמת נכון<\/i> – י&#x27;&#x27;א, ז&#x27;- לחקירות, ג&#x27; לגז&#x27;&#x27;ש, וחד לר&#x27;&#x27;ש"], ["", "<i class=\"am\">לרבנן<\/i> דבר הנלמד בק&#x27;&#x27;ו טרח וכתב קרא "]], "id": 4719}, {"k": "u", "a": "מגדף בה רבי אבהו:", "l": [["", "אימא לאתויי שמנה חקירות!"]], "id": 4722}, {"k": "u", "a": "לאביי בר&#x27;&#x27;מ ", "l": [["", "שאין אדם טועה כלום<i class=\"hs\"> אף משהו<\/i> – בכמה בשעה. "]], "id": 4724}, {"k": "u", "a": "לאביי דר&#x27;&#x27;י ", "l": [["", "שאדם טועה בחצי שעה - באיזה יובל."], ["", "<i class=\"hs\"> כיון דאמר באיזה שבוע - לא בעי באיזה יובל.<\/i>"]], "id": 4726}, {"k": "dh", "a": "רבי יוסי אומר.", "l": [], "id": 4729}, {"k": "u", "a": "רבי יוסי לחכמים:", "l": [["", "<i class=\"am\">לדבריכם,<\/i> מי שבא ואמר אמש הרגו אומר לו: באיזו שבוע, באיזו שנה, באיזו חדש, בכמה בחדש? "]], "id": 4730}, {"k": "u", "a": "אמרו לו:", "l": [["", "לדבריך, מי שבא ואמר עכשו ה ל מי ", "l": [], "id": 4938}, {"k": "u", "a": "", "l": [["", "<i class=\"hs\">כיון שזו הצלתו מכספו, או שבי&#x27;&#x27;ד מחוייבים להצילו מכספם<\/i>"]], "id": 4939}, {"k": "u", "a": "ותו מר&#x27;&#x27;ח: ", "l": [["", "היוצא ליהרג משקין אותו קורט של לבונה בכוס של יין כדי שתטרף דעתו, <i class=\"ps\">תְּנוּ שֵׁכָר לְאוֹבֵד וְיַיִן לְמָרֵי נָפֶשׁ<\/i>."]], "id": 4940}, {"k": "u", "a": "ותניא:", "l": [["", "נשים יקרות שבירושלים היו מתנדבות ומביאות אותן. ואם לא התנדבו משל ציבור."]], "id": 4942}, {"k": "u", "a": "בעא ראבר&#x27;&#x27;&#x27;ה מר&#x27;&#x27;ש:", "l": [], "id": 4944}, {"k": "nose", "a": "אמר א&#x27; מהתלמידים יש לי ללמד עליו זכות ונשתתק, מהו? ", "l": [], "id": 4945}, {"k": "u", "a": "ר&#x27;&#x27;ש", "l": [["", "מנפח בידו: נשתתק? אפילו אחד בסוף העולם נמי!"]], "id": 4946}, {"k": "u", "a": "-", "l": [["", "התם לא קאמר, הכא קאמר."]], "id": 4948}, {"k": "u", "a": "אין להוכיח מריב&#x27;&#x27;ח", "l": [["", "א&#x27; מהתלמידים שזיכה ומת רואין אותו כאילו חי ועומד במקומו."], ["", "משמע רק אם זיכה בפועל דאכתי תיבעי לך. "]], "id": 4950}, {"k": "dh", "a": "אפילו הוא כו&#x27;.", "l": [], "id": 4953}, {"k": "u", "a": "אבל ", "l": [["", "פעם ראשונה ושניה? בין שיש בין שאין ממש בדבריו מחזירין אותו."], ["", "מכאן ואילך, אם יש ממש בדבריו - מחזירין אותו, אין ממש בדבריו - אין מחזירין אותו!"]], "id": 4954}, {"k": "u", "a": "אביי:", "l": [["", "מוסרים לו זוג ת&#x27;&#x27;ח, אי יש ממש דבריו כן ואי לא לא "], ["", "ולא מוסרים לו מתחילה -אגב דבעית לא יכול לומר כל שיש לו "]], "id": 4957}, {"k": "hatz", "a": "***", "l": [], "id": 4960}, {"k": "u", "a": "", "l": [["", "משנה."]], "id": 4961}, {"k": "m", "a": "", "l": [["", "מצאו לו זכות - פטרוהו, ואם לאו - יצא ליסקל, וכרוז יוצא לפניו: איש פלוני בן פלוני יוצא ליסקל על שעבר עבירה פלונית, ופלוני ופלוני עדיו, כל מי שיודע לו זכות - יבא וילמד עליו."]], "id": 4962}, {"k": "u", "a": "אמר אביי:", "l": [["", "וצ&#x27;&#x27;ל ביום פלוני, בשעה פלונית, מקום פלוני, שמא יש שדעו ויזימום."]], "id": 4963}, {"k": "dh", "a": "וכרוז יוצא לפניו לפניו", "l": [], "id": 4965}, {"k": "u", "a": "", "l": [["", "אבל לא מלכתחילה"]], "id": 4966}, {"k": "u", "a": "והתניא:", "l": [["", "בערב הפסח תלאוהו לישו הנוצרי, והכרוז יוצא לפניו ארבעים יום: ישו הנוצרי יוצא ליסקל על שכישף והסית והדיח את ישראל, כל מי שיודע לו זכות יבוא וילמד עליו. ולא מצאו לו זכות ותלאוהו בערב הפסח."]], "id": 4967}, {"k": "u", "a": "עולא:", "l": [["", "ותסברא, ישו הנוצרי מסית הוא, <i class=\"ps\">וְלֹא תַחְמֹל וְלֹא תְכַסֶּה עָלָיו<\/i>!"]], "id": 4969}, {"k": "u", "a": "אלא ", "l": [["", "שאני ישו דקרוב למלכות היה."]], "id": 4971}, {"k": "u", "a": "תנו רבנן:", "l": [["", "חמשה תלמידים היו לישו הנוצרי, מתאי, נקאי נצר ובוני ותודה."]], "id": 4973}, {"k": "u", "a": "אתיוה ", "l": [["", "למתי <i class=\"am\">א&#x27;&#x27;ל:<\/i> מתי יהרג? הכתיב <i class=\"ps\">מתי אבוא ואראה פני אלהים<\/i>!"]], "id": 4975}, {"k": "u", "a": "- אמרו לו:", "l": [["", "הן , מתי יהרג <i class=\"am\">דכתיב<\/i> <i class=\"ps\">מָתַי יָמוּת וְאָבַד שְׁמוֹ.<\/i>"]], "id": 4977}, {"k": "u", "a": "אתיוה ", "l": [["", "לנקאי, <i class=\"am\">אמר להו:<\/i> נקאי יהרג? <i class=\"am\">הכתיב<\/i> <i class=\"ps\">וְנָקִי וְצַדִּיק אַל תַּהֲרֹג<\/i>!"]], "id": 4979}, {"k": "u", "a": "- אמרו לו:", "l": [["", "הן, נקאי יהרג, <i class=\"am\">דכתיב<\/i> <i class=\"ps\">בַּמִּסְתָּרִים יַהֲרֹג נָקִי<\/i>."]], "id": 4981}, {"k": "u", "a": "אתיוה ", "l": [["", "לנצר, <i class=\"am\">אמר:<\/i> נצר יהרג? <i class=\"am\">הכתיב<\/i> וְנֵצֶר מִשָּׁרָשָׁיו יִפְרֶה!"]], "id": 4983}, {"k": "u", "a": "- אמרו לו:", "l": [["", "הן, נצר יהרג, <i class=\"am\">דכתיב<\/i> <i class=\"ps\">וְאַתָּה הָשְׁלַכְתָּ מִקִּבְרְךָ כְּנֵצֶר נִתְעָב<\/i>."]], "id": 4985}, {"k": "u", "a": "אתיוה ", "l": [["", "לבוני, <i class=\"am\">אמר:<\/i> בוני יהרג? <i class=\"am\">הכתיב<\/i> <i class=\"ps\">בְּנִי בְכֹרִי יִשְׂרָאֵל<\/i>!"]], "id": 4987}, {"k": "u", "a": "- אמרו לו:", "l": [["", "הן, בוני יהרג, <i class=\"am\">דכתיב<\/i> <i class=\"ps\">הִנֵּה אָנֹכִי הֹרֵג אֶת בִּנְךָ בְּכֹרֶךָ.<\/i>"]], "id": 4989}, {"k": "u", "a": "אתיוה ", "l": [["", "לתודה, <i class=\"am\">אמר:<\/i> תודה יהרג? <i class=\"am\">הכתיב<\/i> <i class=\"ps\">מזמור לתודה!<\/i>"]], "id": 4991}, {"k": "u", "a": "- אמרו לו:", "l": [["", "הן, תודה יהרג, <i class=\"am\">דכתיב<\/i> <i class=\"ps\">זֹבֵחַ תּוֹדָה יְכַבְּדָנְנִי<\/i>. "]], "id": 4993}]}, {"daf": "מג:", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "רבי יהושע בן לוי:", "l": [["", "כל הזובח את יצרו ומתודה עליו, <i class=\"am\">מעלה עליו הכתוב<\/i> כאילו כיבדו להקב&quot;ה בשני עולמים, עוה&#x27;&#x27;ז ועוה&#x27;&#x27;ב, ד<i class=\"ps\">זֹבֵחַ תּוֹדָה יְכַבְּדָנְנִי<\/i>."]], "id": 4996}, {"k": "u", "a": "רבי יהושע בן לוי: ", "l": [["", "בזמן שבית המקדש קיים, אדם מקריב עולה - שכר עולה בידו, מנחה - שכר מנחה בידו."], ["", "אבל מי שדעתו שפלה <i class=\"am\">מעלה עליו הכתוב<\/i> כאילו הקריב כל הקרבנות כולן, שנאמר <i class=\"ps\">זִבְחֵי אֱלֹהִים רוּחַ נִשְׁבָּרָה,<\/i> ולא עוד אלא שאין תפלתו נמאסת, <i class=\"am\">שנאמר<\/i> <i class=\"ps\">לֵב נִשְׁבָּר וְנִדְכֶּה אֱלֹהִים לֹא תִבְזֶה<\/i>."], ["", "***"], ["", "משנה."]], "id": 4998}, {"k": "m", "a": "", "l": [["", "היה רחוק מבית הסקילה כעשר אמות, <i class=\"am\">אומרים לו:<\/i> התודה, שכן דרך כל המומתין מתודין, שכל המתודה יש לו חלק לעולם הבא."], ["", "שכן מצינו בעכן, <i class=\"am\">שאמר לו יהושע<\/i> בני שִׂים נָא כָבוֹד לַה&#x27; אֱלֹהֵי יִשְׂרָאֵל וְתֶן לוֹ תוֹדָה, וַיַּעַן עָכָן אֶת יְהוֹשֻׁעַ וַיֹּאמַר אָמְנָה אָנֹכִי חָטָאתִי לַיהֹוָה אֱלֹהֵי יִשְׂרָאֵל וְכָזֹאת וְכָזֹאת עָשִׂיתִי"], ["", "ומנין שכיפר לו וידויו - <i class=\"am\">שנאמר<\/i> <i class=\"ps\">וַיֹּאמֶר יְהוֹשֻׁעַ מֶה עֲכַרְתָּנוּ יַעְכָּרְךָ ה&#x27; בַּיּוֹם הַזֶּה<\/i>, ביום הזה אתה עכור, ואי אתה עכור לעולם הבא."], ["", "ואם אינו יודע להתודות <i class=\"am\">אומרים לו:<\/i> אמור תהא מיתתי כפרה על כל עונותי."], ["", "<i class=\"am\">ר&#x27;&#x27;י:<\/i> אם היה יודע שהוא מזומם אומר: תהא מיתתי כפרה על כל עונותי חוץ מעון זה."], ["", "אמרו לו: אם כן יהו כל אדם אומר כן, כדי לנקות עצמו."]], "id": 5003}, {"k": "u", "a": "תנו רבנן:", "l": [["", "<i class=\"ps\">נא<\/i> לשון בקשה, בשעה שאמר הקב&quot;ה ליהושע חטא ישראל, <i class=\"am\">אמר לפניו:<\/i> רבש&quot;ע, מי חטא? <i class=\"am\">א&#x27;&#x27;ל:<\/i> וכי דילטור אני? לך הפל גורלות."], ["", "הלך והפיל גורלות, ונפל הגורל על עכן, <i class=\"am\">א&#x27;&#x27;ל:<\/i> יהושע, בגורל אתה בא עלי? אתה ואלעזר הכהן שני גדולי הדור אתם, אם אני מפיל עליכם גורל - על אחד מכם הוא נופל."]], "id": 5009}, {"k": "u", "a": "אמר לו:", "l": [["", "בבקשה ממך, אל תוציא לעז על הגורלות, שעתידה ארץ ישראל שתתחלק בגורל <i class=\"am\">שנאמר<\/i> <i class=\"ps\">אַךְ בְּגוֹרָל יֵחָלֵק אֶת הָאָרֶץ<\/i>."]], "id": 5012}, {"k": "dh", "a": "תן תודה.", "l": [], "id": 5014}, {"k": "u", "a": "אמר רבינא:", "l": [["", "שחדו בדברים: שביקש ממנו רק הודאה? תן לו תודה והיפטר."]], "id": 5015}, {"k": "u", "a": "מיד:", "l": [["", "<i class=\"ps\">וַיַּעַן עָכָן אֶת יְהוֹשֻׁעַ וַיֹּאמַר אָמְנָה אָנֹכִי חָטָאתִי לַה&#x27; אֱלֹהֵי יִשְׂרָאֵל וְכָזֹאת וְכָזֹאת עָשִׂיתִי<\/i>."]], "id": 5017}, {"k": "u", "a": "ר&#x27;&#x27;א מר&#x27;&#x27;ח:", "l": [["", "מלמד שמעל עכן בשלשה חרמים: ב&#x27; בימי משה וא&#x27; בימי יהושע, "], ["", "<i class=\"am\">שנאמר<\/i> <i class=\"ps\">כָזֹאת וְכָזֹאת עָשִׂיתִי<\/i>."]], "id": 5019}, {"k": "u", "a": "רי&#x27;&#x27;ו מראבר&#x27;&#x27;ש:", "l": [["", "חמשה, ד&#x27; <i class=\"am\">בימי משה<\/i> וא&#x27; <i class=\"am\">בימי יהושע,<\/i> ד<i class=\"ps\">אנכי חטאתי וכזאת וכזאת עשיתי<\/i>"], ["", "ועד עכשיו לא נענש לפי שלא ענש על הנסתרות עד שעברו ישראל את הירדן."]], "id": 5022}, {"k": "u", "a": "כתנאי:", "l": [["", "<i class=\"ps\">הַנִּסְתָּרֹת לַה&#x27; אֱלֹהֵינוּ וְהַנִּגְלֹת לָנוּ וּלְבָנֵינוּ עַד עוֹלָם<\/i> "], ["", "נקוד על <i class=\"ps\">לנו ולבנינו<\/i> ועל עי&quot;ן שבעד? "]], "id": 5025}, {"k": "u", "a": "ר&#x27;&#x27;י", "l": [["", "מלמד שלא ענש על הנסתרות עד שעברו ישראל את הירדן, "]], "id": 5028}, {"k": "u", "a": "רבי נחמיה:", "l": [["", "אלא כשם שלא ענש על הנסתרות <i class=\"ps\">עַד עוֹלָם<\/i> "], ["", "כך לא ענש על עונשין שבגלוי עד שעברו ישראל את הירדן."], ["", "ועכן נענש- משום שידעו בו אשתו ובניו."]], "id": 5030}]}, {"daf": "מד.", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "dh", "a": "חטא ישראל.", "l": [], "id": 5035}, {"k": "u", "a": "ראב&#x27;&#x27;ז:", "l": [["", "אע&#x27;&#x27;פ שחטא - ישראל הוא. [שם קדושותו עליהם]"]], "id": 5036}, {"k": "u", "a": "רבי אבא:", "l": [["", "<i class=\"am\">היינו דאמרי אינשי<\/i> הדס הצומח ביני חילפי עדיין שמו הדס "]], "id": 5038}, {"k": "u", "a": "א. מר&#x27;&#x27;י ב&#x27;&#x27;מ:", "l": [["", "מלמד שעבר עכן על חמשה חומשי תורה, <i class=\"am\">שנאמר<\/i> חמשה <i class=\"ps\">גם<\/i>."]], "id": 5040}, {"k": "u", "a": "ב. מר&#x27;&#x27;י ב&#x27;&#x27;מ:", "l": [["", "עכן מושך בערלתו היה, <i class=\"am\">הכא<\/i> <i class=\"ps\">וְגַם עָבְרוּ אֶת בְּרִיתִי<\/i> <i class=\"am\">והתם<\/i> <i class=\"ps\">אֶת בְּרִיתִי הֵפַר<\/i>. <i class=\"am\">קמ&#x27;&#x27;ל<\/i> דבמצוה גופיה פקר, "]], "id": 5042}, {"k": "u", "a": "ג. ראב&#x27;&#x27;ז:", "l": [["", "<i class=\"ps\">וְכִי עָשָׂה נְבָלָה בְּיִשְׂרָאֵל<\/i> שבעל עכן נערה המאורסה, <i class=\"am\">דהתם כתיב<\/i> <i class=\"ps\">כִּי עָשְׂתָה נְבָלָה בְּיִשְׂרָאֵל<\/i>. <i class=\"am\">קמ&#x27;&#x27;ל<\/i> כ&#x27;כ פקר נפשיה"]], "id": 5044}, {"k": "u", "a": "רבינא חלק: ", "l": [["", "<i class=\"am\">שרק בא לומר<\/i> דינו כנערה המאורסה, דבסקילה."]], "id": 5046}, {"k": "u", "a": "ריש גלותא לר&#x27;&#x27;ה:", "l": [["", "<i class=\"ps\">וַיִּקַּח יְהוֹשֻׁעַ אֶת עָכָן בֶּן זֶרַח וְאֶת הַכֶּסֶף וגו&#x27; וְאֶת כָּל אֲשֶׁר לוֹ<\/i> אם הוא חטא - בניו ובנותיו מה חטאו? <i class=\"am\">א&#x27;&#x27;ל:<\/i> וליטעמיך, אם הוא חטא - כל ישראל מה חטאו? ד<i class=\"ps\">וכל ישראל עמו<\/i>! אלא - לרדותן, "]], "id": 5048}, {"k": "u", "a": "רבינא", "l": [["", "<i class=\"ps\">וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים -<\/i> בתרתי? – "], ["", "הראוי לשריפה - לשריפה, הראוי לסקילה - לסקילה."], ["", "<i class=\"ps\">אַדֶּרֶת שִׁנְעָר <\/i><i class=\"am\">רב<\/i> איצטלא מצמר נקי, <i class=\"am\">שמואל:<\/i> בגד בצבע יקר "]], "id": 5050}, {"k": "u", "a": "רב נחמן:", "l": [["", "בא וחבטם לפני המקום, <i class=\"am\">אמר לפניו:<\/i> רבש&quot;ע, על אלו תיהרג רובה של סנהדרין? - ד<i class=\"ps\">וַיַּכּוּ מֵהֶם אַנְשֵׁי הָעַי כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ<\/i> "]], "id": 5054}, {"k": "u", "a": "ותניא ", "l": [["", "<i class=\"am\">ר&#x27;&#x27;י:<\/i> שלשים וששה ממש <i class=\"am\">א&#x27;&#x27;ל ר&#x27;&#x27;:נ<\/i> והלא נאמר <i class=\"b\">כ<\/i>שלשים וששה איש, <i class=\"am\">אלא:<\/i> זה יאיר בן מנשה ששקול כנגד רובה של סנהדרין."]], "id": 5056}, {"k": "u", "a": "ר&#x27;&#x27;נ מרב:", "l": [["", "<i class=\"ps\">תַּחֲנוּנִים יְדַבֶּר רָשׁ<\/i> - זה משה, <i class=\"ps\">וְעָשִׁיר יַעֲנֶה עַזּוֹת<\/i> - זה יהושע."]], "id": 5058}, {"k": "u", "a": "לאו ", "l": [["", "ד<i class=\"ps\">וַיַּצִּקֻם לִפְנֵי ה&#x27;<\/i> <i class=\"am\">ר&#x27;&#x27;נ : <\/i>בא וחבטן לפני המקום, -דהא פנחס גם עשה כן ד<i class=\"ps\">וַיַּעֲמֹד פִּינְחָס <\/i><i class=\"ps\">וַיְפַלֵּל<\/i><i class=\"ps\"> וַתֵּעָצַר הַמַּגֵּפָה<\/i>, שעשה פלילות עם קונו; וחבטן לפני המקום, <i class=\"am\">אמר לפניו:<\/i> רבש&quot;ע, על אלו יפלו כ&#x27;&#x27;ד אלף מישראל? ד<i class=\"ps\">וַיִּהְיוּ הַמֵּתִים בַּמַּגֵּפָה אַרְבָּעָה וְעֶשְׂרִים אָלֶף<\/i>."]], "id": 5060}, {"k": "u", "a": "ולאו ", "l": [["", "מ<i class=\"ps\">לָמָה הֵעֲבַרְתָּ הַעֲבִיר אֶת הָעָם הַזֶּה אֶת הַיַּרְדֵּן <\/i>"]], "id": 5062}, {"k": "u", "a": "-", "l": [["", "דמשה גם אמר: <i class=\"ps\">לָמָה הֲרֵעֹתָה לָעָם הַזֶּה<\/i>. "]], "id": 5064}, {"k": "u", "a": "אלא", "l": [["", "<i class=\"am\">מ<\/i><i class=\"ps\">וְלוּ הוֹאַלְנוּ וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן<\/i>. "]], "id": 5066}, {"k": "u", "a": "דריש רבי שילא:", "l": [["", "<i class=\"ps\">וַיֹּאמֶר ה&#x27; אֶל יְהוֹשֻׁעַ קֻם לָךְ.<\/i> <i class=\"am\">א&#x27;&#x27;ל הקב&quot;ה<\/i>: שלך קשה משלהם, <i class=\"am\">אני אמרתי<\/i> <i class=\"ps\">וְהָיָה בְּעָבְרְכֶם אֶת הַיַּרְדֵּן תָּקִימוּ<\/i>, ואתם ריחקתם ששים מיל."]], "id": 5068}, {"k": "u", "a": "אחר שיצא:", "l": [["", "העמיד רב מתורגמן <i class=\"am\">ודרש:<\/i> <i class=\"ps\">כַּאֲשֶׁר צִוָּה ה&#x27; אֶת מֹשֶׁה עַבְדּוֹ כֵּן צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ וְכֵן עָשָׂה יְהוֹשֻׁעַ לֹא הֵסִיר דָּבָר מִכֹּל אֲשֶׁר צִוָּה ה&#x27; אֶת מֹשֶׁה.<\/i> <i class=\"am\">א&#x27;&#x27;כ מה ת&#x27;&#x27;ל<\/i> <i class=\"ps\">קום לך<\/i>: <i class=\"am\">א&#x27;&#x27;ל<\/i> אתה גרמת להם."]], "id": 5070}, {"k": "u", "a": "והיינו דא&#x27;&#x27;ל", "l": [["", "בעי: <i class=\"ps\">ועשית לעי ולמלכה כאשר עשית ליריחו ולמלכה וגו&#x27;<\/i>."]], "id": 5072}, {"k": "u", "a": "כתוב-", "l": [["", "<i class=\"ps\"> ויהי בהיות יהושע ביריחו וישא עיניו וירא וגו&#x27; ויאמר לא כי אני שר צבא ה&#x27; עתה באתי<\/i> [ויפל יהושע אל פניו ארצה וישתחו]."], ["", "ואיך עשה כן? <i class=\"am\">הא ארי&#x27;&#x27;ו:<\/i> אסור לאדם שיתן שלום לחבירו בלילה, חיישינן שמא שד הוא!"]], "id": 5074}, {"k": "u", "a": "- שאני התם", "l": [["", "<i class=\"am\">שא&#x27;&#x27;ל<\/i> <i class=\"ps\">אֲנִי שַׂר צְבָא ה&#x27; עַתָּה בָאתִי וגו&#x27;<\/i>. <i class=\"am\">וגמירי<\/i> שאינם מוציאים ש&#x27;&#x27;ש לבטלה "]], "id": 5077}]}, {"daf": "מד:", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "א&#x27;&#x27;ל:", "l": [["", "אמש ביטלתם תמיד של בין הערביים, ועכשיו ביטלתם תלמוד תורה."]], "id": 5080}, {"k": "u", "a": "- ", "l": [["", "על איזה מהן באת? <i class=\"am\">א&#x27;&#x27;ל:<\/i> <i class=\"ps\">עַתָּה בָאתִי<\/i>. <i class=\"am\">- מיד<\/i> <i class=\"ps\">וַיָּלֶן יְהוֹשֻׁעַ בַּלַּיְלָה הַהוּא  בְּתוֹךְ הָעֵמֶק<\/i>. <i class=\"am\">וארי&#x27;&#x27;ו<\/i>: מלמד שלן בעומקה של הלכה."]], "id": 5082}, {"k": "u", "a": "מדרב:", "l": [["", "גדול תלמוד תורה יותר מהקרבת תמידין, <i class=\"am\">שנאמר<\/i> <i class=\"ps\">עתה באתי<\/i>."]], "id": 5084}, {"k": "u", "a": "אביי לרב דימי:", "l": [["", "<i class=\"ps\">אַל תֵּצֵא לָרִב מַהֵר פֶּן מַה תַּעֲשֶׂה בְּאַחֲרִיתָהּ בְּהַכְלִים אֹתְךָ רֵעֶךָ רִיבְךָ רִיב אֶת רֵעֶךָ וְסוֹד אַחֵר אַל תְּגָל<\/i>? איך מפרשים בא&#x27;&#x27;י "]], "id": 5086}, {"k": "u", "a": "-א&#x27;&#x27;ל", "l": [["", "<i class=\"am\">בשעה שאמר הקב&quot;ה ליחזקאל:<\/i> לך אמור להם לישראל <i class=\"ps\">אָבִיךְ הָאֱמֹרִי וְאִמֵּךְ חִתִּית<\/i>, <i class=\"am\">אמרה רוח פסקונית לפני הקב&quot;ה: רבש&quot;ע<\/i>, אם יבואו אברהם ושרה ויעמדו לפניך אתה אומר להם ומכלים אותם? <i class=\"ps\">ריבך ריב את רעך וסוד אחר אל תגל.<\/i>"]], "id": 5088}, {"k": "u", "a": "וקשה", "l": [["", "וכי יש לו רשות כ&#x27;&#x27;כ? <i class=\"am\">ותירץ<\/i> <i class=\"am\">דאריב&#x27;&#x27;ח:<\/i> שלש שמות יש לו: "], ["", "<i class=\"b\">פיסקון<\/i> - שפוסק דברים כלפי מעלה, <i class=\"b\">איטמון<\/i> - שאוטם עונותיהן של ישראל, <i class=\"b\">סיגרון -<\/i> כיון שסוגר שוב אינו פותח."]], "id": 5090}, {"k": "u", "a": "ר&#x27;&#x27;א", "l": [["", "<i class=\"ps\">הֲיַעֲרֹךְ שׁוּעֲךָ לֹא בְצָר<\/i> <i class=\"b\">לעולם יקדים אדם תפלה לצרה<\/i>, שאילמלא הקדים אברהם תפלה לצרה בין בית אל ובין העי לא נשתייר משונאיהן של ישראל שריד ופליט."]], "id": 5093}, {"k": "u", "a": "ר&#x27;&#x27;ל ", "l": [["", "<i class=\"b\">כל המאמץ עצמו בתפלה מלמטה<\/i> אין לו צרים מלמעלה."]], "id": 5095}, {"k": "u", "a": "רי&#x27;&#x27;ו", "l": [["", "<i class=\"b\">לעולם יבקש אדם רחמים שיהו הכל מאמצין את כחו<\/i>, ואל יהו לו צרים מלמעלה."]], "id": 5097}, {"k": "dh", "a": "מנין שכיפר לו וידויו וכו&#x27;.", "l": [], "id": 5099}, {"k": "u", "a": "ת&#x27;&#x27;ר", "l": [["", "מנין שכיפר לו וידויו - ד<i class=\"ps\">ויאמר יהושע מֶה עֲכַרְתָּנוּ יַעְכָּרְךָ ה&#x27; בַּיּוֹם הַזֶּה,<\/i> ואי אתה עכור לעולם הבא."]], "id": 5100}, {"k": "u", "a": "וכתיב", "l": [["", "<i class=\"ps\">וּבְנֵי זֶרַח זִמְרִי וְאֵיתָן וְהֵימָן וְכַלְכֹּל וָדָרַע <\/i><i class=\"ps\">כֻּלָּם חֲמִשָּׁה <\/i>לעוה&#x27;&#x27;ב, "]], "id": 5102}, {"k": "u", "a": "רב ושמואל,", "l": [["", "עכן שמו, ונקרא שמו זמרי - שעשה מעשה זמרי."], ["", "זמרי שמו, ונקרא שמו עכן - שעיכן עונותיהן של ישראל."]], "id": 5104}, {"k": "dh", "a": "אם אינו יודע להתוודות כו&#x27; רבי יהודה אומר כו&#x27; לנקות עצמן.", "l": [], "id": 5107}, {"k": "u", "a": "-ולא", "l": [["", "כדי וינקו עצמן! שלא להוציא לעז על בתי דינין ועל העדים."]], "id": 5108}, {"k": "u", "a": "ת&#x27;&#x27;ר:", "l": [["", "מעשה באחד <i class=\"hs\">בן שב&#x27;&#x27;ש<\/i> שיצא ליהרג, <i class=\"am\">אמר:<\/i> אם יש בי עון זה - לא תהא מיתתי כפרה לכל עונותי, ואם אין בי עון זה - תהא מיתתי כפרה לכל עונותי, ובית דין וכל ישראל מנוקין, והעדים לא תהא להם מחילה לעולם."], ["", "וכששמעו חכמים בדבר, <i class=\"am\">אמרו:<\/i> להחזירו א&#x27;&#x27;א, שכבר נגזרה גזירה."]], "id": 5110}, {"k": "u", "a": "אלא:", "l": [["", "יהרג, ויהא קולר תלוי בצואר עדים."], ["", "ומיירי שחזרו בהם העדים -כיון שהגיד שוב אינו חוזר ומגיד!"], ["", "אפי&#x27; במקום שנותנים טעם לדבריהם <i class=\"hs\">כאותו מעשה דבעיא מיכסא).<\/i>"]], "id": 5113}, {"k": "m", "a": "", "l": [["", "משנה."], ["", "היה רחוק מבית הסקילה ארבע אמות - מפשיטין אותו את בגדיו."], ["", "לר&#x27;&#x27;י האיש מכסין אותו מלפניו, והאשה מלפניה ומאחריה, "], ["", "וחכ&#x27;&#x27;א האיש נסקל ערום, ואין האשה נסקלת ערומה."]], "id": 5117}, {"k": "u", "a": "", "l": [["", "[דף מה.] גמרא."], ["", "תנו רבנן: האיש מכסין אותו פרק אחד מלפניו, ואשה שני פרקים, בין מלפניה בין מלאחריה, מפני שכולה ערוה, דברי רבי יהודה."], ["", "וחכמים אומרים: האיש נסקל ערום, ואין האשה נסקלת ערומה."], ["", "מאי טעמייהו דרבנן - אמר קרא ורגמו אתו."], ["", "מאי אותו? אילימא אותו ולא אותה - והכתיב והוצאת את האיש ההוא או את האשה ההיא."], ["", "אלא מאי אותו - אותו בלא כסותו, הא אותה - בכסותה."], ["", "רבי יהודה אומר: אתו בלא כסותו, לא שנא איש ולא שנא אשה."], ["", "למימרא דרבנן חיישי להרהורא, ורבי יהודה לא חייש להרהורא? והא איפכא שמענא להו, דתנן: הכהן אוחז בבגדיה, אם נקרעו - נקרעו, ואם נפרמו - נפרמו, עד שמגלה את לבה וסותר את שערה."], ["", "רבי יהודה אומר: אם היה לבה נאה - לא היה מגלהו, ואם היה שערה נאה - לא היה סותרו!"], ["", "- אמר רבה: התם היינו טעמא שמא תצא מבית דין זכאה, ויתגרו בה פירחי כהונה."], ["", "הכא - הא מקטלא."], ["", "וכי תימא אתי לאיתגרויי באחרנייתא - אמר רבה: גמירי, אין יצר הרע שולט אלא במי שעיניו רואות."], ["", "אמר רבא: דרבי יהודה אדרבי יהודה קשיא, דרבנן אדרבנן לא קשיא? - אלא אמר רבא: דרבי יהודה אדרבי יהודה לא קשיא - כדשנין."], ["", "דרבנן אדרבנן נמי לא קשיא - אמר קרא ונוסרו כל הנשים ולא תעשינה כזמתכנה, הכא - אין לך ייסור גדול מזה."], ["", "וכי תימא ליעביד בה תרתי - אמר רב נחמן אמר רבה בר אבוה: אמר קרא ואהבת לרעך כמוך - ברור לו מיתה יפה."], ["", "- לימא דרב נחמן תנאי היא? - לא, דכולי עלמא אית להו דרב נחמן."], ["", "והכא בהא קמיפלגי: מר סבר בזיוני דאיניש עדיפא ליה טפי מניחא דגופיה, ומר סבר: ניחא דגופיה עדיף מבזיוני."], ["", "משנה."], ["", "בית הסקילה היה גבוה שתי קומות."], ["", "אחד מן העדים דוחפו על מתניו, נהפך על לבו - הופכו על מתניו, ואם מת בה - יצא."], ["", "ואם לאו - השני נוטל את האבן ונותנו על לבו."], ["", "אם מת בה - יצא, ואם לאו - רגימתו בכל ישראל."], ["", "שנאמר יד העדים תהיה בו בראשונה להמיתו ויד כל העם באחרונה."], ["", "גמרא."], ["", "תנא: וקומה שלו - הרי כאן שלש."], ["", "- ומי בעינן כולי האי? ורמינהו: מה בור שהוא כדי להמית - עשרה טפחים, אף כל כדי להמית - עשרה טפחים!"], ["", "- אמר רב נחמן אמר רבה בר אבוה: אמר קרא ואהבת לרעך כמוך - ברור לו מיתה יפה."], ["", "- אי הכי ליגבהיה טפי!"], ["", "- משום דמינול."], ["", "אחד מן העדים דוחפו."], ["", "תנו רבנן: מניין שבדחייה - תלמוד לומר ירה, ומנין שבסקילה - תלמוד לומר, סקול, ומנין שבסקילה ובדחייה - תלמוד לומר סקול יסקל או ירה יירה, ומנין שאם מת בדחייה יצא - תלמוד לומר או ירה יירה, מניין שאף לדורות כן - [דף מה:] תלמוד לומר סקול יסקל."], ["", "ואם לאו עד השני נוטל את האבן."], ["", "נוטל? והתניא רבי שמעון בן אלעזר אומר: אבן היתה שם, משוי שני בני אדם."], ["", "נוטלה ונותנה על לבו."], ["", "אם מת בה יצא."], ["", "- וליטעמיך, תיקשי לך היא גופא: משוי שני בני אדם נוטלה ונותנה על לבו? אלא: דמדלי לה בהדי חבריה, ושדי לה איהו, כי היכי דתיתי מרזיא."], ["", "ואם לאו רגימתו כו&#x27;."], ["", "והתניא: מעולם לא שנה בה אדם!"], ["", "- מי קאמינא דעביד? דאי מיצריך קאמינא."], ["", "אמר מר: אבן היתה כו&#x27;, והתניא: אחת אבן שנסקל בה ואחת עץ שנתלה עליו, ואחד סייף שנהרג בו, ואחד סודר שנחנק בו - כולן נקברין עמו."], ["", "- לא צריכא, דמתקני ומייתי אחריני חלופייהו."], ["", "נקברין עמו? והתניא: אין נקברין עמו!"], ["", "- אמר רב פפא: מאי עמו - עמו בתפיסתו."], ["", "אמר שמואל: נקטעה יד העדים - פטור, מאי טעמא - דבעינא יד העדים תהיה בו בראשונה וליכא."], ["", "אלא מעתה עדים גידמין דמעיקרא, הכי נמי דפסילי? - שאני התם, דאמר קרא יד העדים - שהיתה כבר."], ["", "מיתיבי: כל מקום שיעידוהו שנים, ויאמרו: מעידין אנו באיש פלוני שנגמר דינו בבית דין פלוני, ופלוני ופלוני עדיו - הרי זה יהרג!"], ["", "- תרגמא שמואל בהן הן עדיו."], ["", "- ומי בעינן קרא כדכתיב? - והתניא: מות יומת המכה רוצח הוא, אין לי אלא במיתה הכתובה בו, מנין שאם אי אתה יכול להמיתו במיתה הכתובה בו, שאתה ממיתו בכל מיתה שאתה יכול להמיתו - תלמוד לומר מות יומת המכה - מכל מקום."], ["", "- שאני התם דאמר קרא מות יומת."], ["", "- וליגמר מיניה!"], ["", "- משום דהוה רוצח וגואל הדם שני כתובין הבאין כאחד, וכל שני כתובין הבאין כאחד אין מלמדין."], ["", "רוצח - הא דאמרן."], ["", "גואל הדם מאי היא? - דתניא גאל הדם ימית את הרצח - מצוה בגואל הדם, ומניין שאם אין לו גואל, שבית דין מעמידין לו גואל - שנאמר בפגעו בו, מכל מקום."], ["", "אמר ליה מר קשישא בריה דרב חסדא לרב אשי: ומי לא בעינן קרא כדכתיב? והתנן: היה אחד מהן גידם או אילם או חיגר או סומא או חרש - אינו נעשה בן סורר ומורה, שנאמר ותפשו בו - ולא גידמין, והוציאו אתו - ולא חיגרין, ואמרו - ולא אילמין, בננו זה - ולא סומין, איננו שמע בקלנו - ולא חרשין."], ["", "מאי טעמא? לאו משום דבעינן קרא כדכתיב? - לא, שאני התם דכוליה קרא יתירא הוא."], ["", "תא שמע: אין לה רחוב - אין נעשית עיר הנדחת, דברי רבי ישמעאל."], ["", "רבי עקיבא אומר: אין לה רחוב - עושין לה רחוב."], ["", "עד כאן לא חלקו, אלא דמר סבר רחובה - דמעיקרא בעינן, ומר סבר רחובה - דהשתא נמי כדמעיקרא דמי."], ["", "אבל דכולי עלמא בעינן קרא כדכתיב!"], ["", "- תנאי היא."], ["", "דתנן: אין לו בהן יד, בהן רגל, אזן ימנית - אין לו טהרה עולמית, רבי אליעזר אומר: נותן על מקומו - ויוצא."], ["", "רבי שמעון אומר: נותן על שמאלו ויוצא."], ["", "משנה."], ["", "כל הנסקלין נתלין, דברי רבי אליעזר, וחכמים אומרים: אינו נתלה אלא המגדף והעובד עבודה זרה."], ["", "האיש תולין אותו פניו כלפי העם, והאשה פניה כלפי העץ, דברי רבי אליעזר."], ["", "וחכמים אומרים: האיש נתלה ואין האשה נתלית."], ["", "אמר (להן) +מסורת הש&quot;ס: להם+ רבי אליעזר: והלא שמעון בן שטח תלה נשים באשקלון!"], ["", "- אמרו לו: שמונים נשים תלה, ואין דנין שנים ביום אחד."], ["", "גמרא."], ["", "תנו רבנן: והומת ותלית - יכול כל המומתין נתלין, תלמוד לומר כי קללת אלהים תלוי מה מקלל - זה שבסקילה, אף כל שבסקילה, דברי רבי אליעזר."], ["", "- וחכמים אומרים: מה מקלל - זה שכפר בעיקר, אף כל - שכפר בעיקר."], ["", "במאי קא מיפלגי? רבנן דרשי כללי ופרטי, רבי אליעזר דריש ריבויי ומיעוטי."], ["", "רבנן דרשי כללי ופרטי: והומת ותלית - כלל, כי קללת - פרט, אי הוו מקרבי להדדי אמרינן: אין בכלל אלא מה שבפרט, הני - אין, מידי אחרינא - לא."], ["", "[דף מו.] השתא דמרחקי מהדדי - אהני לרבויי עבודה זרה דדמי ליה בכל מילי."], ["", "ורבי אליעזר דריש ריבויי ומיעוטי: והומת ותלית - רבוי, כי קללת - מיעוט."], ["", "אי הוו מקרבי להדדי - לא הוו מרבינן אלא עבודה זרה דדמי לה בכל מילי, השתא דמרחקי מהדדי - אהני לרבויי שאר הנסקלין."], ["", "האיש תולין וכו&#x27;."], ["", "מאי טעמא דרבנן? - אמר קרא ותלית אתו - אותו ולא אותה."], ["", "- ורבי אליעזר: אותו - בלא כסותו."], ["", "- ורבנן: אין, הכי נמי."], ["", "אלא אמר קרא וכי יהיה באיש חטא - איש ולא אשה."], ["", "- ורבי אליעזר, האי וכי יהיה באיש מאי דריש ביה? - אמר ריש לקיש: ההוא למעוטי בן סורר ומורה - והתניא: בן סורר ומורה נסקל ונתלה, דברי רבי אליעזר!"], ["", "- אלא אמר רב נחמן בר יצחק: לרבות בן סורר ומורה."], ["", "מאי טעמא - דאמר קרא וכי יהיה באיש חטא - איש ולא בן, חטא - מי שעל חטאו נהרג, יצא בן סורר ומורה שעל שום סופו נהרג."], ["", "הוי מיעוט אחר מיעוט, ואין מיעוט אחר מיעוט אלא לרבות."], ["", "אמר להן רבי אליעזר: והלא שמעון בן שטח תלה נשים כו&#x27;."], ["", "אמר רב חסדא: לא שנו אלא בשתי מיתות, אבל במיתה אחת - דנין."], ["", "והא מעשה דשמעון בן שטח דמיתה אחת הואי, וקא אמרו ליה דאין דנין!"], ["", "- אלא אי איתמר הכי איתמר: לא שנו אלא במיתה אחת כעין שתי מיתות, והיכי דמי - כגון שתי עבירות, אבל במיתה אחת ועבירה אחת - דנין."], ["", "מתיב רב אדא בר אהבה: אין דנין שנים ביום אחד, ואפילו בנואף ונואפת!"], ["", "- תרגמא רב חסדא: בבת כהן ובועלה, או בבת כהן וזוממי זוממיה."], ["", "תניא רבי אליעזר בן יעקב אומר: שמעתי שבית דין מכין ועונשין שלא מן התורה, ולא לעבור על דברי תורה, אלא כדי לעשות סייג לתורה."], ["", "ומעשה באחד שרכב על סוס בשבת בימי יונים."], ["", "והביאוהו לבית דין וסקלוהו."], ["", "לא מפני שראוי לכך, אלא שהשעה צריכה לכך."], ["", "שוב מעשה באדם אחד שהטיח את אשתו תחת התאנה, והביאוהו לבית דין והלקוהו, לא מפני שראוי לכך אלא שהשעה צריכה לכך."], ["", "משנה."], ["", "כיצד תולין אותו? - משקעין את הקורה בארץ, והעץ יוצא, ומקיף שתי ידיו זו על גב זו ותולה אותו."], ["", "רבי יוסי אומר: הקורה מוטה על הכותל, ותולה אותו כדרך שהטבחין עושין."], ["", "ומתירין אותו מיד, ואם לן - עובר עליו בלא תעשה, שנאמר: לא תלין נבלתו על העץ כי קבור תקברנו כי קללת אלהים תלוי וגו&#x27;, כלומר: מפני מה זה תלוי - מפני שבירך את השם, ונמצא שם שמים מתחלל."], ["", "אמר רבי מאיר: בשעה שאדם מצטער שכינה מה לשון אומרת: קלני מראשי, קלני מזרועי!"], ["", "אם כן המקום מצטער על דמן של רשעים שנשפך - קל וחומר על דמן של צדיקים."], ["", "ולא זו בלבד אמרו, אלא: כל המלין את מתו עובר בלא תעשה."], ["", "הלינהו לכבודו, להביא לו ארון ותכריכים - אינו עובר עליו."], ["", "ולא היו קוברין אותו בקברות אבותיו, אלא שתי בתי קברות היו מתוקנין לבית דין; אחת לנהרגין ולנחנקין, ואחת לנסקלין ולנשרפין."], ["", "נתעכל הבשר - מלקטין את העצמות וקוברין אותן במקומן."], ["", "והקרובים באים ושואלים בשלום הדיינין ובשלום העדים, כלומר שאין בלבנו עליכם שדין אמת דנתם."], ["", "[דף מו:] ולא היו מתאבלין, אבל אוננין."], ["", "שאין אנינות אלא בלב."], ["", "גמרא."], ["", "תנו רבנן: אילו נאמר חטא ותלית - הייתי אומר תולין אותו ואח&#x27;&#x27;כ ממיתין אותו, כדרך שהמלכות עושה."], ["", "תלמוד לומר: והומת ותלית - ממיתין אותו ואח&#x27;&#x27;כ תולין אותו."], ["", "הא כיצד? משהין אותו עד סמוך לשקיעת החמה, וגומרין את דינו, וממיתין אותו ואח&#x27;&#x27;כ תולין אותו."], ["", "אחד קושר ואחד מתיר, כדי לקיים מצות תלייה."], ["", "- תנו רבנן: עץ - שומע אני בין בתלוש בין במחובר, תלמוד לומר כי קבור - מי שאינו מחוסר אלא קבורה, יצא זה שמחוסר קציצה וקבורה."], ["", "רבי יוסי אומר: מי שאינו מחוסר אלא קבורה, יצא זה שמחוסר תלישה וקבורה."], ["", "ורבנן: תלישה - לאו כלום היא."], ["", "כלומר מפני מה זה תלוי מפני שבירך כו&#x27;."], ["", "תניא, אומר רבי מאיר: משלו משל למה הדבר דומה - לשני אחים תאומים בעיר אחת, אחד מינוהו מלך ואחד יצא לליסטיות."], ["", "צוה המלך ותלאוהו."], ["", "כל הרואה אותו אומר: המלך תלוי!"], ["", "צוה המלך והורידוהו."], ["", "אמר רבי מאיר כו&#x27;."], ["", "מאי משמע? - אמר אביי: כמאן דאמר קל לית."], ["", "אמר ליה רבא: אם כן, כבד עלי ראשי, כבד עלי זרועי מיבעי ליה!"], ["", "אלא אמר רבא: כמאן דאמר קיל לי עלמא."], ["", "- האי מיבעי ליה לגופה!"], ["", "- אם כן נימא קרא מקלל מאי קללת."], ["", "- ואימא כוליה להכי הוא דאתא!"], ["", "- אם כן נימא קרא קלת - מאי קללת - שמע מינה תרתי."], ["", "ולא זו בלבד כו&#x27;."], ["", "אמר רבי יוחנן משום רבי שמעון בן יוחי: מנין למלין את מתו שעובר עליו בלא תעשה - תלמוד לומר כי קבור תקברנו - מכאן למלין את מתו שעובר בלא תעשה."], ["", "איכא דאמרי, אמר רבי יוחנן משום רבי שמעון בן יוחי: רמז לקבורה מן התורה מניין - תלמוד לומר כי קבור תקברנו מכאן רמז לקבורה מן התורה."], ["", "אמר ליה שבור מלכא לרב חמא: קבורה מן התורה מניין? אישתיק ולא אמר ליה ולא מידי."], ["", "אמר רב אחא בר יעקב: אימסר עלמא בידא דטפשאי."], ["", "דאיבעי ליה למימר כי קבור - דליעבד ליה ארון."], ["", "תקברנו - לא משמע ליה."], ["", "- ונימא מדאיקבור צדיקי!"], ["", "- מנהגא בעלמא - מדקבריה הקב&quot;ה למשה!"], ["", "- דלא לישתני ממנהגא."], ["", "תא שמע: וספדו לו כל ישראל וקברו אתו - דלא לישתני ממנהגא."], ["", "לא יספדו ולא יקברו לדמן על פני האדמה יהיו - דלישתנו ממנהגא."], ["", "איבעיא להו: קבורה משום בזיונא הוא, או משום כפרה הוא? - למאי נפקא מינה? - דאמר: לא בעינא דליקברוה לההוא גברא."], ["", "אי אמרת משום בזיונא הוא - לא כל כמיניה."], ["", "ואי אמרת משום כפרה הוא - הא אמר לא בעינא כפרה, מאי? - תא שמע: מדאיקבור צדיקי ואי אמרת משום כפרה - צדיקי לכפרה צריכי? - אין, דכתיב אדם אין צדיק בארץ אשר יעשה טוב ולא יחטא."], ["", "תא שמע וספדו לו כל ישראל וקברו אתו, ואי אמרת כי היכי דתיהוי ליה כפרה - הנך נמי ליקברו, כי היכי דתיהוי להו כפרה!"], ["", "- האי דצדיק הוא - תיהוי ליה כפרה, הנך - לא ליהוי להו כפרה."], ["", "תא שמע: לא יספדו ולא יקברו!"], ["", "- דלא תיהוי להו כפרה."]], "id": 5121}, {"k": "nose", "a": "איבעיא להו: הספידא, יקרא דחיי הוי או יקרא דשכבי? [ח]–נפק&#x27;&#x27;מ  א. כשביקש שלא להספידו. ב. להוציא שכר מיורשין", "l": [], "id": 5270}, {"k": "u", "a": "א. ת&#x27;&#x27;&#x27;ש:", "l": [["", "<i class=\"ps\">וַיָּבֹא אַבְרָהָם לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ,<\/i> אם משום יקרא דחיי וכי מפני יקרת אברהם משהו לשרה <i class=\"am\">ודחי&#x27;<\/i> דשרה ניח&#x27;&#x27;ל שייקרו את אברהם "]], "id": 5271}, {"k": "u", "a": "ב. ת&#x27;&#x27;ש:", "l": [["", "<i class=\"ps\">וְסָפְדוּ לוֹ כָל יִשְׂרָאֵל וְקָבְרוּ אֹתוֹ,<\/i> אי  משום יקרא דחיי הוא - הנך בני יקרא נינהו? -ודחי&#x27; דנ&#x27;&#x27;ל לצדיקים דמייקרי בהו אינשי."]], "id": 5273}, {"k": "u", "a": "ג. ת&#x27;&#x27;ש:", "l": [["", "<i class=\"ps\">לֹא יִסָּפְדוּ וְלֹא יִקָּבֵרוּ <\/i>לא נח לצדיקים שמכבדים הרשעים <i class=\"hs\">אף שקרובים<\/i>"]], "id": 5275}, {"k": "u", "a": "ד. ת&#x27;&#x27;ש:", "l": [["", "<i class=\"ps\">בשלום תמות ובמשרפות אבותיך המלכים הראשונים אשר היו לפניך כן ישרפו לך והוי אדון יספדו לך,<\/i> ואי משום יקרא דחיי הוא מאי נפק&#x27;&#x27;מ"]], "id": 5277}, {"k": "u", "a": "- ה&#x27;&#x27;ק", "l": [["", "יתייקרו בך ישראל, כפי שאתה התייקרת באבותיך."]], "id": 5279}]}, {"daf": "מז.", "perek": "פרק שישי", "perekName": "נגמר הדין", "units": [{"k": "u", "a": "ת&quot;ש:", "l": [["", "<i class=\"ps\">נבזה בעיניו נמאס -<\/i> זה חזקיהו מלך יהודה, שגירר עצמות אביו על מטה של חבלים."], ["", "ואי משום יקרא דחיי הוא מ&#x27;&#x27;ט- כדי שתהא כפרה לאביו"], ["", "ומשום כפרת אביו ישראל היו מוכנים שיעשה כן ומחלו על כבודם "]], "id": 5282}, {"k": "u", "a": "ה. ת&#x27;&#x27;ש:", "l": [["", "<i class=\"am\">רב אמר להן<\/i> אל תספדוני בעיירות. <i class=\"am\">ואי אמרת<\/i> יקרא דחיי מאי נפק&#x27;&#x27;מ "]], "id": 5286}, {"k": "u", "a": "-סבר", "l": [["", "שיתייקרו בו ישראל יותר."]], "id": 5288}, {"k": "u", "a": "ו. ת&#x27;&#x27;ש:", "l": [["", "הלינו לכבודו, להביא לו ארון ותכריכין - אינו עובר עליו. <i class=\"hs\">בל&#x27;&#x27;ת<\/i>"], ["", "מאי לאו - לכבודו של מת? <i : "כרי&#x27;&#x27;ש", "l": [["", "ש<i class=\"ps\">ועשיתם לו כאשר זמם לעשות לאחיו<\/i> ולא לאחותו, "]], "id": 5756}, {"k": "nose", "a": "ר&#x27;&#x27;ע: אחת ארוסה ואחת נשואה יצאת לשריפה.", "l": [], "id": 5758}, {"k": "u", "a": "", "l": [["", "<i class=\"ps\">אביה אביה<\/i> אף לנשואה זנות עם זיקת הבעל. "]], "id": 5759}, {"k": "u", "a": "א&#x27;&#x27;ל רי&#x27;&#x27;ש", "l": [["", "אי מה להלן נערה והיא ארוסה - אף כאן נערה והיא ארוסה!"]], "id": 5760}, {"k": "u", "a": "א&#x27;&#x27;ל רבי עקיבא:", "l": [["", "ישמעאל אחי <i class=\"ps\">בת ובת<\/i> אני דורש.[ו&#x27; יתרה]"]], "id": 5762}, {"k": "u", "a": "א&#x27;&#x27;ל רי&#x27;&#x27;ש:", "l": [["", "וכי מפני שאתה דורש בת ובת נוציא זו לשריפה? "], ["", "אם משמע להביא את הנשואה - הביא את הפנויה, "], ["", "ואם משמע להוציא את הפנויה - הוציא את הנשואה."]], "id": 5764}, {"k": "u", "a": "ור&#x27;&#x27;ע:", "l": [["", "אהני גז&#x27;&#x27;ש למעט פנויה, ואהני בת ובת לרבות את הנשואה."]], "id": 5768}, {"k": "u", "a": "ורי&#x27;&#x27;ש:", "l": [["", "מדקאמר ליה <i class=\"ps\">בת ובת<\/i> ש&#x27;&#x27;מ הדר ביה מגזירה שוה."]], "id": 5770}, {"k": "u", "a": "ורי&#x27;&#x27;ש", "l": [["", "<i class=\"ps\">בת ובת<\/i> <i class=\"am\">מיבעי<\/i> שלא לחלק בבנות בין תמימים לבעלי מומין."]], "id": 5772}, {"k": "u", "a": "ור&#x27;&#x27;ע:", "l": [["", "מ<i class=\"ps\">והם מקריבם והיו קדש<\/i>, נפקא."]], "id": 5774}, {"k": "u", "a": "ורי&#x27;&#x27;ש", "l": [["", "אי מההיא - הוה אמינא: ה&#x27;&#x27;מ הם ולא בנותיהן – קמ&#x27;&#x27;ל "]], "id": 5776}, {"k": "hatz", "a": "***", "l": [], "id": 5778}, {"k": "u", "a": "", "l": [["", "- ורבי ישמעאל, [דף נב.] האי את אביה היא מחללת, מאי דריש ביה? - מבעי ליה לכדתניא, היה רבי מאיר אומר: מה תלמוד לומר את אביה היא מחללת - שאם היו נוהגין בו קודש - נוהגין בו חול, כבוד - נוהגין בו בזיון, אומרין: ארור שזו ילד, ארור שזו גידל, ארור שיצא זו מחלציו."], ["", "אמר רב אשי: כמאן קרינן רשיעא בר רשיעא ואפילו לרשיעא בר צדיקא, כמאן - כהאי תנא."], ["", "זו מצות הנסקלין."], ["", "מאי תנא דקתני זו מצות הנסקלין? - משום דתנא: נגמר הדין, מוציאין אותו לסקלו, בית הסקילה היה גבוה שתי קומות."], ["", "ואיידי דקא בעי למיתנא מצות הנשרפין - תנא נמי זו מצות הנסקלין."], ["", "משנה."], ["", "מצות הנשרפין היו משקעין אותו בזבל עד ארכובותיו, ונותנין סודר קשה לתוך הרכה, וכורך על צוארו, זה מושך אצלו וזה מושך אצלו עד שפותח את פיו, ומדליק את הפתילה וזורקה לתוך פיו, ויורדת לתוך מעיו וחומרת את בני מעיו."], ["", "רבי יהודה אומר: אף הוא אם מת בידם לא היו מקיימין בו מצות שריפה."], ["", "אלא, פותח את פיו בצבת שלא בטובתו, ומדליק את הפתילה וזורקה לתוך פיו, ויורדת לתוך מעיו וחומרת את בני מעיו."], ["", "אמר רבי אלעזר (בן) +מסורת הש&quot;ס: ברבי+ צדוק: מעשה בבת כהן אחת שזינתה, והקיפוה חבילי זמורות, ושרפוה."], ["", "(אמרו) [אמר] לו: מפני שלא היה בית דין של אותה שעה בקי."], ["", "גמרא."], ["", "מאי פתילה? אמר רב מתנה: פתילה של אבר."], ["", "מנא לן? - אתיא שריפה שריפה מעדת קרח, מה להלן - שריפת נשמה וגוף קיים, אף כאן - שריפת נשמה וגוף קיים."], ["", "רבי אלעזר אמר: אתיא שריפה שריפה מבני אהרן, מה להלן שריפת נשמה וגוף קיים - אף כאן שריפת נשמה וגוף קיים."], ["", "מאן דיליף מעדת קרח - מנא ליה? דכתיב ואת מחתות החטאים האלה בנפשתם - שנשמתן נשרפת וגוף קיים."], ["", "ואידך - ההיא שריפה ממש היא, ומאי בנפשתם - שנתחייבו שריפה על עסקי נפשותם, כדריש לקיש."], ["", "דאמר ריש לקיש: מאי דכתיב בחנפי לעגי מעוג חרק עלי שנימו, בשביל חנופה שהחניפו לקרח על עסקי לגימה - חרק עליהן שר של גיהנם שניו."], ["", "ומאן דיליף מבני אהרן - מנא ליה? דכתיב וימתו לפני ה&#x27; - כעין מיתה."], ["", "- ואידך: ההוא שריפה ממש הואי, ומאי דכתיב וימתו - דאתחיל בהו מגואי, כעין מיתה."], ["", "דתניא, אבא יוסי בן דוסתאי אומר: שני חוטין של אש יצאו מבית קודש הקדשים, ונחלקו לארבע, ונכנסו שנים בחוטמו של זה ושנים בחוטמו של זה, ושרפום."], ["", "- והכתיב ותאכל אותם!"], ["", "- אותם ולא בגדיהם."], ["", "ונילף מפרים הנשרפים, מה להלן שריפה ממש - אף כאן שריפה ממש!"], ["", "- מסתברא, מאדם הוה ליה למילף, שכן: אדם, חוטא, נשמה, פיגול."], ["", "- אדרבה, מפרים הנשרפים הוה ליה למילף, שכן: מכשיר לדורות."], ["", "- הנך נפישין."], ["", "מאן דיליף מעדת קרח - מאי טעמא לא יליף מבני אהרן? - ההוא שריפה ממש הואי."], ["", "- ונילף מינה!"], ["", "- אמר רב נחמן אמר רבה בר אבוה: אמר קרא ואהבת לרעך כמוך - ברור לו מיתה יפה."], ["", "- וכי מאחר דאיכא דרב נחמן, גזירה שוה למה לי? - אי לאו גזירה שוה - הוה אמינא: שריפת נשמה וגוף קיים - לאו שריפה היא כלל, ואי משום ואהבת לרעך כמוך - לפיש ליה חבילי זמורות כי היכי דלישרוף לעגל, קא משמע לן."], ["", "וכבר היו משה ואהרן מהלכין בדרך ונדב ואביהוא מהלכין אחריהן וכל ישראל אחריהן, אמר לו נדב לאביהוא: אימתי ימותו שני זקנים הללו ואני ואתה ננהיג את הדור? אמר להן הקב&quot;ה: הנראה מי קובר את מי."], ["", "אמר רב פפא: היינו דאמרי אינשי: נפישי גמלי סבי דטעיני משכי דהוגני."], ["", "אמר רבי (אליעזר) +מסורת הש&quot;ס: אלעזר+: [דף נב:] למה תלמיד חכם דומה לפני עם הארץ? בתחלה דומה לקיתון של זהב, סיפר הימנו - דומה לקיתון של כסף, נהנה ממנו - דומה לקיתון של חרש, כיון שנשבר - שוב אין לו תקנה."], ["", "אימרתא בת טלי בת כהן שזינתה הואי, אקפה רב חמא בר טוביה חבילי זמורות ושרפה."], ["", "אמר רב יוסף: טעה בתרתי, טעה בדרב מתנה, וטעה בדתניא: ובאת אל הכהנים הלוים ואל השפט אשר יהיה בימים ההם, בזמן שיש כהן - יש משפט, בזמן שאין כהן - אין משפט."], ["", "אמר רבי אלעזר ברבי צדוק מעשה בבת כהן שזינתה וכו&#x27;."], ["", "אמר רב יוסף: בית דין של צדוקים הוה."], ["", "הכי אמר להו והכי אהדרו ליה? והתניא, אמר רבי אלעזר ברבי צדוק: זכורני כשהייתי תינוק ומורכב על כתיפו של אבא, והביאו בת כהן שזינתה, והקיפוה חבילי זמורות ושרפוה!"], ["", "- אמרו לו: קטן היית, ואין מביאין ראיה מן הקטן."], ["", "- שני מעשים הוו."], ["", "- הי אמר להו ברישא? אילימא הא קמייתא אמר להו ברישא, אמר ליה כשהוא גדול ולא אשגחו ביה, אמר להו כשהוא קטן ואשגחו ביה? אלא: הא אמר להו ברישא, ואמרו ליה: קטן היית."], ["", "ואמר להו כשהוא גדול."], ["", "ואמרו ליה: מפני שלא היה בית דין של אותה שעה בקי."], ["", "משנה."], ["", "מצות הנהרגין - היו מתיזין את ראשו בסייף, כדרך שהמלכות עושה."], ["", "רבי יהודה אומר: ניוול הוא לו, אלא מניחין את ראשו על הסדן וקוצץ בקופיץ."], ["", "אמרו לו: אין מיתה מנוולת מזו."], ["", "גמרא."], ["", "תניא, אמר להן רבי יהודה לחכמים: אף אני יודע שמיתה מנוולת היא, אבל מה אעשה, שהרי אמרה תורה ובחקתיהם לא תלכו!"], ["", "ורבנן: כיון דכתיב סייף באורייתא - לא מינייהו קא גמרינן."], ["", "דאי לא תימא הכי, הא דתניא: שורפין על המלכים ולא מדרכי האמורי, היכי שרפינן? והכתיב ובחקתיהם לא תלכו!"], ["", "אלא, כיון דכתיב שריפה באורייתא, דכתיב ובמשרפות אבותיך וגו&#x27; - לאו מינייהו קא גמרינן."], ["", "והכא נמי, כיון דכתיב סייף באורייתא - לאו מינייהו קא גמרינן."], ["", "והא דתנן באידך פירקין: אלו הן הנהרגין: הרוצח ואנשי עיר הנדחת."], ["", "בשלמא עיר הנדחת - כתיב בהו לפי חרב."], ["", "אלא רוצח מנלן? - דתניא: נקם ינקם, נקימה זו איני יודע מה הוא, כשהוא אומר והבאתי עליכם חרב נקמת נקם ברית - הוי אומר נקימה זו סייף."], ["", "- ואימא דבריז ליה מיברז!"], ["", "- לפי חרב כתיב."], ["", "- ואימא דעביד ליה גיסטרא!"], ["", "- אמר רב נחמן אמר רבה בר אבוה: אמר קרא ואהבת לרעך כמוך - ברור לו מיתה יפה."], ["", "אשכחן דקטל עבדא, בר חורין מנא לן? - ולאו קל וחומר הוא: קטל עבדא - בסייף, בר חורין בחנק? הניחא למאן דאמר חנק קל, אלא למאן דאמר חנק חמור - מאי איכא למימר? - נפקא ליה מדתניא: ואתה תבער הדם הנקי מקרבך - הוקשו כל שופכי דמים לעגלה ערופה, מה להלן - בסייף ומן הצואר אף כאן בסייף ומן הצואר."], ["", "- אי מה להלן בקופיץ וממול עורף, אף כאן בקופיץ וממול עורף? - אמר רב נחמן אמר רבה בר אבוה: אמר קרא ואהבת לרעך כמוך - ברור לו מיתה יפה."]], "id": 5779}, {"k": "m", "a": "", "l": [["", "משנה."], ["", "מצות הנחנקין - היו משקעין אותו בזבל עד ארכובותיו, ונותן סודר קשה לתוך הרכה, וכורך על צוארו, זה מושך אצלו וזה מושך אצלו, עד שנפשו יוצאת."]], "id": 5842}, {"k": "u", "a": "", "l": [["", "גמרא."], ["", "תנו רבנן: איש - פרט לקטן, אשר ינאף את אשת איש - פרט לאשת קטן, אשת רעהו - פרט לאשת אחרים, מות יומת - בחנק."], ["", "אתה אומר בחנק, או אינו אלא באחת מכל מיתות האמורות בתורה? אמרת: כל מקום שנאמר מיתה בתורה סתם - אין אתה רשאי למושכה להחמיר עליה, אלא להקל עליה, דברי רבי יאשיה."], ["", "רבי יונתן אומר: לא מפני שהיא קלה, אלא: כל מיתה האמורה בתורה סתם אינה אלא חנק."], ["", "רבי אומר: נאמר מיתה בידי שמים, ונאמר מיתה בידי אדם."], ["", "מה מיתה האמורה בידי שמים - מיתה שאין בה רושם, אף מיתה האמורה בידי אדם - מיתה שאין בה רושם."], ["", "- ואימא שריפה!"], ["", "- מדאמר רחמנא בת כהן בשריפה - מכלל דהא לאו בת שריפה היא."], ["", "[דף נג.] בשלמא לרבי יונתן - כדקא מפרש רבי טעמא."], ["", "אלא לרבי יאשיה - ממאי דאיכא חנק בעולם? אימא סייף!"], ["", "- אמר רבא: ארבע מיתות גמרא גמירי להו."], ["", "מאי לא מפני שהיא קלה - קמיפלגי בפלוגתא דרבי שמעון ורבנן."], ["", "אמר ליה רבי זירא לאביי: שאר הנסקלין דלא כתיב בהו סקילה, דגמרי מאוב וידעוני, במאי גמרי? במות יומתו גמרי, או בדמיהם בם גמרי? אמר ליה: בדמיהם דמיהם בם גמרי."], ["", "דאי במות יומתו גמרי, דמיהם דמיהם למה לי? - אלא מאי - בדמיהם דמיהם גמרי, מות יומתו למה לי? - כדתניא: מות יומת המכה רצח הוא, אין לי אלא במיתה הכתובה בו, מניין שאם אי אתה יכול להמיתו במיתה הכתובה בו שאתה ממיתו בכל מיתה שאתה יכול להמיתו - תלמוד לומר מות יומת המכה - מכל מקום."], ["", "אמר ליה רב אחא מדפתי לרבינא: ואי במות יומתו גמרי מאי קא קשיא ליה? אילימא אשת איש קא קשיא ליה למיתי ולמיגמר מות יומת מאוב וידעוני, מה להלן בסקילה - אף כאן בסקילה!"], ["", "מדאמר רחמנא ארוסה בסקילה - מכלל דנשואה לאו בסקילה."], ["", "ואלא מכה אביו ואמו קא קשיא ליה, למיתי ולמיגמר מאוב וידעוני."], ["", "עד דגמרי מאוב וידעוני - ליגמרו מאשת איש, דאי אתה רשאי למושכה להחמיר עליה אלא להקל עליה!"], ["", "- אמר ליה: שאר הנסקלין גופייהו קא קשיא ליה, דאי במות יומת גמרי - עד דגמרי מאוב וידעוני, ליגמרו מאשת איש."]], "id": 5844}, {"k": "m", "a": "", "l": [["", "משנה."], ["", "אלו הן הנסקלין: "], ["", "הבא על האם, ועל אשת האב, ועל הכלה, ועל הזכור, ועל הבהמה, והאשה המביאה את הבהמה, והמגדף, והעובד עבודה זרה, והנותן מזרעו למולך, ובעל אוב וידעוני, והמחלל את השבת, והמקלל אביו ואמו, והבא על נערה המאורסה, והמסית, והמדיח, והמכשף, ובן סורר ומורה."], ["", "הבא על האם - חייב עליה משום אם ומשום אשת אב, "], ["", "<i class=\"am\">רבי יהודה אומר:<\/i> אינו חייב אלא משום האם בלבד."], ["", "הבא על אשת אב חייב משום אשת אב ומשום אשת איש, בין בחיי אביו בין לאחר מיתת אביו, בין מן האירוסין בין מן הנישואין."], ["", "הבא על כלתו - חייב עליה משום כלתו, ומשום אשת איש, בין בחיי בנו בין לאחר מיתת בנו, בין מן האירוסין בין מן הנישואין."]], "id": 5863}, {"k": "u", "a": "", "l": [["", "גמרא."], ["", "תניא, רבי יהודה אומר: אם לא היתה אמו ראויה לאביו - אינו חייב אלא משום האם בלבד."], ["", "מאי אינה ראויה לו? - אילימא חייבי כריתות וחייבי מיתות בית דין - מכלל דרבנן סברי אף על גב דאינה ראויה לו? הא לית ליה קידושין בגווה!"], ["", "אלא: חייבי לאוין."], ["", "ורבי יהודה סבר לה כרבי עקיבא, דאמר: אין קידושין תופסין בחייבי לאוין."], ["", "מתיב רב אושעיא: איסור מצוה ואיסור קדושה - חולצות ולא מתייבמות, [דף נג:] איסור מצוה - שניות מדברי סופרים."], ["", "ואמאי קרו להו איסור מצוה - שמצוה לשמוע דברי חכמים."], ["", "איסור קדושה - אלמנה לכהן גדול, גרושה וחלוצה לכהן הדיוט, ואמאי קרו להו איסור קדושה - דכתיב קדשים יהיו לאלהיהם."], ["", "ותניא עלה: רבי יהודה מחליף."], ["", "חלופי הוא דמחליף, הא חליצה - בעיא."], ["", "ואי סלקא דעתך רבי יהודה כרבי עקיבא סבירא ליה, מכדי חייבי לאוין לרבי עקיבא כחייבי כריתות דמי, וחייבי כריתות - לאו בני חליצה ויבום נינהו!"], ["", "- לדבריו דתנא קמא קאמר, וליה לא סבירא ליה."], ["", "כי אתא רבי יצחק תני כדתנן: רבי יהודה אומר: אינו חייב אלא משום האם בלבד."], ["", "וטעמא מאי? - אמר אביי: דאמר קרא אמך היא - משום אמו אתה מחייבו, ואי אתה מחייבו משום אשת אב."], ["", "אלא מעתה ערות אשת אביך לא תגלה ערות אביך היא - משום אשת אב אתה מחייבו ואי אתה מחייבו משום אמו? - אלא: אמו שהיא אשת אביו, קאי הכא - וממעט לה, קאי הכא - וממעט לה."], ["", "השתא אמו שאינה אשת אביו - מיחייב, אשת אביו שאינה אמו - מיחייב, אמו שהיא אשת אביו לא מיחייב כלל? ותו: לרבנן נמי הכתיב אמך היא!"], ["", "אלא, ההוא מיבעי ליה לכדרב שישא בריה דרב אידי, - לרבי יהודה נמי, ההוא מיבעי ליה לכדרב שישא בריה דרב אידי!"], ["", "אלא אמר רב אחא בריה דרב איקא: אמר קרא ערותה - משום ערוה אחת אתה מחייבו, ואי אתה מחייבו משום שתי ערות."], ["", "- אלא מעתה ערות כלתך לא תגלה אשת בנך היא לא תגלה ערותה, הכי נמי, משום ערוה אחת אתה מחייבו ואי אתה מחייבו משום שתי ערות? והתנן: הבא על כלתו - חייב עליה משום כלתו, ומשום אשת איש, בין בחיי בנו בין לאחר מיתת בנו, ולא פליג רבי יהודה!"], ["", "- אלא: כיון דחד גופא הוא אף על גב דתרי איסורי נינהו - כתיב ערותה, הכא נמי - כיון דחד גופא הוא,
