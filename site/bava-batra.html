פרוטה לחנוני, איוב ויתרה משלו."]], "id": 1127}, {"k": "u", "a": "•", "l": [["", "<i class=\"ps\">&#x27;ויען השטן את ה<\/i>&#x27; <i class=\"ps\">ויאמר החנם ירא איוב אלהים, הלא אתה סכת בעדו ובעד ביתו וגו&#x27;,<\/i>"]], "id": 1129}, {"k": "u", "a": "ארשבר&quot;י:", "l": [["", "&#x27;מ<i class=\"ps\">עשה ידיו ברכת<\/i>&#x27; כל הנוטל פרוטה מאיוב מתברך."]], "id": 1131}, {"k": "u", "a": "ריב&quot;ח:", "l": [["", "&#x27;ו<i class=\"ps\">מקנהו פרץ בארץ<\/i>&#x27; מקנהו של איוב פרצו גדרו של עולם, מנהגו של עולם - זאבים הורגים העזים, מקנהו של איוב - עזים הורגים את הזאבים."]], "id": 1133}, {"k": "u", "a": "•", "l": [["", "<i class=\"ps\">ויאמר הבקר היו חורשות והאתונות רועות על ידיהם וגו<\/i>&#x27;,"]], "id": 1135}, {"k": "u", "a": "רי&quot;ו:", "l": [["", "מלמד, שהטעימו הקב&quot;ה לאיוב מעין העולם הבא."]], "id": 1137}]}, {"daf": "טז.", "perek": "פרק ראשון", "perekName": "השותפין", "units": [{"k": "u", "a": "•", "l": [["", "<i class=\"am\">&#x27;עוד זה מדבר וזה בא<\/i><i class=\"ps\"> וַיֹּאמַר אֵשׁ אֱלֹהִים וגו<\/i>&#x27;, "], ["", "<i class=\"am\">עוד זה מדבר וזה בא<\/i> <i class=\"ps\">וַיֹּאמַר כַּשְׂדִּים שָׂמוּ שְׁלֹשָׁה רָאשִׁים וַיִּפְשְׁטוּ עַל הַגְּמַלִּים וַיִּקָּחוּם וגו<\/i>&#x27;, "], ["", "<i class=\"ps\">עַד זֶה מְדַבֵּר וְזֶה בָּא וַיֹּאמַר בָּנֶיךָ וּבְנוֹתֶיךָ &quot;אֹכְלִים וְשֹׁתִים יַיִן&quot; בְּבֵית אֲחִיהֶם הַבְּכוֹר   &quot;וְהִנֵּה רוּחַ גְּדוֹלָה בָּאָה&quot; מֵעֵבֶר הַמִּדְבָּר וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת וַיִּפֹּל עַל הַנְּעָרִים וַיָּמוּתוּ וָאִמָּלְטָה רַק אֲנִי לְבַדִּי לְהַגִּיד לָךְ  וגו<\/i>&#x27;,<i class=\"ps\"> וַיָּקָם אִיּוֹב וַיִּקְרַע אֶת מְעִלוֹ וַיָּגָז אֶת רֹאשׁוֹ וגו<\/i>&#x27;,<i class=\"ps\"> וַיֹּאמֶר עָרֹם יָצָתִי &quot;מִבֶּטֶן אִמִּי&quot; וְעָרֹם אָשׁוּב שָׁמָּה יְהֹוָה נָתַן וַיהֹוָה לָקָח יְהִי שֵׁם יְהֹוָה מְבֹרָךְ  &quot;בְּכָל זֹאת לֹא חָטָא&quot; אִיּוֹב וְלֹא נָתַן תִּפְלָה לֵאלֹהִים  &quot;וַיְהִי הַיּוֹם וַיָּבֹאוּ בְּנֵי&quot; הָאֱלֹהִים לְהִתְיַצֵּב עַל ה&#x27; <\/i>,<i class=\"ps\"> וַיֹּאמֶר ה&#x27; אֶל הַשָּׂטָן אֵי מִזֶּה תָּבֹא וַיַּעַן הַשָּׂטָן אֶת ה&#x27; וַיֹּאמַר מִשֻּׁט בָּאָרֶץ וּמֵהִתְהַלֵּךְ בָּהּ<\/i>"], ["", "<i class=\"am\">אמר לפניו:<\/i> רבש&quot;ע, שטתי בכל העולם ולא מצאתי כעבדך אברהם, שאמרת לו: <i class=\"ps\">קום התהלך בארץ לארכה ולרחבה כי לך אתננה,<\/i> ובשעה שבקש לקבור שרה לא מצא מקום לקוברה, ולא הרהר אחר מדותיך."]], "id": 1140}, {"k": "u", "a": "&#x27;•", "l": [["", "<i class=\"ps\">וַיֹּאמֶר ה&#x27; &quot;אֶל הַשָּׂטָן וגו&#x27; וַתְּסִיתֵנִי בוֹ לְבַלְּעוֹ חִנָּם   <\/i>"]], "id": 1145}, {"k": "u", "a": "רי&quot;ו:", "l": [["", "אלמלא מקרא כתוב א&quot;א לאומרו, כאדם שמסיתין אותו וניסת."], ["", "<i class=\"am\">במתניתא תנא:<\/i> יורד ומתעה ועולה ומרגיז, נוטל רשות ונוטל נשמה."]], "id": 1147}, {"k": "u", "a": "•", "l": [["", "<i class=\"ps\">וַיַּעַן הַשָּׂטָן אֶת ה&#x27; &quot;וַיֹּאמַר עוֹר בְּעַד עוֹר&quot; וְכֹל אֲשֶׁר לָאִישׁ יִתֵּן בְּעַד נַפְשׁוֹ  <\/i>"], ["", "<i class=\"ps\">אוּלָם שְׁלַח נָא יָדְךָ&quot; וְגַע אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ אִם לֹא אֶל פָּנֶיךָ יְבָרְכֶךָּ  ויאמר ה<\/i>&#x27; <i class=\"ps\">אל השטן הִנּוֹ בְיָדֶךָ אַךְ את נפשו שמור, אוּלָם שְׁלַח נָא יָדְךָ&quot; וְגַע אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ אִם לֹא אֶל פָּנֶיךָ יְבָרְכֶךָּ וַיֵּצֵא הַשָּׂטָן מֵאֵת פְּנֵי&quot; יְהֹוָה וַיַּךְ אֶת אִיּוֹב וגו<\/i>&#x27;,"]], "id": 1150}, {"k": "u", "a": "רי&quot;צ:", "l": [["", "קשה צערו של שטן יותר משל איוב, משל לעבד שא&quot;ל רבו: שבור חבית ושמור את יינה."]], "id": 1153}, {"k": "u", "a": "ר&quot;ל:", "l": [["", "הוא שטן <i class=\"ps\">ד<\/i>&#x27;וַ<i class=\"ps\">יֵּצֵא הַשָּׂטָן מֵאֵת פְּנֵי וגו&#x27;<\/i>&#x27;. "], ["", "הוא יצה&quot;ר <i class=\"ps\">ד&#x27;רַק רַע כָּל הַיּוֹם<\/i>, והכא <i class=\"ps\">רַק אֵלָיו אַל תִּשְׁלַח יָדֶךָ <\/i>"], ["", "הוא מלאך המות, ד<i class=\"ps\">אַךְ אֶת נַפְשׁוֹ שְׁמֹר<\/i>, אלמא בדידיה קיימא."]], "id": 1155}, {"k": "u", "a": "ר לוי:", "l": [["", "שטן ופנינה לשם שמים נתכוונו. שטן, כיון דחזיא להקב&quot;ה דנטה דעתו אחר איוב, אמר: ח&quot;ו מינשי לרחמנותיה דאברהם."], ["", "פנינה <i class=\"am\">דכתיב:<\/i><i class=\"ps\"> <\/i>&#x27;וְ<i class=\"ps\">כִעֲסַתָּה צָרָתָהּ גַּם כַּעַס בַּעֲבוּר הַרְּעִמָהּ<\/i>&#x27;."], ["", "<i class=\"am\">דרשה ראב&quot;י<\/i> בפפוניא, בא שטן נשקו לרגליו."]], "id": 1159}, {"k": "u", "a": "רבא:", "l": [["", "<i class=\"ps\">בְּכָל זֹאת לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו<\/i> - בשפתיו לא חטא, בלבו חטא."], ["", "<i class=\"am\">והיינו <\/i><i class=\"ps\">ד<\/i>&#x27;אֶ<i class=\"ps\">רֶץ נִתְּנָה בְיַד רָשָׁע פְּנֵי שֹׁפְטֶיהָ יְכַסֶּה אִם לֹא אֵפוֹא מִי הוּא. <\/i>"]], "id": 1163}, {"k": "u", "a": "רבא:", "l": [["", "בקש איוב להפוך קערה על פיה. <i class=\"am\">א&quot;ל אביי: <\/i>לא דבר איוב אלא כנגד השטן."]], "id": 1166}, {"k": "u", "a": "כתנאי ר&quot;א:", "l": [["", "<i class=\"ps\">אֶרֶץ נִתְּנָה בְיַד רָשָׁע <\/i>בקש איוב להפוך קערה על פיה כבוד שחירף. "]], "id": 1168}, {"k": "u", "a": "<i class=\"am\">רי&quot;ה:<\/i>", "l": [["", "לא דבר איוב אלא כלפי שטן."]], "id": 1170}, {"k": "u", "a": "רבא:", "l": [["", "&#x27;עַ<i class=\"ps\">ל דַּעְתְּךָ כִּי לֹא אֶרְשָׁע וְאֵין מִיָּדְךָ מַצִּיל<\/i>&#x27; בקש איוב לפטור את כל העולם כולו מן הדין, <i class=\"am\">אמר לפניו:<\/i> רבונו של עולם, בראת שור פרסותיו סדוקות, בראת חמור פרסותיו קלוטות. בראת גן עדן, בראת גיהנם. בראת צדיקים, בראת רשעים, מי מעכב על ידך!"], ["", "<i class=\"am\">והשיבו לו חבריו<\/i><i class=\"ps\"> <\/i>&#x27;אַ<i class=\"ps\">ף אַתָּה תָּפֵר יִרְאָה וְתִגְרַע שִׂיחָה לִפְנֵי אֵל - ברא <\/i>הקב&quot;ה יצר הרע, ברא לו תורה תבלין&#x27;."]], "id": 1172}, {"k": "u", "a": "רבא ", "l": [["", "<i class=\"ps\">בִּרְכַּת אֹבֵד עָלַי תָּבֹא<\/i> גוזל שדה מיתומים ומשביחה ומחזירה להן."], ["", "<i class=\"ps\">וְלֵב אַלְמָנָה אַרְנִן<\/i> - דכל אלמנה שלא נשאוה נתן שמו עליה שישאוה"]], "id": 1175}, {"k": "u", "a": "רב:", "l": [["", "&#x27;<i class=\"ps\">לוּ שָׁקוֹל יִשָּׁקֵל כַּעְשִׂי וְהַוָּתִי בְּמֹאזְנַיִם יִשְׂאוּ יָחַד<\/i>&#x27; - עפרא לפומיה דאיוב, חברותא כלפי שמיא?<i class=\"ps\"> <\/i>"]], "id": 1178}, {"k": "u", "a": "רב:", "l": [["", "&#x27;<i class=\"ps\">לו יֵשׁ בֵּינֵינוּ מוֹכִיחַ יָשֵׁת יָדוֹ עַל שְׁנֵינוּ<\/i>&#x27; - עפרא לפומיה דאיוב, כלום יש עבד שמוכיח את רבו?"]], "id": 1180}, {"k": "u", "a": "רבא:", "l": [["", "&#x27;בְּ<i class=\"ps\">רִית כָּרַתִּי לְעֵינָי וּמָה אֶתְבּוֹנֵן עַל בְּתוּלָה<\/i>&#x27; - עפרא לפומיה דאיוב, איהו באחרניתא, אברהם אפילו בשלו לא הסתכל <i class=\"ps\">ד<\/i>&#x27;הִ<i class=\"ps\">נֵּה נָא יָדַעְתִּי כִּי אִשָּׁה יְפַת מַרְאֶה אָתְּ<\/i>&#x27; מכלל דמעיקרא לא ידע"]], "id": 1182}, {"k": "u", "a": "רבא:", "l": [["", "&#x27;כָּ<i class=\"ps\">לָה עָנָן וַיֵּלַךְ כֵּן יוֹרֵד שְׁאוֹל לֹא יַעֲלֶה<\/i>&#x27; - מכאן שכפר איוב בתחיית המתים."]], "id": 1184}, {"k": "u", "a": "רבה:", "l": [["", "&#x27;אֲ<i class=\"ps\">שֶׁר בִּשְׂעָרָה יְשׁוּפֵנִי וְהִרְבָּה פְצָעַי חִנָּם<\/i>&#x27; "], ["", "בסערה חרף, <i class=\"ps\">ד<\/i>&#x27;אֲ<i class=\"ps\">שֶׁר בִּשְׂעָרָה יְשׁוּפֵנִי<\/i>&#x27;, אמר לפניו: רבש&quot;ע שמא רוח סערה עברה לפניך ונתחלף לך בין איוב לאויב!"], ["", "בסערה השיבוהו- <i class=\"ps\">וַיַּעַן יְהֹוָה אֶת אִיּוֹב מִן הַסְּעָרָה וַיֹּאמַר אֱזָר נָא כְגֶבֶר חֲלָצֶיךָ וְאֶשְׁאָלְךָ וְהוֹדִיעֵנִי<\/i>,"]], "id": 1186}, {"k": "u", "a": "א&quot;ל:", "l": [["", "הרבה נימין בראתי באדם, וכל נימא ונימא בראתי לה גומא בפני עצמה, שלא יהו שתים יונקות מגומא אחת, שאלמלי שתים יונקות מגומא אחת - מחשיכות מאור עיניו של אדם,"], ["", "בין גומא לגומא לא נתחלף לי, בין איוב לאויב נתחלף לי?"]], "id": 1190}, {"k": "u", "a": "•", "l": [["", "<i class=\"ps\">מִי פִלַּג לַשֶּׁטֶף תְּעָלָה<\/i>&#x27; - הרבה טיפין בראתי בעבים, וכל טיפה וטיפה בראתי לה דפוס בפני עצמה, כדי שלא יהו שתי טיפין יוצאות מדפוס אחד, שאלמלי שתי טיפין יוצאות מדפוס אחד - מטשטשות את הארץ ואינה מוציאה פירות,"], ["", "בין טיפה לטיפה לא נתחלף לי, בין איוב לאויב נתחלף לי?"], ["", "תעלה לישנא דדפוס <i class=\"am\">כרב&quot;ש:<\/i> <i class=\"ps\">ד<\/i>&#x27;וַ<i class=\"ps\">יַּעַשׂ תְּעָלָה כְּבֵית סָאתַיִם זֶרַע<\/i>&#x27;."]], "id": 1193}, {"k": "u", "a": "•", "l": [["", "<i class=\"ps\">&#x27;וְדֶרֶךְ לַחֲזִיז קֹלוֹת<\/i> - הרבה קולות בראתי בעבים, וכל קול וקול בראתי לו שביל בפני עצמו, כדי שלא יהו שתי קולות יוצאות משביל אחד, שאלמלי שתי קולות יוצאות משביל אחד - מחריבין את כל העולם,"], ["", "בין קול לקול לא נתחלף לי, בין איוב לאויב נתחלף לי? ,"]], "id": 1197}]}, {"daf": "טז:", "perek": "פרק ראשון", "perekName": "השותפין", "units": [{"k": "u", "a": "•", "l": [["", "&#x27;הֲ<i class=\"ps\">יָדַעְתָּ עֵת לֶדֶת יַעֲלֵי סָלַע חֹלֵל אַיָּלוֹת תִּשְׁמֹר<\/i>&#x27; - יעלה זו אכזרית על בניה, בשעה שכורעת ללדת, עולה לראש ההר כדי שיפול ממנה וימות, ואני מזמין לה נשר שמקבלו בכנפיו ומניחו לפניה, ואלמלי מקדים רגע אחד או מתאחר רגע אחד מיד מת,"], ["", "בין רגע לרגע לא נתחלף לי, בין איוב לאויב נתחלף לי?"]], "id": 1201}, {"k": "u", "a": "•", "l": [["", "&#x27;ח<i class=\"ps\">וֹלֵל אַיָּלוֹת תִּשְׁמוֹר<\/i>&#x27; - אילה זו רחמה צר, בשעה שכורעת ללדת, אני מזמין לה דרקון שמכישה בבית הרחם ומתרפה ממולדה, ואלמלי מקדים רגע אחד או מאחר רגע אחד מיד מתה,"], ["", "בין רגע לרגע לא נתחלף לי, בין איוב לאויב נתחלף לי?"]], "id": 1204}, {"k": "u", "a": "רבא:", "l": [["", "<i class=\"ps\">אִיּוֹב לֹא בְּדַעַת יְדַבֵּר וּדְבָרָיו לֹא בְּהַשְׂכֵּל<\/i> מכאן שאין אדם נתפס בשעת צערו."]], "id": 1207}, {"k": "u", "a": "<i class=\"ps\">רב:<\/i>", "l": [["", "&#x27;ו<i class=\"ps\">יִּשְׁמְעוּ שְׁלֹשֶׁת רֵעֵי אִיּוֹב אֶת כָּל הָרָעָה הַזֹּאת הבאה עָלָיו ויבאו אִישׁ מִמְּקוֹמוֹ אֱלִיפָז הַתֵּימָנִי וּבִלְדָּד הַשּׁוּחִי וְצוֹפַר הַנַּעֲמָתִי וַיִּוָּעֲדוּ יַחְדָּו לָבוֹא לָנוּד לוֹ וּלְנַחֲמוֹ<\/i>&#x27; - שנכנסו כולן בשער אחד."], ["", "<i class=\"am\">ותנא: <\/i>בין כל אחד ואחד שלש מאות פרסי."], ["", "<i class=\"am\">א&quot;ד:<\/i> היה להם כתר ג&#x27; פרצופים <i class=\"am\">וא&quot;ד: <\/i>היה לכ&quot;א ג&#x27; אילנות וכשכמש ידעו "]], "id": 1209}, {"k": "u", "a": "רבא,", "l": [["", "<i class=\"am\">היינו דאמרי אינשי:<\/i> או חבר כחברי איוב, או מיתותא."]], "id": 1213}, {"k": "u", "a": "•", "l": [["", "&#x27;ו<i class=\"ps\">יְהִי כִּי הָחֵל הָאָדָם לָרוֹב עַל פְּנֵי הָאֲדָמָה וּבָנוֹת יֻלְּדוּ לָהֶם<\/i>&#x27;,"], ["", "<i class=\"am\">רי&quot;ו:<\ \"ps\">רבי<\/i>&#x27; זו תפלה<i class=\"ps\"> <\/i>&#x27;ק<i class=\"ps\">שתי<\/i>&#x27; זו בקשה."]], "id": 6192}, {"k": "u", "a": "הך ואומר&#x27;", "l": [["", "<i class=\"am\">לאו לריב&quot;ב אתא<\/i> <i class=\"ps\">ד&#x27;ובני ראובן בכור ישראל&#x27;<\/i> וגמרי&#x27; בכורה מבכורתו דהא<i class=\"ps\"> &#x27;והבכורה ליוסף&#x27;,<\/i>"], ["", "ויוסף גופיה פי שנים היה <i class=\"ps\">ד<\/i>&#x27;ו<i class=\"ps\">אני נתתי לך שכם אחד על אחיך<\/i>&#x27;."]], "id": 6194}, {"k": "u", "a": "ר&quot;פ לאביי ", "l": [["", "<i class=\"am\">אימא:<\/i> דקל בעלמא<i class=\"am\">. - א&quot;ל, עליך אמר קרא:<\/i> <i class=\"ps\">אפרים ומנשה כראובן ושמעון יהיו לי.<\/i>"]], "id": 6197}, {"k": "hatz", "a": "***", "l": [], "id": 6199}, {"k": "u", "a": "בעא ר&#x27; חלבו מרשב&quot;נ:", "l": [], "id": 6200}, {"k": "nose", "a": "מה ראה יעקב שנטל בכורה מראובן ונתנה ליוסף?", "l": [], "id": 6201}, {"k": "u", "a": "", "l": [["", "משל לבעה&quot;ב שגדל יתום בתוך ביתו, לימים העשיר אותו יתום ואמר: אהניהו לבעל הבית מנכסי. <i class=\"am\">א&quot;ל:<\/i> ואי לאו דחטא ראובן, לא מהני ליוסף ולא מדעם."]], "id": 6202}, {"k": "u", "a": "אלא", "l": [["", "<i class=\"am\">ר&#x27; יונתן רבך לא כך אמר:<\/i> ראויה היתה בכורה לצאת מרחל, <i class=\"ps\">ד<\/i>&#x27;א<i class=\"ps\">לה תולדות יעקב יוסף&#x27;<\/i>, אלא שקדמתה לאה ברחמים, ומתוך צניעות שהיתה ברחל החזירה הקב&quot;ה לה."]], "id": 6203}, {"k": "u", "a": "•", "l": [["", "קדמתה לאה ברחמים <i class=\"ps\">ד<\/i>&#x27;ו<i class=\"ps\">עיני לאה רכות<\/i>&#x27;, לא רכות ממש דבגנות בהמה טמאה לא דבר הכתוב אשר איננה טהורה בגנות צדיקים דיבר? <i class=\"am\">אלא ר&quot;א:<\/i> שמתנותיה ארוכות גדולות כהונה לויה ומלכות."]], "id": 6205}, {"k": "u", "a": "רב אמר:", "l": [["", "לעולם רכות ממש, ושבח הוא לה, שהיתה שומעת על פרשת דרכים בני אדם שהיו אומרים: שני בנים יש לרבקה, שתי בנות יש ללבן, גדולה לגדול וקטנה לקטן, <i class=\"am\">ומשאלת:<\/i> גדול מה מעשיו? איש רע הוא מלסטם בריות, קטן מה מעשיו?<i class=\"ps\"> <\/i>&#x27;א<i class=\"ps\">יש תם יושב אוהלים<\/i>&#x27;, והיתה   function toDaf(pi){const si=secOf(pi);if(si!==cur)render(si);
    setTimeout(()=>{const e=$('#d'+pi);if(e)toEl(e);$('#curdaf').textContent=D.pages[pi].daf;$('#dafsel').value=pi},20)}
  function goDaf(d){const now=+$('#dafsel').value||0;toDaf(Math.max(0,Math.min(D.pages.length-1,now+d)))}
  function goScreen(d){const f=$('#flow');
    if(f.classList.contains('vert'))f.scrollBy({top:d*f.clientHeight*.9,behavior:'smooth'});
    else f.scrollBy({left:-d*f.clientWidth,behavior:'smooth'})}
  function fs(d){const r=document.documentElement;
    const v=Math.max(12,Math.min(60,parseFloat(getComputedStyle(r).getPropertyValue('--fs'))+d));setFs(v)}
  function setFs(v){document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('lg-fs',v);sizeBtns(v)}
  function sizeBtns(v){document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',+b.dataset.fs===+v))}
  function vert(){const v=$('#flow').classList.toggle('vert');
    localStorage.setItem('lg-vert',v?'1':'');$('#vbtn').classList.toggle('on',v)}
  function panel(id){const p=$('#'+id),o=p.classList.contains('open');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(!o)p.classList.add('open')}
  function dec(s){return s.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&')}
  function txt(u){return dec(u.a.replace(/<[^>]+>/g,'')+' '+u.l.map(l=>l[1].replace(/<[^>]+>/g,'')).join(' '))}
  function search(q){q=q.trim();LASTQ=q;const out=$('#sres');if(q.length<2){out.innerHTML='';return}
   RES=[];let res=RES,n=0;D.pages.forEach((p,pi)=>{for(const u of p.units){const t=txt(u);const k=t.indexOf(q);if(k>-1){n++;if(res.length<120)res.push({pi,id:u.id,daf:p.daf,s:t.slice(Math.max(0,k-40),k+60)})}}});
   out.innerHTML=`<div class="n">${n} תוצאות</div>`+res.map((r,i)=>`<div class="res"><a onclick="jumpR(${i})"><small>${r.daf}</small> …${esc(r.s).replace(esc(q),'<mark>'+esc(q)+'</mark>')}…</a></div>`).join('');
   $('#search').classList.add('open')}
  let RES=[],LASTQ='';function jumpR(i){jump(RES[i].pi,RES[i].id,LASTQ)}
  function jump(pi,id,q){const si=secOf(pi);render(si,q);
    setTimeout(()=>{const e=$('#u'+id);if(e){e.classList.add('hit');toEl(e)}$('#dafsel').value=pi;$('#curdaf').textContent=D.pages[pi].daf},20)}
  function amq(i){$('#q').value=D.am[i][0];search(D.am[i][0])}
  function build(){
   const ds=$('#dafsel');D.pages.forEach((p,i)=>ds.add(new Option(p.daf,i)));ds.onchange=()=>toDaf(+ds.value);
   const ps=$('#peresel');SEC.forEach((s,i)=>ps.add(new Option((s.perek||'רצף')+(s.perekName?' · '+s.perekName:''),i)));ps.onchange=()=>render(+ps.value);
   let t='',lp=-1;for(const [pi,id,s] of D.toc){const si=secOf(pi);
     if(si!==lp){lp=si;t+=`<h3>${esc(SEC[si].perek||'')} ${esc(SEC[si].perekName||'')}</h3>`}
     t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft-=e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
