  /* היחס בין גודל האות לרוחב השורה נעול. כל המידות נמדדות ב-em של גוף הטקסט:

/i> אין הדבר כן, שהרי חבירו מלמד עליו: לריח שמניך טובים."]], "id": 1857}, {"k": "dh", "a": "<i class=\"b\">יין<\/i>", "l": [], "id": 1880}, {"k": "u", "a": "מרב&quot;א", "l": [["", " <i class=\"ps\">ד&#x27;אשר חלב זבחימו יאכלו ישתו יין נסיכם&#x27;,<\/i> מה זבח אסור בהנאה, אף יין אסור בהנאה."], ["", "זבח גופיה מ<i class=\"ps\">&#x27;ויצמדו לבעל פעור ויאכלו זבחי מתים<\/i>, מה מת אסור בהנאה, אף זבח נמי אסור בהנאה."], ["", "ומת גופיה- <i class=\"am\">אתיא<\/i><i class=\"ps\"> &#x27;שם שם&#x27; <\/i>מעגלה ערופה, <i class=\"am\">הכא:<\/i><i class=\"ps\"> &#x27;ותמת שם מרים&#x27;,<\/i> <i class=\"am\">והתם:<\/i> <i class=\"ps\">&#x27;וערפו שם את העגלה בנחל&#x27;,<\/i> מה להלן, אף כאן אסור בהנאה."], ["", "<i class=\"am\">והתם מדרבי ינאי:<\/i> <i class=\"ps\">&#x27;כפרה&#x27;+ <\/i>כתיב בה כקדשים."]], "id": 1881}, {"k": "dh", "a": "והחומץ של עובדי כוכבים שהיה מתחלתו יין.", "l": [], "id": 1886}, {"k": "u", "a": "ר&quot;א: ", "l": [["", "<i class=\"am\">הכי קמ&#x27;&#x27;ל -<\/i> חומץ שלנו ביד נכרי אין צריך חותם בתוך חותם,"], ["", "אי משום ניסוך – אינם מנסכים, ואי משום איחלופי - כיון דיש חותם לא טרח לזייף."]], "id": 1887}, {"k": "u", "a": "אר&quot;א שנינו: ", "l": [["", "יין מבושל של נכרים שהיה מתחלתו יין - אסור."]], "id": 1890}, {"k": "u", "a": "ר&quot;א: ", "l": [["", "<i class=\"am\">הכי קמ&quot;ל-<\/i> יין מבושל שלנו ביד גויים א&#x27;&#x27;צ חותם בתוך חותם,"], ["", "אי משום ניסוך אינם מנסכים, ואי משום איחלופי כיון דיש חותם אחד לא טרח ומזייף."]], "id": 1892}]}, {"daf": "ל.", "perek": "פרק שני", "perekName": "אין מעמידין", "units": [{"k": "u", "a": "", "l": [["", "<i class=\"b\">• ת&quot;ר<\/i>: יין מבושל ואלונתית של עובדי כוכבים - אסורין, אלונתית כברייתא - מותרת."], ["", "אלונתית- כדתניא גבי שבת: עושין אנומלין ואין עושין אלונתית, ואיזו היא אנומלין ואיזו היא אלונתית?"], ["", "אנומלין - יין ודבש ופלפלין, אלונתית - יין ישן ומים צלולין ואפרסמון, דעבדי לבי מסותא."], ["", "רבה ורב יוסף דאמרי תרוייהו: יין מזוג אין בו משום גילוי, יין מבושל אין בו משום ניסוך."], ["", "• <i class=\"b    let t='',lp=-1;for(const [pi,id,s] of D.toc){const si=secOf(pi);
     if(si!==lp){lp=si;t+=`<h3>${esc(SEC[si].perek||'')} ${esc(SEC[si].perekName||'')}</h3>`}
     t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft+=SGN*e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
