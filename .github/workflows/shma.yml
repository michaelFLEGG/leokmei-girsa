name: שמע ליד כל יחידה - קליטה, תמלול והתאמה
# פרומפט 83 (23.11.2026): כל הקלטה חדשה של שיעור על דף נכנסת לבד. מקורות: רשימת השיעורים
# של האתר (מסך "שיעורים"), data/shma/sources.json, ותיבת input/shma/. השמע נדחס ומתארח באתר
# (leokmei.com/audio, בגלל נטפרי), מתומלל בעברית, ומותאם ליחידות הדף. יחידה שההתאמה בה אינה
# ודאית מתחילה מתחילת הדף. הדחיפה של התוצאה מפעילה את הבנייה הרגילה (watch.yml).
on:
  schedule:
    - cron: '40 1 * * *'      # 03:40 שעון ישראל (חורף), אחרי הקיפול הלילי
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['input/shma/**', 'data/shma/sources.json', 'tools/shma.py']
permissions:
  contents: write
  actions: write
concurrency:
  group: shma
  cancel-in-progress: false
jobs:
  shma:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: כלים
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper yt-dlp
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: shma-model-v1
      - name: קליטה, תמלול והתאמה
        env: { PYTHONUNBUFFERED: '1' }
        run: python tools/shma.py all
      - name: שמירה
        id: save
        run: |
          git config user.name "leokmei-shma"
          git config user.email "shma@leokmei.com"
          mkdir -p audio data/shma && git add -A audio data/shma
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -q -m "שמע ליד כל יחידה: הקלטות חדשות והתאמה"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin main; then echo "pushed=1" >> $GITHUB_OUTPUT; exit 0; fi
            sleep $((i*15))
          done
          echo "הדחיפה נכשלה" && exit 1
      # דחיפה מתוך פעולה אינה מפעילה פעולה אחרת, ולכן הבנייה והפרסום מופעלים במפורש (כמו בקיפול)
      - name: בנייה ופרסום
        if: steps.save.outputs.pushed == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run watch.yml --ref main
