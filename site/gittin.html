  /* היחס בין גודל האות לרוחב השורה נעול. כל המידות נמדדות ב-em של גוף הטקסט:

 4888}, {"k": "u", "a": "לדם שבא מהפה:", "l": [["", "בודקים הדם בקש חיטה, אם נדבק בקש סימן שבא מהריאה ויש לו רפואה, ואי לא נדבק, סימן שמגיע מהכבד ואין לו רפואה,"]], "id": 4895}, {"k": "u", "a": "ר&quot;א לר&quot;א:", "l": [["", "והא תנן שיטול הכבד ולא נשתייר הימנה כלום,"], ["", "ולעומת זאת הריאה שניקבה או שחסרה כבר היא טריפה,"]], "id": 4897}, {"k": "u", "a": "ענהו רב אשי:", "l": [["", "כיון שמגיע מהפה אמרי&#x27; שכבד שתחת הריאה נימוח,"], ["", "אי מריאה בא יש לו תקנה שיביא שבעה מלא אגרופים חתיכות תרד ושבעה מלא אגרופים חתיחות כרישים, וחמשה מלא אגרופים פרידא [מין עשב], ושלושה מלא אגרופים עדשים, ומלא גרוף כמון, ומלא אגרוף חבלים, וכנגדן שומן מעיים של בהמה, שהייתה פטר רחם לאמה, ויבשלם ויאכל וישתה אחריו, שיכר חריף מתקופת טבת."]], "id": 4900}, {"k": "u", "a": "לחולי השיניים:", "l": [["", "פנימיים, יביא ראש שום שהיה בו רק צלע אחד וישחקהו בשמן ומלח, ויניחו על הצפורן של הבוהן בצד הכואב, ויקיף סביב השום מסגרת מלישת הבצק ויזהר שלא יגע השום בבשרו כיון שיכול להביא עליו צרעת,"]], "id": 4903}, {"k": "u", "a": "לאבעבועות:", "l": [["", "עם מוגלה יקח חומתי [שם עשב מחמם] כמו ממרו ושוש חומתי, עדיף ממרו ויאחזו בפיו והני חומתי וממרי הם טובים להעמיד החולי"], ["", "אבל כדי לבשל האבעבועות שיתנקזו ליחתם, יביא סובין גדולים שמרוב גדלם צפים למעלה כשמרדדים הקמח,  ועדשים עם העפר שנתלשו ממנו, ותלתן, ופרח הכישות, ויאחוז בפיו כשיעור אגוז מבלילה זו ויתרפא."], ["", "וכשירצה לבקוע האבעבועות יניח חבירו שחליים לבנות בתוך קש חיטה חלול, ויניח הקש בפי החולה בבית הבליעה, וינשוף חבירו בצידו השני של הקש, ויצאו השחליים ויפלו על האבעבועות"], ["", "וכשירצה להעלות בשר ע&quot;פ הביקוע לרפאותו, יקח עפר תחת צל האבנים המסודרות לבית הכסא, וילוש העפר בדבש ויאכלו שזה מועיל לו,"]], "id": 4905}, {"k": "u", "a": "לברסם:", "l": [["", "חולי הבא מהראש דרך החוטם יביא גלנט מידה מסם נישדור, וכגודל אגוז מחלבנה מתוקה, ומלא הכף דבש לבן, ומלא כלי שמחזיק רביעית דמחוזא ויין צלול יפה ולא אדום ויבשלם יחד וירפא, וכשהנישדור מבושל אות הוא שהכל מבושל."], ["", "<i class=\"am\">ואי לא יועיל <\/i>יביא רביעית חלב מעז לבנה ויטיף החלב על שלוש קלחי כ      if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
