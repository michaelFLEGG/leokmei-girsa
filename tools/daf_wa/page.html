<script>
/* התאריך העברי שבו נלמד הדף (תאריכים עבריים בלבד) */
(function(){try{var d=new Date('@@DATE@@T12:00:00'),f=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long'}).formatToParts(d),
day=0,mon='';f.forEach(function(p){if(p.type==='day')day=+p.value;if(p.type==='month')mon=p.value});
var L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']],t='',n=day;

t=t.length>1?t.slice(0,-1)+'"'+t.slice(-1):t+"'";mon=mon.replace(/^ב?/,'').replace('חשוון','חשון');
