  /* היחס בין גודל האות לרוחב השורה נעול. כל המידות נמדדות ב-em של גוף הטקסט:
     עמוד הספר הוא 60 מ"מ טקסט ב-11 נקודות, כלומר 15.46em, ורצועת הדף 5.15em.
     לכן הגדלה והקטנה משנות הכל יחד, ושבירת השורות אינה זזה לעולם. */
  :root{--fs:24px;--measure:15.46em;--rail:5.15em;--gut:2.57em;
        --ink:#1d1a16;--paper:#fbf8f1;--grey:#767171;--gold:#c9a24a;--red:#a83c2f;--bar:46px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e9e4d8;color:var(--ink);font-family:'Frank','Frank Ruhl Libre',serif;overflow:hidden}
  body.hc{--ink:#000;--paper:#fff;--grey:#333}
  .bar{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 12px;background:#2b2620;color:#f1ead9;font-size:14px;height:var(--bar)}
  .bar .nm{font-family:'Leukmey','Vilna',serif;font-size:20px;line-height:1}
  .bar .sp{flex:1}
  .bar button,.bar select,.bar input{font:inherit;background:#4a4137;color:#f1ead9;border:0;border-radius:4px;padding:3px 9px;cursor:pointer}
  .bar input{cursor:text;width:150px} .bar button.on{background:var(--gold);color:#2b2620}
  .nav{display:flex;gap:4px;align-items:center}
  .nav .daf{min-width:52px;text-align:center;font-family:'VilnaG','Vilna',serif;font-size:17px}
  .flow{font-size:var(--fs);line-height:1.06;height:calc(100vh - var(--bar));background:var(--paper);
        padding:.9em var(--gut);overflow:auto;
        column-width:calc(var(--rail) + var(--measure));column-gap:calc(var(--gut) * 2);
        column-fill:auto;column-rule:1px solid #e6ddc9}
  .flow.vert{column-width:auto;column-count:1;column-rule:0;
             width:calc(var(--rail) + var(--measure) + var(--gut) * 2);margin:0 auto}
  .row{display:grid;grid-template-columns:var(--rail) var(--measure);break-inside:avoid-column}
  .rail{text-align:left;padding-left:.36em}
  .main{text-align:justify;text-align-last:right}
  .main p{margin:0} .main p.sp{margin-top:.28em} .main p.nk{font-size:1.09em} .main p.hr{font-size:.82em;color:#4a4137}

  .mlabel{font-size:.55em;color:#8a7d66}
  .mishna{background:#eeeae1;padding:.08em .12em;margin:.12em 0;font-family:'Vilna',serif;font-weight:700;font-size:.82em;border-right:.1em solid var(--gold)}
  .dh{text-align:center;text-align-last:center;font-family:'Vilna',serif;font-weight:700;font-size:1.45em;margin:.14em 0 .05em}
  .nose{text-align:center;text-align-last:center;font-weight:700;font-size:.8em;letter-spacing:.03em;margin-top:.4em;color:#4a4137}
  .hatz{text-align:center;text-align-last:center;font-family:'Vilna',serif;font-weight:900;font-size:.82em;letter-spacing:.35em;color:#8a7d66;margin:.3em 0}
  .perek-num .main{font-family:'Franknatan','Vilna',serif;color:var(--red);font-size:1.45em;line-height:1.1}
  .perek-name .main{font-family:'Franknatan','Vilna',serif;color:#8a7d66;font-size:1.09em}
  .perek-range .main{color:var(--red);font-size:.73em}
  .perek-start .main{text-align:center;text-align-last:center;font-family:'Vilna',serif;font-weight:700;font-size:1.09em}
  .hadran .main{text-align:center;text-align-last:center;font-size:1.09em;margin:.8em 0}
  i{font-style:normal}
  .am{font-family:'Vilna',serif;font-weight:400;font-size:.72em}

  .panel .x{float:left;background:none;border:0;font-size:22px;cursor:pointer;color:#5a5044}
  .panel .n{color:#8a7d66;font-size:12px} .res{padding:5px 0;border-bottom:1px dotted #d9d1bd} .res small{color:#8a7d66}

    .dafmark{display:inline-block;margin-left:.5em}}

, "וי&quot;א: אף אין מכריזין על אבידתו."], ["", "ות&quot;ק - זמנין דנפיק ממנו זרעא מעליא ואכיל ליה, שנא&#x27;<i class=\"ps\"> &#x27;יכין וצדיק ילבש&#x27;.<\/i>"]], "id": 2765}, {"k": "hatz", "a": "***", "l": [], "id": 2793}, {"k": "u", "a": "", "l": [["", "וכן מי שיצא וכו&#x27;."], ["", "למימרא דרבי מאיר ס&quot;ל כביצה הוא דחשיב, ור&quot;י ס&quot;ל כזית נמי חשיב."], ["", "ורמינהי: עד כמה הן מזמנין - עד כזית, ולר&quot;י: עד כביצה."], ["", "א. רי&quot;ו: מוחלפת השיטה."], ["", "ב. אביי: לעולם לא תיפוך, שם בקראי פליגי, כאן בסברא פליגי."], ["", "שם בקראי פליגי, דר&quot;מ ס&quot;ל ואכלת זו אכילה ושבעת - זו שתיה, ואכילה בכזית."], ["", "ור&quot;י ס&quot;ל<i class=\"ps\"> &#x27;ואכלת ושבעת&#x27; <\/i>- אכילה שיש בה שביעה, ואיזו זו - בכביצה."], ["", "כאן בסברא פליגי. דר&quot;מ ס&quot;ל: חזרתו כטומאתו, מה טומאתו בכביצה - אף חזרתו בכביצה."], ["", "ור&quot;י ס&quot;ל: חזרתו כאיסורו, מה איסורו בכזית - אף חזרתו בכזית."], ["", "תניא, רבי נתן אומר: זה וזה כשתי ביצים, ולא הודו לו חכמים."]], "id": 2794}, {"k": "hatz", "a": "***", "l": [], "id": 2804}, {"k": "u", "a": "", "l": [["", "<i class=\"am\">• <\/i><i class=\"ps\">&#x27;והיה ביום ההוא לא יהיה אור יקרות וקפאון&#x27;.<\/i>"], ["", "יקרות וקפאון- ר&quot;א: זה אור, שיקר בעולם הזה, וקפוי [קל וצף] לעולם הבא."], ["", "רי&quot;ו: אלו נגעים ואהלות, שיקרין הן בעולם הזה וקפויין הן לעולם הבא."], ["", "וריב&quot;ל: אלו בני אדם, שיקרין הן בעולם הזה וקפויין הן לעולם הבא."], ["", "<i class=\"am\">• <\/i>כי הא דרב יוסף בריה דרבי יהושע בן לוי חלש ואיתנגיד. כי הדר, אמר ליה אבוה: מאי חזית? אמר ליה: עולם הפוך ראיתי, עליונים למטה ותחתונים למעלה."], ["", "א&quot;ל: בני, עולם ברור ראית. - ואנן היכי שם? - כי היכי דאיתו אנן כאן, הכי איתינן שם."], ["", "ושמעתי שהיו אומרים: אשרי מי שבא לכאן ותלמודו בידו."], ["", "ושמעתי שהיו אומרים: הרוגי מלכות אין אדם יכול לעמוד במחיצתן."], ["", "ולאו רבי עקיבא וחביריו - משום הרוגי מלכות ותו לא? - אלא: הרוגי לוד."], ["", "<i class=\"ps\">&#x27;ביום ההוא יהיה על מצלות הסוס קדש לה&#x27;.<\/i> &#x27;<i class=\"ps\">מצלות הס =\"ps\"> &#x27;והקטיר עליה חלבי השלמים&#x27; <\/i>עליה השלם כל הקרבנות כולן. והוא מפרק לה: כשנתותרו."], ["", "<i class=\"am\">• <\/i>ר&quot;ס לרב:<i class=\"ps\"> &#x27;לא ילין לבקר זבח חג הפסח&#x27; <\/i>הא כל הלילה ילין, והא<i class=\"ps\"> &#x27;עלת שבת בשבתו&#x27; <\/i>ולא עולת חול בשבת, או ביו&quot;ט."], ["", "וא&quot;ל דכאן בי&quot;ד שחל להיות בשבת דחלבי שבת קריבין ביו&quot;ט."], ["", "<i class=\"am\">• <\/i>ואין להקשות מהדוחק להעמיד הפסוק דווקא בי&quot;ד שחל בער&quot;ש דהפסוק עצמו מוקשה מהסתירה וא&quot;כ בהכרח שכך מיירי."]], "id": 3347}, {"k": "hatz", "a": "***", "l": [], "id": 3362}]}, {"daf": "נט.", "perek": "פרק חמישי", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "משנה."], ["", "הפסח ששחטו שלא לשמו, וקבל והלך וזרק שלא לשמו."], ["", "או לשמו ושלא לשמו, או שלא לשמו ולשמו - פסול."], ["", "לשמו ושלא לשמו- לשם פסח ולשם שלמים."], ["", "שלא לשמו ולשמו - לשם שלמים ולשם פסח."]], "id": 3364}, {"k": "hatz", "a": "***", "l": [], "id": 3369}]}, {"daf": "ס.", "perek": "פרק חמישי", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "<i class=\"am\">• <\/i>בעי ר&quot;פ: בעבודה אחת תנן או בשתי עבודות תנן."], ["", "בעבודה אחת תנן, ור&quot;י היא, דאף בגמר דבריו אדם נתפס. דלר&quot;מ תפוס לשון ראשון."], ["", "או&quot;ד בשתי עבודות תנן, ואף לר&quot;מ דתפוס לשון ראשון ה&quot;מ בעבודה אחת, אבל בשתי עבודות - מודה דמיפסיל."], ["", "בשלא לשמו ולשמו - בין בעבודה אחת בין בשתי עבודות, בין לר&quot;מ בין לר&quot;י איפסיל ליה מקמייתא."], ["", "דהא לרבי יוסי נמי אף בגמר דבריו אדם נתפס אית ליה."], ["", "אלא: אלשמו ושלא לשמו מאי."], ["", "אין להוכיח מהא דהפסח ששחטו שלא לשמו, וקבל והלך וזרק שלא לשמו."], ["", "והיינו דשחטו אף שלא לשמו או אף שחטו לשמו וקבל והלך וזרק שלא לשמו או רק זרק שלא לשמו דהו&quot;ל ב&#x27; עבודות."], ["", "ואהך אמרי בסיפא לשמו ושלא לשמו. ובעבודה אחת [דברישא מיירי כבר בשתי עבודות] ורבי יוסי היא, דאמר אף בגמר דבריו אדם נתפס."]], "id": 3371}, {"k": "hatz", "a": "***", "l": [], "id": 3380}, {"k": "u", "a": "", "l": [["", "ודחתה הגמ&#x27; דאפשר דגם בסיפא בשתי עבודות. ורישא קאי בשחיטה ומחשב בשחיטה."], ["", "א&quot;נ: קאי בזריקה ומחשב בזריקא."], ["", "סיפא: קאי בשחיטה וקחשיב בזריקה, דאמר: הריני שוחט את הפסח לשמו, לזרוק דמו שלא לשמו. וקמ&quot;ל דמחשבין מעבודה לעבודה, והיינו בעיא דרב פפא."]], "id": 3381}, {"k": "hatz", "a": "***", "l": [], "id": 3384}, {"k": "u", "a": "", "l": [["", "<i class=\"am\">• והך<\/i> דאו שלא לשמו ולשמו - פסול. והיינו בעבודה אחת, [דאי בשתי עבודות כ&quot;ש מלשמו ולא לשמו]"], ["", "ומדסיפא בעבודה אחת - רישא נמי בעבודה אחת."], ["", "דלעולם בשתי עבודות. ואמרי&#x27; הך איידי דתנא לשמו ושלא לשמו תנא נמי שלא לשמו ולשמו."], ["", "<i class=\"am\">• והך<\/i> דשחטו שלא לאוכליו ושלא למנויו, לערלים ולטמאין - פסול. ומיירי בעבודה אחת."], ["", "אין לומר דגם רישא בעבודה אחת."], ["", "דהא כדאיתא והא כדאיתא סיפא - בעבודה אחת, רישא אי בעבודה אחת אי בשתי עבודות."], ["", "<i class=\"am\">• והך<\/i> דלאוכליו ושלא לאוכליו - כשר. אין להוכיח מהא דמיירי בעבודה אחת [דאין מחשבת אוכליו בזריקה הא בשחיטה דמהניא ביה מחשבת אוכלין פסול ולא כדקיימ&quot;ל דמקת אוכלין לא פסלא] ורישא נמי בעבודה אחת."], ["", "דאפשר דהא כדאיתא ורישא אי בעבודה אחת או אף בשתי עבודות."]], "id": 3385}, {"k": "hatz", "a": "***", "l": [], "id": 3393}]}, {"daf": "ס:", "perek": "פרק חמישי", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "<i class=\"am\">• <\/i>איבעיא להו: פסח ששחטו בשאר ימות השנה לשמו ושלא לשמו, "], ["", "מי אתי שלא לשמו ומפיק ליה מלשמו ומכשיר ליה, או לא."], ["", "רב דימי: מה לשמו המכשירו בזמנו, אין מוציאו מידי שלא לשמו אף שלא לשמו המכשירו שלא בזמנו אין מוציאו מידי לשמו ופסול."], ["", "א&quot;ל רב ירמיה דווקא בשלא לשמו שכן נוהג בכל הזבחים, תאמר בלשמו - שכן אינו נוהג בכל הזבחים אלא בפסח בלבד."], ["", "רבא: פסח ששחטו בשאר ימות השנה לשמו ושלא לשמו כשר, דהא סתמו לשמו קאי."], ["", "ואפ&quot;ה, כי שחיט ליה שלא לשמו כשר."], ["", "והיינו דאתי שלא לשמו ומפיק ליה מידי לשמו. וה&quot;נ שלא לשמו מפיק מלשמו."], ["", "א&quot;ל ראב&quot;א דיש לחלק היכא שאמר ללא אמר."], ["", "וענהו רבא דשם כל דלא עקר ליה בשחיטה סתמיה נו זבים וזבות נדות ויולדות, ואם אכלו פטורין."], ["", "ד. אלא אמר אביי: לעולם מקרא קמא."], ["", "<i class=\"am\">והך<\/i> דאיש איש כי יהיה טמא לנפש [?] - איש נדחה לפסח שני, ואין ציבור נדחה לפסח שני, אלא עבדי בטומאה ודווקא בטמא מת ולא בשאר טומאות."]], "id": 3664}, {"k": "hatz", "a": "***", "l": [], "id": 3676}]}, {"daf": "סז.", "perek": "סה:- כג:", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "ר&quot;ח: מצורע שנכנס לפנים ממחיצתו - פטור,<i class=\"ps\"> &#x27;בדד ישב מחוץ למחנה מושבו&#x27;.<\/i>"], ["", "<i class=\"ps\">&#x27;בדד ישב&#x27; <\/i>- לבדו ישב,<i class=\"ps\"> &#x27;מחוץ למחנה מושבו&#x27; <\/i>- הכתוב נתקו לעשה."], ["", "<i class=\"am\">והך<\/i> דחזי&#x27;:מצורע שנכנס לפנים ממחיצתו - בארבעים."], ["", "זבין וזבות שנכנסו לפנים ממחיצתן - בארבעים."], ["", "וטמא מת מותר ליכנס למחנה לויה. ואף מת עצמו."], ["", "<i class=\"ps\">ד&#x27;ויקח משה את עצמות יוסף עמו&#x27;<\/i>, עמו - במחיצתו."], ["", "- תנאי היא."], ["", "דתניא: <i class=\"ps\">&#x27;בדד ישב&#x27;<\/i> - לבדו ישב, שלא יהו טמאין אחרים יושבין עמו."], ["", "ולא יטמאו את מחניהם."], ["", "לר&quot;י: ליתן מחנה לזה ומחנה לזה שלא יהו זבין וטמאי מתים משתלחין למחנה אחת."], ["", "לר&quot;ש: א&quot;צ <i class=\"ps\">ד&#x27;וישלחו מן המחנה כל צרוע וכל זב וכל טמא לנפש<\/i>, [ולא ילפי כ&quot;ש ד-]"], ["", "<i class=\"ps\">&#x27;זב&#x27; <\/i>- ליתן לו מחנה שניה."], ["", "<i class=\"ps\">&#x27;מצורע&#x27; <\/i>- ליתן לו מחנה שלישית. כשהוא אומר<i class=\"ps\"> &#x27;בדד ישב&#x27; <\/i>- הכתוב נתקו לעשה."], ["", "חומריה דזב מטמא מת - שכן טומאה יוצאה עליו מגופו."], ["", "<i class=\"am\">והך<\/i> דטמא מת חמור שטעון הזאה שלישי ושביעי אמר קרא<i class=\"ps\"> &#x27;וכל טמא&#x27; <\/i>לרבות טמא שרץ."], ["", "וזב חמור מטמא שרץ. כדאמרן."], ["", "ואף דשרץ חמור מטמא באונס גם זב מטמא באונס כדר&quot;ה דראיה ראשונה של זב מטמאה באונס."], ["", "חומריה דמצורע מזב - שכן טעון פריעה ופרימה ואסור בתשמיש המטה."], ["", "<i class=\"am\">והך<\/i> דזב מטמא משכב ומושב, ומטמא כלי חרס בהיסט<i class=\"ps\"> &#x27;וכל זב&#x27; <\/i>- לרבות בעל קרי."], ["", "ומצורע חמור מבעל קרי וחומריה - כדאמרן."], ["", "ובעל קרי אף שמטמא במשהו כאן בזב ס&quot;ל כר&quot;נ דזב צריך כחתימת פי האמה. ולא הודו לו חכמים. ואיתקש ליה בעל קרי לזב."], ["", "<i class=\"am\">והך<\/i><i class=\"ps\"> &#x27;וכל צרוע&#x27; <\/i>- איידי ד&#x27;כל זב כתיב נמי כל צרוע."], ["", "ולר&quot;י הך קרא דר&quot;ש בעי לר&quot;א דאף דחקו זבין ומצורעין ונכנסו לעזרה בפסח הבא בטומאה לא חייבין <i class=\"ps\">ד&#x27;וישלחו מן המחנה כל צרוע וכל זב וכל טמא לנפש&#x27;.<\/i>"], ["", "בשעה שטמאי מתים משתלחין - זבין ומצורעין משתלחין."], ["", "אין טמאי מתים משתלחין - אין זבין ומצורעין משתלחין."]], "id": 3678}, {"k": "hatz", "a": "***", "l": [], "id": 3703}]}, {"daf": "סח.", "perek": "סה:- כג:", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "<i class=\"ps\">&#x27;זב&#x27; <\/i>וכל זב - לרבות בעל קרי."], ["", "מסייע לרי&quot;ו דמחילות לא נתקדשו, ובעל קרי משתלח חוץ לשתי מחנות."], ["", "<i class=\"am\">והך<\/i> דבעל קרי כמגע שרץ לאו למחנותם אלא לטומאתם [טומאת ערב כתיב ביה] וקמ&quot;ל דמטמא באונס."], ["", "<i class=\"am\">• והך<\/i> דסיפא דבועל נדה כטמא מת. והיינו למחנותם אין לדייק ה&quot;נ סיפא, דסיפא לטומאם."], ["", "<i class=\"am\">• והך<\/i> מצורע חמור מזב, וזב חמור מטמא מת, יצא בעל קרי שטמא מת חמור ממנו."], ["", "הך יצא היינו יצא ממחנה טמא מת ונכנס למחנה זב."], ["", "<i class=\"am\">• <\/i>ואף דטמא מת חמור ממנו, ומותר במחנה לויה - למאי דדמי ליה מדמינן ליה."], ["", "ת&quot;ק דריצב&quot;א: מחוץ למחנה - זו מחנה לויה, לא יבא אל תוך המחנה - זו מחנה שכינה. המחנה- ליתן לו מחנה אחרת."]], "id": 3705}, {"k": "hatz", "a": "***", "l": [], "id": 3713}, {"k": "u", "a": "", "l": [["", "<i class=\"b\">ומיחוי קרביו וכו&#x27;.<\/i>"], ["", "מיחוי קרביו ר&quot;ה: שמנקבן בסכין [שהפרש יצא]"], ["", "רחב&quot;ר: שירקא דמעייא [ליחה] דיוצא אגב דוחקא דסכינא."], ["", "<i class=\"am\">• <\/i>אר&quot;א טעמא דחב&quot;ר –<i class=\"ps\"> &#x27;וחרבות מחים גרים יאכלו&#x27;.<\/i> כדמתרגם רב יוסף: נכסי רשעים ירשו הצדיקים."], ["", "ורעו כבשים כדברם, רב: כמדובר בם. - וחרבות מחים גרים יאכלו."], ["", "רבא: כתיב<i class=\"ps\"> &#x27;וחרבות ולא חרבות&#x27; <\/i>כדר&quot;ח מרב עתידין צדיקים שיחיו את המתים, כתיב כאן<i class=\"ps\"> &#x27;ורעו כבשים כדברם&#x27; <\/i>וכתיב שם<i class=\"ps\"> &#x27;ירעו בשן וגלעד כימי עולם&#x27;.<\/i>"], ["", "<i class=\"ps\">&#x27;בשן&#x27; <\/i>- זה אלישע הבא מן הבשן, שנא&#x27;<i class=\"ps\"> &#x27;ויעני ושפט בבשן&#x27; <\/i>וכתיב<i class=\"ps\"> &#x27;פה אלישע בן שפט אשר יצק מים על ידי אליהו&#x27;.<\/i>"], ["", "<i class=\"ps\">&#x27;גלעד&#x27; <\/i>זה אליהו, שנא&#x27;<i class=\"ps\"> &#x27;ויאמר אליהו התשבי מתושבי גלעד וגו&#x27;.<\/i>"], ["", "רשב&quot;נ מרי&quot;ונ: עתידים צדיקים שיחיו מתים,"], ["", "שנאמר<i class=\"ps\"> &#x27;עד ישבו זקנים וזקנות ברחבות ירושלים ואיש משענתו בידו מרב ימים&#x27;,<\/i> וכתיב<i class=\"ps\"> &#x27;ושמת משענתי על פני הנער&#x27;.<\/i>"]], "id": 3714}, {"k": "hatz", "a": "***", "l": [], "id": 3724}, {"k": "u", "a": "", "l": [["", "עולא: <i class=\"ps\">&#x27;בלע המות לנצח<\/i> בישראל, <i class=\"am\">והך<\/i> <i class=\"ps\">דכי הנער בן מאה שנה ימות<\/i>- בנכרים."], ["", "ונכרים - <i class=\"ps\">ועמדו זרים ורעו צאנכם ובני נכר <\/i>אכריכם וכרמיכם."], ["", "ר&quot;ח: כתיב<i class=\"ps\"> &#x27;וחפרה הלבנה ובושה החמה&#x27; <\/i>וכתיב<i class=\"ps\"> &#x27;והיה אור הלבנה כאור החמה&#x27; <\/i>–לעוה&quot;ב."], ["", "<i class=\"ps\">&#x27;ואור החמה יהיה שבעתים כאור שבעת הימים&#x27;<\/i> - לימות המשיח."], ["", "ולשמואל, דאמר: אין בין העולם הזה לימות המשיח אלא שיעבוד מלכיות בלבד."], ["", "אידי ואידי לעולם הבא, ולא קשיא: כאן במחנה שכינה, כאן במחנה צדיקים."], ["", "רבא:<i class=\"ps\"> &#x27;אני אמית ואחיה&#x27; <\/i>וכתיב<i class=\"ps\"> &#x27;מחצתי ואני ארפא&#x27;,<\/i>- מה שאני ממית אני מחיה, כמו שמחצתי ואני ארפא."], ["", "<i class=\"am\">• <\/i>ת&quot;ר:<i class=\"ps\"> &#x27;אני אמית ואחיה&#x27; <\/i>יכול מיתה באחד וחיים באחד כדרך שהעולם נוהג."], ["", "- ת&quot;ל<i class=\"ps\"> &#x27;מחצתי ואני ארפא&#x27; <\/i>מה מכה ורפואה באחד - אף מיתה וחיים באחד."], ["", "מכ 7;.<\/i>"], ["", "<i class=\"am\">• <\/i>אריא&quot;ר: הלכה כר&quot;ע."], ["", "ותנן נמי גבי מילה כה&quot;ג דכלל אר&quot;ע: כל מלאכה שאפשר לעשותה מער&quot;ש אינה דוחה את השבת."], ["", "מילה, שאי אפשר לעשותה מער&quot;ש- דוחה את השבת."], ["", "וצריכא, בפסח אף דלא נכרתו עליה י&quot;ג בריתות."], ["", "ומילה אף דליכא כרת."]], "id": 3808}, {"k": "hatz", "a": "***", "l": [], "id": 3814}, {"k": "u", "a": "", "l": [["", "משנה."], ["", "אימתי מביא חגיגה עמו - בזמן שהוא בא בחול, בטהרה, ובמועט."], ["", "ובזמן שהוא בא בשבת, במרובה, ובטומאה - אין מביאין עמו חגיגה."]], "id": 3815}, {"k": "m", "a": "", "l": [["", "<i class=\"b\">חגיגה היתה באה מן הצאן, מן הבקר, מן הכבשים ומן העזים, מן הזכרים ומן הנקבות, ונאכלת לשני ימים ולילה אחד.<\/i>"]], "id": 3818}, {"k": "hatz", "a": "***", "l": [], "id": 3819}, {"k": "u", "a": "", "l": [["", "חגיגה? דתנא הרכבתו והבאתו דלא דחי שבת וקתני נמי חגיגה דלא דחיא שבת."], ["", "וה&quot;ק אימתי מביאין עמו חגיגה - בזמן שהוא בא בחול בטהרה ובמועט."]], "id": 3820}]}, {"daf": "ע.", "perek": "סה:- כג:", "perekName": "ת+מיד+ נשחט", "units": [{"k": "u", "a": "", "l": [["", "<i class=\"am\">• <\/i>אר&quot;א: ש&quot;מ: חגיגת י&quot;ד לאו חובה היא, דאי ס&quot;ד חובה היא תיתי בשבת, ותיתי במרובה, ותיתי בטומאה."], ["", "ובמועט אתיא כדתניא: חגיגה הבאה עם הפסח נאכלת תחילה, כדי שיהא פסח נאכל על השבע."]], "id": 3823}, {"k": "hatz", "a": "***", "l": [], "id": 3825}, {"k": "u", "a": "", "l": [["", "<i class=\"b\">ונאכלת לשני ימים וכו&#x27;.<\/i>"], ["", "מתניתין דלא כבן תימא. דס&quot;ל חגיגה הבאה עם הפסח הרי היא כפסח, ואינה נאכלת אלא ליום ולילה."], ["", "וחגיגת ט&quot;ו נאכלת לשני ימים ולילה אחד."], ["", "וחגיגת י&quot;ד יוצא בה משום שמחה, ואין יוצא בה משום חגיגה."], ["", "וטעמיה דב&quot;ת? כדמתני רב לחייא בריה: ולא ילין לבקר זבח חג הפסח."], ["", "זבח חג - זה חגיגה, הפסח - כמשמעו. ואמר רחמנא לא ילין."], ["", "איבעיא: לבן תימא, נאכלת צלי או לא- כי אקשיה רחמנא לפסח ללינה, אבל לא לצלי, או&quot;ד ל&quot;ש."], ["", "ומהא דאר&quot;ח זו דברי בן תימא ש&quot;מ."], ["", "חגיגה הבאה עם ot;ח כזית פסח והלל היה נדמה כאילו פקע הגג – היינו דאכלו בקרקע ואמרו הלל בגג."], ["", "<i class=\"am\">והך<\/i> דאין מפטירין אחר הפסח אפיקומן, וא&quot;ר: שלא יעקרו מחבורה לחבורה."], ["", "- ל&quot;ק דכאן - בשעת אכילה, כאן - שלא בשעת אכילה."], ["", "ת&quot;ש: אבא שאול עליית בית קדשי הקדשים חמורה מבית קדשי הקדשים, "], ["", "שבית קדשי הקדשים כהן גדול נכנס לו פעם אחת בשנה, "], ["", "ועליית בית קדשי הקדשים אין נכנסין לה אלא פעם אחת בשבוע, "], ["", "ואמרי לה: פעמים בשבוע, ואמרי לה: פעם אחת ביובל, לידע מה היא צריכה."], ["", "רב יוסף: אין להקשות מהיכל על שאר גגות דשאני היכל, <i class=\"ps\">ד&#x27;ויתן דויד לשלמה בנו את תבנית האולם ואת בתיו ואת גנזכיו ועליותיו וחדריו הפנימים ובית הכפורת&#x27;,<\/i> "], ["", "וכתיב<i class=\"ps\"> &#x27;הכל בכתב מיד ה&#x27; עלי השכיל&#x27;.<\/i>"], ["", "<i class=\"am\">והך<\/i> דהלשכות הבנויות בקודש ופתוחות לחול -תוכן חול וגגותיהן קודש"], ["", "מיירי בשגגותיהן שוין לקרקע עזרה."], ["", "<i class=\"am\">והך<\/i> דסיפא דבנויות בחול ופתוחות לקודש - תוכן קודש וגגותיהן חול."], ["", "- אף דגגותיהן שווין לעזרה וממילא הוויא מחילות."], ["", "הך דלרי&quot;ו: לא נתקדשו דווקא בפתוחות להר הבית אבל מחילות הפתוחות לעזרה נתקדשו."], ["", "<i class=\"am\">והך<\/i> דר&quot;י: דמחילות שתחת ההיכל - חול ההיא - שפתוחות לחול."], ["", "<i class=\"am\">והך<\/i> <i class=\"ps\">דוגגו קודש<\/i>. לשתי אמות ד&#x27;גגין הללו אין אוכלין שם קדשי קדשים, ואין שוחטין שם קדשים קלים&#x27;."], ["", "הך דב&#x27; אמות היה בשושן הבירה, אחת על קרן מזרחית צפונית ואחת על קרן מזרחית דרומית."], ["", "זו שעל קרן מזרחית צפונית היתה יתירה על של משה חצי אצבע."], ["", "וזו שעל קרן מזרחית דרומית היתה יתירה עליה חצי אצבע, נמצאת יתירה על של משה אצבע."], ["", "אחת גדולה ואחת קטנה שיהיו האומנין נוטלין בקטנה ומחזירין בגדולה, כדי שלא יבואו לידי מעילה."], ["", "תרתי - אחת לכסף וזהב [של חצי אצבע], ואחת לבנין [זו של אצבע]"], ["", "תנן: החלונות ועובי החומה - כלפנים."], ["", "\tהחלונות - דשויה לקרקע עזרה."], ["", "\tעובי החומה משכח&quot;ל בחומה קטנה<i class=\"ps\"> &#x27;ויאבל חל וחומה&#x27;.<\/i> כר&quot;ח שורא ובר שורא."]], "id": 4682}, {"k": "hatz", "a": "***", "l": [], "id": 4708}, {"k": "u", "a": "", "l": [["", "משנה."], ["", "שתי חבורות שהיו אוכלין בבית אחד - אלו הופכין את פניהם הילך ואוכלין, ואלו הופכין את פניהם הילך ואוכלין, והמיחם באמצע."], ["", "כשהשמש עומד למזוג - קופץ את פיו ומחזיר את פניו עד שמגיע אצל חבורתו ואוכל."], ["", "והכלה הופכת את פניה ואוכלת."]], "id": 4709}, {"k": "hatz", "a": "***", "l": [], "id": 4713}]}, {"daf": "פו:", "perek": "פרק שמיני", "perekName": "כיצד+ צול+ין", "units": [{"k": "u", "a": "", "l": [["", "מתני&#x27; ר&quot;י היא דתניא:<i class=\"ps\"> &#x27;על הבתים אשר יאכלו אתו בהם&#x27; <\/i>- מלמד שהפסח נאכל בשתי חבורות."], ["", "<i class=\"ps\">&#x27;בבית אחד יאכל&#x27; <\/i>ולא בשתי מקומות."], ["", "מכאן אמרו: השמש שאכל כזית בצד התנור, אי פקח הוא - ממלא כריסו ממנו."], ["", "ואם רצו בני חבורה לעשות עמו טובה - באין ויושבין בצדו."], ["", "ר&quot;ש:<i class=\"ps\">&#x27;על הבתים אשר יאכלו אתו בהם&#x27;<\/i>- שאוכל בשתי מקומות,<i class=\"ps\"> &#x27;בבית אחד יאכל&#x27; <\/i>ולא בב&#x27; חבורות."], ["", "וחלקו דלר&quot;י: יש אם למסורת, ורבי שמעון סבר: יש אם למקרא."], ["", "היו יושבין ונפרסה מחיצה ביניהם, לדברי האומר פסח נאכל בשתי חבורות - אוכלין."], ["", "לדברי האומר אין הפסח נאכל בשתי חבורות - אין אוכלין."], ["", "היו יושבין ונסתלקה מחיצה ביניהן, לדברי האומר האוכל אוכל בשני מקומות - אוכלין."], ["", "לדברי האומר אין האוכל אוכל בשני מקומות - אין אוכלין."], ["", "יתיב רב כהנא ופשיט ליה מפשט."], ["", "א&quot;ל ר&quot;א לר&quot;כ דתביעי<i class=\"ps\"> &#x27;סילוק מחיצה ועשיית מחיצה&#x27;,<\/i> מי הוי כב&#x27; מקומות וב&#x27; חבורות דמי או לא? - תיקו."]], "id": 4715}, {"k": "hatz", "a": "***", "l": [], "id": 4727}, {"k": "u", "a": "", "l": [["", "הכלה הופכת את פניה וכו&#x27;."], ["", "וטעמא – רי&quot;ו: מפני שהיא בושה."], ["", "<i class=\"am\">• <\/i>רהב&quot;נ נקלע לבית רנב&quot;י ושאלו לשמו א&quot;ל ר&quot;ה, אמרו שישב על המיטה וישב."], ["", "הביאו לו כוס הסכים באחת, ושתה בשני לגימות, ולא החזיר פניו."], ["", "א&quot;ל מה הטעם קרית לך רב כה."], ["", "אמר לו הקב&quot;ה להושע: בניך חטאו."], ["", "והיה לו לומר: בניך הם, בני חנוניך הם, בני אברהם יצחק ויעקב, גלגל רחמיך עליהן."], ["", "לא דיו שלא אמר כך, אלא אמר לפניו: רבש&quot;ע, כל העולם שלך הוא - העבירם באומה אחרת."], ["", "אמר הקב&quot;ה: מה אעשה לזקן זה? "], ["", "אומר לו: לך וקח אשה זונה והוליד לך בנים זנונים, ואחר כך אומר לו שלחה מעל פניך."], ["", "אם הוא יכול לשלוח - אף אני אשלח את ישראל."], ["", "<i class=\"ps\">&#x27;ויאמר ה&#x27; אל הושע לך קח לך אשת זנונים וילדי זנונים&#x27;,<\/i> וכתיב<i class=\"ps\"> &#x27;וילך ויקח את גמר בת דבלים&#x27;.<\/i>"], ["", "<i class=\"ps\">&#x27;גמר&#x27;<\/i>-רב: שהכל גומרים בה."], ["", "<i class=\"ps\">&#x27;בת דבלים&#x27; <\/i>- דבה רעה בת דבה רעה."], ["", "\tושמואל אמר: שמתוקה בפי הכל כדבלה."], ["", "\tורבי יוחנן אמר: שהכל דשין בה כדבלה."], ["", "\tד&quot;א: גמר – אר&quot;י: שבקשו לגמר ממונן של ישראל בימיה."], ["", "\tרי&quot;ו: בזזו וגמרו,<i class=\"ps\"> &#x27;כי אבדם מלך ארם וישמם כעפר לדש&#x27;.<\/i>"], ["", "&#x27;ותהר ותלד לו בן ויאמר ה&#x27; אליו קרא שמו יזרעאל כי עוד מעט ופקדתי את דמי יזרעאל על בית יהוא והשבתי ממלכות בית ישראל, ותהר עוד ותלד בת ויאמר לו קרא שמה לא רחמה כי לא אוסיף עוד ארחם את בית ישראל כי נשא אשא להם, ותהר ותלד בן ויאמר קרא שמו לא עמי כי אתם לא עמי ואנכי לא אהיה לכם&#x27;."], ["", "לאחר שנולדו לו שני בנים ובת אחת אמר לו הקב&quot;ה שילמד ממשה רבך, שכיון שדברתי עמו פירש מן האשה, אף אתה בדול עצמך ממנה."], ["", "אמר לו: רבונו של עולם, יש לי בנים ממנה ואין אני יכול להוציאה ולא לגרשה."], ["", "א&quot;ל הקב&quot;ה: ומה אתה, שאשתך זונה ובניך בני זנונים, ואי אתה יודע אם שלך אם של אחרים הן."], ["", "כך ישראל, שהן בני, בני בחוני, בני אברהם יצחק ויעקב, אחד מארבעה קנינין שקניתי בעולמי."], ["", "תורה קנין אחד, <i class=\"ps\">ד&#x27;ה&#x27; קנני ראשית דרכו&#x27;<\/i>."], ["", "שמים וארץ קנין אחד, <i class=\"ps\">ד&#x27;קנה שמים וארץ.<\/i>"], ["", "בית המקדש קנין אחד, <i class=\"ps\">ד&#x27;הר זה קנתה ימינו&#x27;.<\/i>"], ["", "ישראל קנין אחד, <i class=\"ps\">ד&#x27;עם זו קנית&#x27;.<\/i>"], ["", "ו   function secOf(pi){for(let i=0;i<SEC.length;i++)if(pi>=SEC[i].from&&pi<=SEC[i].to)return i;return 0}
  let cur=0;

  /* כיוון הגלילה בטורים מימין לשמאל אינו זהה בכל הדפדפנים, ולכן הוא נמדד ולא מנוחש */
  let SGN=-1;
  (function(){const t=document.createElement('div');t.style.cssText='position:absolute;top:-999px;width:60px;height:10px;overflow:auto;direction:rtl';
    t.innerHTML='<div style="width:300px;height:4px"></div>';document.body.appendChild(t);t.scrollLeft=2;SGN=t.scrollLeft>0?1:-1;t.remove()})();

  /* scrollIntoView אינו גולל מכולת-טורים, ולכן המיקום מחושב במידות פיזיות:
     מיישרים את קצה האלמנט לקצה הימני של המסגרת. הנוסחה נכונה בשני מוסכמות ה-RTL. */
  function toEl(e){const f=$('#flow');
    if(f.classList.contains('vert')){e.scrollIntoView({block:'center'});return}
    f.scrollLeft += e.getBoundingClientRect().right - f.getBoundingClientRect().right;}
  function unitHTML(u,daf,pi){
    const mk=daf!=null?`<b class="dafmark" id="d${pi}">${esc(daf)}</b>`:'';
    if(u.k==='u')return `<div class="row u" id="u${u.id}"><div class="rail">${mk}<span class="anchor">${u.a}</span></div><div class="main">${u.l.map(l=>`<p class="${l[0]}">${l[1]}</p>`).join('')}</div></div>`;
    if(u.k==='m')return `<div class="row" id="u${u.id}"><div class="rail">${mk}<span class="mlabel">משנה</span></div><div class="main mishna">${u.l.map(l=>`<p>${l[1]}</p>`).join('')}</div></div>`;
    if(u.k==='hatz')return `<div class="row" id="u${u.id}"><div class="rail">${mk}</div><div class="main hatz">* * *</div></div>`;
    return `<div class="row ${u.k}" id="u${u.id}"><div class="rail">${mk}</div><div class="main ${u.k==='dh'||u.k==='nose'?u.k:''}">${u.a}</div></div>`;
  }
  function render(si,q){
    cur=Math.max(0,Math.min(SEC.length-1,si));const s=SEC[cur];let h='';
    for(let pi=s.from;pi<=s.to;pi++){const p=D.pages[pi];
      if(!p.units.length){h+=`<div class="row"><div class="rail"><b class="dafmark" id="d${pi}">${esc(p.daf)}</b></div><div class="main"></div></div>`;continue}
      let first=true;
      for(const u of p.units){h+=unitHTML(u,first?p.daf:null,first?pi:null);first=false}}
    const f=$('#flow');f.innerHTML=q?hl(h,esc(q).replace(/"/g,'&quot;').replace(/'/g,'&#x27;')):h;
    f.scrollTop=0;f.scrollLeft=SGN>0?f.scrollWidth:0;
    $('#peresel').value=cur;$('#curdaf').textContent=D.pages[s.from].daf;$('#dafsel').value=s.from;
    document.title=`לאוקמי גירסא · ${D.masechet} · ${s.perekName||s.perek||D.pages[s.from].daf}`;
    location.hash=`p=${cur}`;
  }
  function hl(h,q){const r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');return h.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(r,'<mark>$1</mark>')+'<')}
  function toDaf(pi){const si=secOf(pi);if(si!==cur)render(si);
    setTimeout(()=>{const e=$('#d'+pi);if(e)toEl(e);$('#curdaf').textContent=D.pages[pi].daf;$('#dafsel').value=pi},20)}
  function goDaf(d){const now=+$('#dafsel').value||0;toDaf(Math.max(0,Math.min(D.pages.length-1,now+d)))}
  function goScreen(d){const f=$('#flow');
    if(f.classList.contains('vert'))f.scrollBy({top:d*f.clientHeight*.9,behavior:'smooth'});
    else f.scrollBy({left:-d*f.clientWidth,behavior:'smooth'})}
  function fs(d){const r=document.documentElement;
    const v=Math.max(12,Math.min(60,parseFloat(getComputedStyle(r).getPropertyValue('--fs'))+d));setFs(v)}
  function setFs(v){document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('lg-fs',v);sizeBtns(v)}
  function sizeBtns(v){document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('on',+b.dataset.fs===+v))}
  function vert(){const v=$('#flow').classList.toggle('vert');
    localStorage.setItem('lg-vert',v?'1':'');$('#vbtn').classList.toggle('on',v)}
  function panel(id){const p=$('#'+id),o=p.classList.contains('open');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(!o)p.classList.add('open')}
  function dec(s){return s.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&')}
  function txt(u){return dec(u.a.replace(/<[^>]+>/g,'')+' '+u.l.map(l=>l[1].replace(/<[^>]+>/g,'')).join(' '))}
  function search(q){q=q.trim();LASTQ=q;const out=$('#sres');if(q.length<2){out.innerHTML='';return}
   RES=[];let res=RES,n=0;D.pages.forEach((p,pi)=>{for(const u of p.units){const t=txt(u);const k=t.indexOf(q);if(k>-1){n++;if(res.length<120)res.push({pi,id:u.id,daf:p.daf,s:t.slice(Math.max(0,k-40),k+60)})}}});
   out.innerHTML=`<div class="n">${n} תוצאות</div>`+res.map((r,i)=>`<div class="res"><a onclick="jumpR(${i})"><small>${r.daf}</small> …${esc(r.s).replace(esc(q),'<mark>'+esc(q)+'</mark>')}…</a></div>`).join('');
   $('#search').classList.add('open')}
  let RES=[],LASTQ='';function jumpR(i){jump(RES[i].pi,RES[i].id,LASTQ)}
  function jump(pi,id,q){const si=secOf(pi);render(si,q);
    setTimeout(()=>{const e=$('#u'+id);if(e){e.classList.add('hit');toEl(e)}$('#dafsel').value=pi;$('#curdaf').textContent=D.pages[pi].daf},20)}
  function amq(i){$('#q').value=D.am[i][0];search(D.am[i][0])}
  function build(){
   const ds=$('#dafsel');D.pages.forEach((p,i)=>ds.add(new Option(p.daf,i)));ds.onchange=()=>toDaf(+ds.value);
   const ps=$('#peresel');SEC.forEach((s,i)=>ps.add(new Option((s.perek||'רצף')+(s.perekName?' · '+s.perekName:''),i)));ps.onchange=()=>render(+ps.value);
   let t='',lp=-1;for(const [pi,id,s] of D.toc){const si=secOf(pi);
     if(si!==lp){lp=si;t+=`<h3>${esc(SEC[si].perek||'')} ${esc(SEC[si].perekName||'')}</h3>`}
     t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft-=e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
