  /* היחס בין גודל האות לרוחב השורה נעול. כל המידות נמדדות ב-em של גוף הטקסט:

  :root{--fs:24px;--measure:15.46em;--rail:5.15em;--gut:2.57em;

ה וָזֶה; וְנִכְנַס לַמִּקְדָּשׁ וְלֹא יָדַע, וּמִשֶּׁיָּצָא יָדַע "], ["", "הֲרֵי זֶה בְּעוֹלֶה וְיוֹרֵד. "], ["", "אֶחָד הַנִּכְנָס לָעֲזָרָה וְאֶחָד הַנִּכְנָס לְתוֹסֶפֶת הָעֲזָרָה, שֶׁאֵין מוֹסִיפִין עַל הָעִיר וְעַל הָעֲזָרוֹת אֶלָּא בְּמֶלֶךְ וְנָבִיא וְאוּרִים וְתוּמִּים וְסַנְהֶדְרִין שֶׁל שִׁבְעִים וְאֶחָד, וּבִשְׁתֵּי תּוֹדוֹת וּבְשִׁיר. "], ["", "וּבֵית דִּין מְהַלְּכִין, וּשְׁתֵּי תּוֹדוֹת וְכׇל יִשְׂרָאֵל אַחֲרֵיהֶם. "], ["", "<i class=\"hs\">החלה<\/i> הַפְּנִימִית נֶאֱכֶלֶת, וְהַחִיצוֹנָה נִשְׂרֶפֶת. "], ["", "וְכׇל שֶׁלֹּא נַעֲשֵׂית בְּכׇל אֵלּוּ – הַנִּכְנָס לְשָׁם אֵין חַיָּיב עָלֶיהָ. "], ["", "נִטְמָא בָּעֲזָרָה, וְנֶעֶלְמָה מִמֶּנּוּ טוּמְאָה וְזָכוּר אֶת הַמִּקְדָּשׁ; "], ["", "נֶעְלַם הֵימֶנּוּ מִקְדָּשׁ וְזָכוּר הַטּוּמְאָה; נֶעְלַם מִמֶּנּוּ זֶה וָזֶה; וְהִשְׁתַּחֲוָה אוֹ שֶׁשָּׁהָה בִּכְדֵי הִשְׁתַּחֲוָאָה אוֹ בָּא לוֹ בָּאֲרֻוכָּה – חַיָּיב. בַּקְּצָרָה – פָּטוּר. "], ["", "זוֹ הִיא מִצְוַת עֲשֵׂה שֶׁבַּמִּקְדָּשׁ שֶׁאֵין חַיָּיבִין עָלֶיהָ. "], ["", "וְאֵיזוֹ הִיא מִצְוַת עֲשֵׂה שֶׁבַּנִּדָּה שֶׁחַיָּיבִין עָלֶיהָ? "], ["", "הָיָה מְשַׁמֵּשׁ עִם הַטְּהוֹרָה וְאָמְרָה לוֹ ״נִטְמֵאתִי״, וּפֵירַשׁ מִיָּד – חַיָּיב, מִפְּנֵי שֶׁיְּצִיאָתוֹ הֲנָאָה לוֹ כְּבִיאָתוֹ. "], ["", "<i class=\"am\">ר&#x27;&#x27;א:<\/i> ״הַשֶּׁרֶץ וְנֶעְלַם מִמֶּנּוּ- עַל הֶעְלֵם שֶׁרֶץ חַיָּיב, ולא עַל הֶעְלֵם מִקְדָּשׁ. "], ["", "<i class=\"am\">ר&#x27;ע:<\/i> וְנֶעְלַם מִמֶּנּוּ וְהוּא טָמֵא עַל הֶעְלֵם טוּמְאָה חַיָּיב, ולא עַל הֶעְלֵם מִקְדָּשׁ. "], ["", "<i class=\"am\">רי&#x27;&#x27;ש:<\/i> וְנֶעְלַם וְנֶעְלַם שְׁתֵּי פְּעָמִים לְחַיֵּיב עַל הֶעְלֵם טוּמְאָה וְעַל הֶעְלֵם מִקְדָּשׁ."]], "id": 644}, {"k": "dh", "a": "שתים שהן ארבע", "l": [], "id": 665}, {"k": "u", "a": "ר&quot;פ לאביי:", "l": [["", "הרי שתים שהן שש הויין: ב-ידיעות הטומאה תחלה וסוף, ב- ידיעות הקודש תחלה וסוף, ב- ידיעות מקדש תחלה וסוף."]], "id": 666}, {"k": "u", "a": "אביי", "l": [["", "ולשיטתך שמונה הן, שבטומאה יש דקודש ודמקדש תחלה וסוף "]], "id": 668}, {"k": "u", "a": "אר&quot;פ:", "l": [["", "לעול ": "u", "a": "ולרי&quot;ו:", "l": [["", "משביע עדי קרקע <i class=\"hs\">אפי&#x27; לר&quot;א פטורין,<\/i>  <i class=\"am\">ונפק&#x27;&#x27;מ ר&quot;ע לר&quot;א:<\/i> עדי קנס."]], "id": 1784}, {"k": "u", "a": "ריה&quot;ג אומר:", "l": [["", "<i class=\"ps\">&#x27;והוא עד או ראה או ידע&#x27; <\/i>- בעדות המתקיימת בראיה בלא ידיעה ובידיעה בלא ראיה הכתוב מדבר."]], "id": 1786}, {"k": "u", "a": "ר&#x27;&#x27;פ לאביי:", "l": [["", "לימא, ריה&quot;ג לית ליה דר&#x27; אחא<i class=\"am\">. שאמר<\/i> גמל האוחר בין הגמלים ונמצא גמל הרוג בצידו - בידוע שזה הרגו. דאי ס&#x27;&#x27;ל כר&#x27;&#x27;א, בדיני נפשות נמי משכחת לה, כר&quot;ש בן שטח. <i class=\"am\">שאמר<\/i> אראה בנחמה, אם לא ראיתי אחד שרץ אחר חבירו לחורבה, ורצתי אחריו ומצאתי סייף בידו ודם מטפטף והרוג מפרפר, אמרתי לו: רשע, מי הרגו לזה, או אני או אתה? "], ["", "אבל מה אעשה שאין דמך מסור בידי, שהרי אמרה תורה: <i class=\"ps\">&#x27;על פי שנים עדים או שלשה עדים יומת המת&#x27;,<\/i> אלא המקום יפרע ממך."], ["", "אמרו: לא זזו משם עד שנשכו נחש ומת."]], "id": 1788}, {"k": "u", "a": "- ", "l": [["", "אפי&#x27; אי ס&#x27;&#x27;ל כר&#x27; אחא,  משכח&#x27;&#x27;ל ידיעה בלא ראיה, אבל ראייה בלא ידיעה איך שייך? וכי א&#x27;&#x27;צ לדעת אם הרג אוי או ישראל טריפה או שלם? "]], "id": 1792}, {"k": "u", "a": "<i class=\"b\">ש&quot;מ<\/i> שלריה&#x27;&#x27;ג:", "l": [["", "משביע עדי קנס - פטור, דאי חייב, נהי דידיעה בלא ראיה מצאנו אבל ראיה בלא ידיעה מי לא צריך לדעת אי נכרית בעל, בת ישראל בעל? בתולה בעל, בעולה בעל? "]], "id": 1794}]}, {"daf": "לד:", "perek": "פרק רביעי", "perekName": "שבועת העדות", "units": [{"k": "u", "a": "בעי ר&#x27;&#x27;י לפני רה&#x27;&#x27;מ י:", "l": [["", "מנה מניתיך בפני פלוני ופלוני ועדים רואין אותו מבחוץ, מאי? "]], "id": 1797}, {"k": "u", "a": "א&quot;ל רב המנונא:", "l": [["", "והלה מה טוען? אי אמר להד&#x27;&#x27;ם, הוחזק כפרן. אם אמר אכן לקחתי אבל שלי הוא אף אם באו עדים מאי הוה<i class=\"am\"> <\/i>"]], "id": 1799}, {"k": "u", "a": "<i class=\"am\">א&quot;ל ר&#x27;&#x27;י:<\/i>", "l": [["", "המנונא, את עול תא <i class=\"hs\ , "a": "פרק חמישי ", "l": [], "id": 1993}, {"k": "perek-name", "a": "שבועת הפקדון ", "l": [], "id": 1994}]}, {"daf": "לו:", "perek": "פרק חמישי", "perekName": "שבועת הפקדון", "units": [{"k": "perek-num", "a": "פרק חמישי", "l": [], "id": 1996}, {"k": "perek-range", "a": "לו:- לח:", "l": [], "id": 1997}, {"k": "m", "a": "", "l": [["", "מתני&#x27;."], ["", "<i class=\"b\">שְׁבוּעַת הַפִּקָּדוֹן<\/i> <i class=\"hs\"> הנשבע לשקר<\/i>"], ["", "נוֹהֶגֶת בַּאֲנָשִׁים וּבְנָשִׁים, בִּרְחוֹקִים וּבִקְרוֹבִים, בִּכְשֵׁרִים וּבִפְסוּלִים; "], ["", "בִּפְנֵי בֵּית דִּין וְשֶׁלֹּא בִּפְנֵי בֵּית דִּין – מִפִּי עַצְמוֹ; "], ["", "<i class=\"am\">לר&#x27;&#x27;מ <\/i>וּמִפִּי אֲחֵרִים – אֵינוֹ חַיָּיב עַד שֶׁיִּכְפְּרֶנּוּ בְּבֵית דִּין. "], ["", "<i class=\"am\">וחכ&#x27;&#x27;א:<\/i> בֵּין מִפִּי עַצְמוֹ בֵּין מִפִּי אֲחֵרִים כֵּיוָן שֶׁכָּפַר בּוֹ חַיָּיב. <i class=\"hs\">אף שלא בב&#x27;&#x27;ד<\/i> "], ["", "וְחַיָּיב עַל זְדוֹן הַשְּׁבוּעָה, וְעַל שִׁגְגָתָהּ עִם זְדוֹן הַפִּקָּדוֹן; וְאֵינוֹ חַיָּיב עַל שִׁגְגָתָהּ גְּרֵידְתָּא. וּמָה חַיָּיב עַל זְדוֹנָהּ? אָשָׁם בְּכֶסֶף <i class=\"hs\">שני <\/i>שְׁקָלִים. "], ["", "<i class=\"hs\">ב.<\/i>שְׁבוּעַת הַפִּקָּדוֹן כֵּיצַד? "], ["", "אָמַר לוֹ: ״תֵּן לִי פִּקְדוֹנִי שֶׁיֵּשׁ לִי בְּיָדְךָ״, ״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי״; "], ["", "אוֹ שֶׁאָמַר לוֹ: ״אֵין לְךָ בְּיָדִי״, ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ – הר&#x27;&#x27;ז חַיָּיב. "], ["", "הִשְׁבִּיעַ עָלָיו חָמֵשׁ פְּעָמִים, בֵּין בִּפְנֵי בֵּית דִּין וּבֵין שֶׁלֹּא בִּפְנֵי בֵּית דִּין, וְכָפַר – חַיָּיב עַל כׇּל אַחַת וְאַחַת. "], ["", "<i class=\"am\">אָמַר רַבִּי שִׁמְעוֹן:<\/i> מָה טַעַם? מִפְּנֵי שֶׁיָּכוֹל לַחֲזוֹר וּלְהוֹדוֹת. "], ["", "<i class=\"hs\">ג. <\/i>הָיוּ חֲמִשָּׁה תּוֹבְעִים אוֹתוֹ – אָמְרוּ לוֹ: ״תֵּן לָנוּ פִּקָּדוֹן שֶׁיֵּשׁ לָנוּ בְּיָדְךָ״; ״שְׁבוּעָה שֶׁאֵין לָכֶם בְּיָדִי״ – אֵינוֹ חַיָּיב אֶלָּא אַחַת."], ["", "״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי, וְלֹא לְךָ וְלֹא לָךְ״ – חַיָּיב עַל כׇּל אַחַת וְאַחַת."], ["", "<i class=\"am\"> \t\t\t\t\t\t\t\t\t\t\tרַבִּי אֱלִיעֶזֶר:<\/i> עַד שֶׁיֹּאמַר שְׁבוּעָה בָּאַחֲרוֹנָה. "], ["", "<i class=\"am\">\t\t\t\t\t\t\t\t\t\t\tר&#x27;&#x27;ש:<\/i> עַד שֶׁיֹּאמַר שְׁבוּעָה לְכׇל אֶחָד וְאֶחָד. "], ["", "״תֵּן לִי פִּקָּדוֹן וּתְשׂוּמֶת יָד גָּזֵל וַאֲבֵידָה שֶׁיֵּשׁ לִי בְּיָדְךָ״; "], ["", "״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי״ – אֵינוֹ חַיָּיב אֶלָּא אַחַת, "], ["", "״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי פִּקָּדוֹן וּתְשׂוּמֶת יָד וְגָזֵל וַאֲבֵידָה״ – חַיָּיב עַל כׇּל אַחַת וְאַחַת. "], ["", "״תֵּן לִי חִטִּין וּשְׂעוֹרִין וְכוּסְּמִין שֶׁיֵּשׁ לִי בְּיָדְךָ״; "], ["", "״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי״ – אֵינוֹ חַיָּיב אֶלָּא אַחַת, "], ["", "״שְׁבוּעָה שֶׁאֵין לְךָ בְּיָדִי חִטִּין וּשְׂעוֹרִין וְכוּסְּמִין״ – חַיָּיב עַל כׇּל אַחַת וְאַחַת. "], ["", "<i class=\"am\">ר&#x27;&#x27;מ:<\/i> אֲפִילּוּ אָמַר ״חִטָּה וּשְׂעוֹרָה וְכוּסֶּמֶת״ – חַיָּיב עַל כׇּל אַחַת וְאַחַת. "], ["", "<i class=\"hs\">ד. <\/i>״אָנַסְתָּ וּפִיתִּיתָ אֶת בִּתִּי״, וְהוּא אוֹמֵר: ״לֹא אָנַסְתִּי וְלֹא פִּיתִּיתִי״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר: ״אָמֵן״ – חַיָּיב. "], ["", "<i class=\"am\">רַבִּי שִׁמְעוֹן<\/i> פּוֹטֵר, שֶׁאֵינוֹ מְשַׁלֵּם קְנָס עַל פִּי עַצְמוֹ. <i class=\"am\">אָמְרוּ לוֹ:<\/i> אַף עַל פִּי שֶׁאֵינוֹ מְשַׁלֵּם קְנָס עַל פִּי עַצְמוֹ, מְשַׁלֵּם בּשֶׁת וּפְגָם עַל פִּי עַצְמוֹ. "], ["", "״גָּנַבְתָּ אֶת שׁוֹרִי״, וְהוּא אוֹמֵר ״לֹא גָּנַבְתִּי״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ - חַיָּיב. "], ["", "״גָּנַבְתִּי, אֲבָל לֹא טָבַחְתִּי וְלֹא מָכַרְתִּי״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ – פָּטוּר. "], ["", "״הֵמִית שׁוֹרְךָ אֶת שׁוֹרִי״, וְהוּא אוֹמֵר ״לֹא הֵמִית״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ – חַיָּיב. "], ["", "״הֵמִית שׁוֹרְךָ אֶת עַבְדִּי״, וְהוּא אוֹמֵר ״לֹא הֵמִית״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ – פָּטוּר. "], ["", "אָמַר לוֹ: ״חָבַלְתָּ בִּי וְעָשִׂיתָ בִּי חַבּוּרָה״, וְהוּא אוֹמֵר: ״לֹא חָבַלְתִּי וְלֹא עָשִׂיתִי בְּךָ חַבּוּרָה״; ״מַשְׁבִּיעֲךָ אֲנִי״, וְאָמַר ״אָמֵן״ – חַיָּיב. "], ["", "אָמַר לוֹ עַבְדּוֹ: ״הִפַּלְתָּ אֶת שִׁינִּי וְסִימִּיתָ א   function panel(id){const p=$('#'+id),o=p.classList.contains('open');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(!o)p.classList.add('open')}
  function dec(s){return s.replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&amp;/g,'&')}
  function txt(u){return dec(u.a.replace(/<[^>]+>/g,'')+' '+u.l.map(l=>l[1].replace(/<[^>]+>/g,'')).join(' '))}
  function search(q){q=q.trim();LASTQ=q;const out=$('#sres');if(q.length<2){out.innerHTML='';return}
   RES=[];let res=RES,n=0;D.pages.forEach((p,pi)=>{for(const u of p.units){const t=txt(u);const k=t.indexOf(q);if(k>-1){n++;if(res.length<120)res.push({pi,id:u.id,daf:p.daf,s:t.slice(Math.max(0,k-40),k+60)})}}});
   out.innerHTML=`<div class="n">${n} תוצאות</div>`+res.map((r,i)=>`<div class="res"><a onclick="jumpR(${i})"><small>${r.daf}</small> …${esc(r.s).replace(esc(q),'<mark>'+esc(q)+'</mark>')}…</a></div>`).join('');
   $('#search').classList.add('open')}
  let RES=[],LASTQ='';function jumpR(i){jump(RES[i].pi,RES[i].id,LASTQ)}
  function jump(pi,id,q){const si=secOf(pi);render(si,q);
    setTimeout(()=>{const e=$('#u'+id);if(e){e.classList.add('hit');e.scrollIntoView({inline:'center',block:'nearest'})}$('#dafsel').value=pi;$('#curdaf').textContent=D.pages[pi].daf},20)}
  function amq(i){$('#q').value=D.am[i][0];search(D.am[i][0])}
  function build(){
   const ds=$('#dafsel');D.pages.forEach((p,i)=>ds.add(new Option(p.daf,i)));ds.onchange=()=>toDaf(+ds.value);
   const ps=$('#peresel');SEC.forEach((s,i)=>ps.add(new Option((s.perek||'רצף')+(s.perekName?' · '+s.perekName:''),i)));ps.onchange=()=>render(+ps.value);
   let t='',lp=-1;for(const [pi,id,s] of D.toc){const si=secOf(pi);
     if(si!==lp){lp=si;t+=`<h3>${esc(SEC[si].perek||'')} ${esc(SEC[si].perekName||'')}</h3>`}
     t+=`<a onclick="jump(${pi},${id})"><small class="n">${esc(D.pages[pi].daf)}</small> ${esc(s)}</a>`}
   $('#tocb').innerHTML=t;
   $('#amb').innerHTML=`<div class="n">${D.nAm} אזכורי אמוראים מסומנים בקובץ; ${D.nPsk} ציטוטי פסוקים שונים</div><div class="chips">`+D.am.map((a,i)=>`<a class="tag" onclick="amq(${i})">${esc(a[0])} <span class="n">${a[1]}</span></a>`).join('')+'</div>';
   $('#qab').innerHTML=D.qa.length?D.qa.map(q=>`<div class="res"><b>${q[0]}</b>: ${esc(q[1])}</div>`).join(''):'לא נמצאו חריגות';
   const sv=+localStorage.getItem('lg-fs');if(sv)setFs(sv);else sizeBtns(24);
   if(localStorage.getItem('lg-vert')){$('#flow').classList.add('vert');$('#vbtn').classList.add('on')}
   $('#flow').addEventListener('wheel',e=>{const f=$('#flow');if(f.classList.contains('vert'))return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft+=SGN*e.deltaY;e.preventDefault()}},{passive:false});
   document.addEventListener('keydown',e=>{
     if(e.target.tagName==='INPUT')return;
     if(e.key==='PageDown'||e.key===' '){goScreen(1);e.preventDefault()}
     if(e.key==='PageUp'){goScreen(-1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowLeft'){goDaf(1);e.preventDefault()}
     if(e.ctrlKey&&e.key==='ArrowRight'){goDaf(-1);e.preventDefault()}
     if(e.ctrlKey&&(e.key==='='||e.key==='+')){fs(2);e.preventDefault()}
     if(e.ctrlKey&&e.key==='-'){fs(-2);e.preventDefault()}
     if(e.key==='Escape')document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'))});
   render(+(params.get('p')||0));
  }
  build();
  </script></body></html>
