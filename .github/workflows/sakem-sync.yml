name: סכם - סנכרון התור וההצעות
# פרומפט 15 (28.10.2026). "סכם פרק" בדף נכנס לתור בנקודת הקליטה; כאן הוא יורד
# לריפו (data/sakem/queue), והצעות שהמשימה המתוזמנת בענן כתבה (data/sakem/out)
# עולות חזרה לשרת, וההכרעות של פרק שנסקר יורדות ללמידה (data/sakem/decisions).
# הסבר מלא: docs/sakem-runner.md
on:
  schedule:
    # פרומפט 51: ארבע פעמים ביום במקום כל רבע שעה (פעולות אוטומטיות ביום: חד-ספרתי). הצעות שנכתבו עולות מיד בדחיפה.
    - cron: '7 1,7,13,19 * * *'
  push:
    branches: [main]
    paths: ['data/sakem/out/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sakem-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 400
      - name: סנכרון
        env:
          LEOKMEI_ADMIN_KEY: ${{ secrets.LEOKMEI_ADMIN_KEY }}
        run: python tools/sakem/sync.py
      # פרומפט 63 (18.11.2026): מסכתות שמיכאל ביקש לקבל בהן הכל (data/sakem/auto-accept.json) - כל הצעה שעלתה נסגרת מיד,
      # ואינה מגיעה ל"מוכן לסקירה". נכשל - הסנכרון עצמו כבר עבר, והכישלון רועש בשלב הזה בלבד
      - name: קבלה אוטומטית
        env:
          LEOKMEI_ADMIN_KEY: ${{ secrets.LEOKMEI_ADMIN_KEY }}
        run: |
          S=$(python3 -c "import json;print(' '.join(json.load(open('data/sakem/auto-accept.json'))))" 2>/dev/null || true)
          [ -n "$S" ] || exit 0
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p data/sakem/accept; rc=0
          for s in $S; do python tools/sakem/close_slug.py --slug "$s" --out "data/sakem/accept/$s-auto-$(TZ=Asia/Jerusalem date +%Y%m%d-%H%M).json" || rc=1; done
          exit $rc
      - name: שמירה בריפו
        if: always()
        run: |
          git config user.name "leokmei-sakem"
          git config user.email "sakem@leokmei.com"
          git add data/sakem
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "סכם: סנכרון התור וההצעות [skip ci]"
          # 29.10: שתי הרצות בבת אחת התנגשו ב-sync-state.json, והלולאה נכשלה בשקט עם "הצלחה".
          # במצב התנגשות - הגרסה של הרצה זו (החדשה) גוברת; ואם הדחיפה לא עלתה - כישלון רועש.
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -q -X theirs && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::error::הדחיפה לריפו נכשלה שלוש פעמים"; exit 1; fi
